var VINDEX = [{"url": "/download", "title": "下载 AiVerse", "text": "AiVerse ← 返回首页 下载 AiVerse 检测 GitHub 最新版本（含预览版），选择适合你设备的安装包下载。 正在检测最新版本… 正在从 GitHub 拉取版本信息… 在 GitHub 查看所有版本 →"}, {"url": "/", "title": "AiVerse - 手机端 AI 编程工具与内置 Linux 终端", "text": "AiVerse 手机上的 AI 编程工具与移动工作站 无需电脑，在手机上即可完成从写代码、调试到提交的完整开发流程。内置 Linux 容器与终端，AI Agent 可自主读写文件、执行 Shell 命令与运行构建，还支持 Git、MCP、远程 SSH 与完整模型生态。 快速上手 下载 APK GitHub GitCode"}, {"url": "/terms", "title": "用户协议 - 手机端 AI 编程工具与终端", "text": "AiVerse 用户协议 ​ 最后更新：2026 年 10 月 23 日 AiVerse（以下简称“本应用”）是一款运行在 Android 上的开源 AI 编程工具，由开发者维护。本协议说明使用本应用时的权利、义务及重要风险，请结合 隐私政策 阅读。 一、阅读与确认 ​ 使用本应用前，请阅读本用户协议和隐私政策，再决定是否同意。选择“同意并继续”后，应用会保存你的确认状态；选择不同意则退出应用。 你可以通过“设置 → 关于”中的“用户协议”和“隐私政策”入口随时查看全文。 本协议适用于本应用的使用，不替代第三方服务条款，也不限制你依法或依据 GPL-3.0 享有的权利。 二、功能与 AI 生成风险 ​ 本应用提供 AI 对话与编程辅助、文件编辑、终端与本地 Linux 容器、Git、远程 SSH、浏览器、MCP、技能、子代理及备份等功能。具体可用能力取决于设备、配置、权限和所连接的服务。 AI 生成的代码、命令、解释、图片及其他内容可能存在错误、遗漏、安全漏洞、侵权风险或不适合你的实际场景。AI 回复不是对准确性、安全性、合法性或适用性的保证，也不应替代必要的专业判断。请在采用、执行、发布或部署前自行审查，并按需测试、核实来源及取得授权。 三、命令、文件与服务器操作风险 ​ AI 和工具可能在你选择的运行模式及授权范围内读取、修改、覆盖或删除文件，执行命令、安装依赖、访问网络、操作 Git 仓库，以及连接或修改远程服务器。部分操作可能连续执行，并非每一步都会单独请求确认。 错误指令、模型判断失误、不可信项目内容或第三方工具可能导致数据丢失、凭据泄露、服务中断、配置损坏或意外费用。权限控制、检查点和撤销功能不能保证防止或恢复所有损失；本地容器也不等于对已挂载目录、网络资源或远程服务器的绝对隔离。 请确认目标设备、目录、仓库和服务器的操作权限，按需限制工具授权；对删除、覆盖、推送、部署、系统命令及生产环境操作尤其谨慎。不要把不希望发送给第三方的秘密放入 AI 可读取的文件、规则或命令输出中。 四、合法使用与他人权益 ​ 你应遵守适用的法律法规，尊重他人的隐私、知识产权和系统安全，并遵守合法有效的服务约定。不得利用本应用实施未经授权的入侵、数据窃取或泄露、恶意软件传播、诈骗及其他违法或侵权行为。 进行逆向工程、安全研究、互操作性分析或漏洞测试等活动时，应在法律允许的范围内进行，并在依法需要时取得相应授权，不得侵犯他人合法权益。你应核实上传的代码、文件及其他资料是否有权使用、处理或提供给相关服务，并在分发成果时遵守适用许可证。 五、第三方服务与费用 ​ AI 模型、搜索、网站、MCP 服务、软件仓库、Git 托管、远程服务器及 WebDAV、S3 等存储服务可能由第三方提供，其可用性、内容、数据处理、计费和退款规则由相应服务及你与其的约定决定。供应商预设或集成入口不代表开发者对第三方的担保或背书。 你需要自行选择和配置服务、保管账号及 API Key，并核实价格、额度、权限和数据处理政策。AI 对话、工具调用、自动重试、上下文压缩、标题生成、生图、子代理，以及服务器、存储和网络流量等均可能产生费用。应用显示的用量或费用可能只是估算，实际账单以相关服务记录和约定为准。开源许可不代表第三方服务免费。 六、数据、隐私与备份 ​ 本应用的数据保存、联网传输、日志、权限及删除方式见 隐私政策 。使用 AI 或远程功能时，相关内容可能发送到所选服务；请在使用前了解其政策。 请定期备份重要代码、配置和数据，并核验备份能否恢复。检查点、Git 历史和同步不能替代独立备份。卸载、清除应用数据、误操作、设备故障或远程服务异常可能导致数据无法恢复。备份加密是可选的；包含敏感内容时请设置强密码并妥善保管，开发者无法替你找回遗失的密码或未保存的数据。 七、开源许可与权利保留 ​ 本应用依据 GPL-3.0 开源，源代码见 GitHub 仓库 。你依据该许可证享有的运行、研究、复制、修改和再分发等权利不受本协议限制；行使这些权利时应遵守许可证的相应条件。第三方组件适用各自许可证。 如本协议与 GPL-3.0 对其所授予权利的规定发生冲突，以 GPL-3.0 为准。启动确认流程不构成对上述开源权利的额外限制。 八、保证与责任边界 ​ 在适用法律允许的范围内，本应用按“现状”和“现有可用”提供，开发者及贡献者不承诺其始终无错误、不中断、适用于特定目的，或能防止所有安全事件和数据损失。对于 AI 输出、第三方服务及你选择执行的操作，应结合具体情况评估风险。 任何不提供保证或限制责任的约定，均仅在适用法律允许的范围内有效。 本协议不免除或限制依法不得免除或限制的责任，包括适用法律不允许排除的故意、重大过失、人身损害等责任，也不排除你的法定权利。因具体事件产生的责任，应依据适用法律、实际过错、因果关系及相关事实确定，不因本协议而一概由用户承担。 九、协议更新 ​ 开发者可能因功能变化或法律要求更新本协议，并在本页标明最后更新日期。涉及重要权利义务的实质变更，将通过应用提示或项目公告等合理方式说明，并在法律要求时重新征求同意；不会仅以发布新文本代替依法所需的通知或同意。不同意更新时，你可以停止使用相关功能或应用，但这不影响 GPL-3.0 已授予的权利。 十、联系我们 ​ 如对本协议或本应用有疑问，可通过以下方式联系。GitHub Issues 是公开渠道，请勿提交 API Key、密码或含敏感内容的日志。 联系邮箱：qlqqyx@qq.com GitHub Issues： https://github.com/yhdmgf/AiVerse/issues 项目主页： https://github.com/yhdmgf/AiVerse"}, {"url": "/privacy", "title": "隐私政策 - 手机端 AI 编程工具与终端", "text": "AiVerse 隐私政策 ​ 最后更新：2026 年 10 月 23 日 AiVerse（以下简称“本应用”）是一款运行在 Android 上的开源 AI 编程工具（GPL-3.0 协议）。本政策说明本应用如何处理你的信息。 开发者不通过自营业务后端收集或集中保存你的聊天、工作区文件和凭据，也不出售这些数据。 本应用主要在设备本地保存配置和会话，但这不意味着所有数据都只在本机处理：使用 AI、联网搜索、远程服务器、远程备份等功能时，相关内容会发送到相应服务；应用也会为更新和获取公开配置发起网络请求。 一、账号与信息收集 ​ 本应用 不设自有账号系统 ，无需注册 AiVerse 账号。GitHub 等第三方集成功能可能需要登录或授权相应服务，并在设备上保存授权凭据。 本应用 不内置统计、埋点、广告或崩溃上报 SDK ，不会为使用分析或广告目的自动上传你的操作记录、聊天内容或日志。 应用会在本地记录运行和崩溃诊断信息，详见第二节；本地记录不等于自动上传。 开发者不会通过本应用远程读取你的设备数据。如果你主动提交 Issue、复制崩溃信息或分享日志，其中的内容会提供给你选择的接收方；请先检查并移除敏感信息。 二、数据的保存位置与日志 ​ 本应用处理的数据包括： 配置与凭据 ：模型供应商、API Key、服务端点，以及你配置的服务器、Git、备份等连接和授权信息。 聊天与 AI 上下文 ：聊天记录、会话历史、附件、项目规则、记忆及工具执行结果等。 工作区与环境文件 ：代码、文件、容器镜像和本地 Linux 环境数据。 偏好设置、诊断日志与备份文件 。 配置和会话等数据主要保存在应用私有存储中；日志可能保存在应用专属的外部存储目录。默认本地工作区位于应用私有目录，但你选择的 外部工作区 保存在相应设备目录中， 远程工作区 保存在目标服务器上。导出文件和备份保存在你选择的位置，不一定处于应用私有目录。 日志可能包含敏感内容。 AI 请求与响应日志会记录请求地址、对话上下文、代码、工具结果、模型回复和错误信息等。应用会对部分媒体内容作脱敏处理，但 不保证识别或移除文本、网址及工具输出中的密码、令牌或个人信息 。崩溃诊断还可能包含设备型号、系统版本、内存情况和错误堆栈，不会自动上报。 运行日志和 AI 日志设有容量限制及旧文件清理机制；初始化日志时会清理超过 7 天未更新的相应日志文件。这不是所有数据在 7 天后必然删除的承诺，仍在更新的日志、会话、导出副本和备份有各自的生命周期。删除聊天也不等于同步删除已经生成的日志或备份。 三、联网与向第三方传输数据 ​ 基础联网请求 ​ 公开配置与目录 ：应用启动时会根据缓存情况获取模型元数据、供应商预设和容器镜像目录，请求可能经过 GitHub 及 jsDelivr 等分发节点。这些请求用于下载公开数据，不附带你的聊天、工作区内容或 API Key。 检查与下载更新 ：自动检查更新默认开启，可在设置中关闭。检查会请求 GitHub Releases 接口；更新包下载可能经过设置中的第三方镜像，默认使用 gh-proxy 镜像，也可修改或留空以直连 GitHub。 环境与网络功能 ：下载容器镜像、安装软件包或使用开发工具时，会访问相应镜像站、软件仓库或目标服务；代理连通性检测也可能请求外部检测站点。 这些服务及网络中间节点可能收到 IP 地址、请求时间、请求头和资源路径等网络信息。 不上传聊天内容并不等于不产生网络信息。 使用功能产生的数据传输 ​ AI 模型供应商 ：对话内容及相关上下文会发送到所选模型服务。除你手动发送的代码、文件和图片外，上下文还可能包括自动加载的项目规则、记忆与技能清单，以及 AI 通过工具读取的文件、命令输出和其他执行结果。标题生成、上下文压缩等辅助 AI 功能也可能提交相关内容。生图功能使用你为其配置的模型服务，可能与对话供应商不同，并可能从服务返回的地址下载图片。 联网搜索、网页抓取与浏览器 ：内置联网搜索会将查询内容发送到 Parallel 的搜索服务；网页抓取和浏览器会请求目标网站。浏览器将非网址输入作为搜索词时，会发送到默认搜索引擎 Bing。查询、网址或页面交互可能包含你或 AI 提供的信息。 MCP 服务 ：调用 MCP 工具时，相应参数会交给你配置的本地进程或远程服务器；本地 MCP 进程也可能自行联网。工具返回的结果可能继续进入 AI 上下文。 远程服务器与开发服务 ：SSH、SFTP、Git 以及终端中的联网命令会向相应服务器传输认证信息、命令、文件或仓库内容。GitHub 授权会与 GitHub 交换授权信息，并获取所需的账号或安装信息。开启凭据注入时，相关凭据也会写入对应的本地环境或远程服务器。 远程备份 ：你可以将所选备份内容上传到配置的 WebDAV 或 S3 兼容存储。备份可能包含会话、配置、凭据或工作区文件，具体以导出时选择的范围为准；备份加密说明见第五节。 文件共享 ：开启内置 FTP 服务后，获准连接的客户端可以访问共享目录，并可能具有写入权限；启用匿名访问会扩大可访问范围。通过系统文件选择器授权其他应用访问工作区，或主动分享文件时，相应内容也会提供给接收方。 第三方对数据的保存、使用、删除及可能的跨境处理，受其政策和你与其约定的条款约束。请在使用前了解相应服务的数据处理方式，不要把不希望外发的秘密放入 AI 可读取的文件、规则或命令输出中。 四、权限说明 ​ 本应用根据功能使用网络、存储、通知、前台服务、唤醒锁等权限，并可能请求安装未知应用、忽略电池优化等特殊访问权限。Shizuku 功能需要你额外授权，授权后可用于执行系统命令。 网络等部分权限由系统在安装时授予，不会逐次弹窗；需要运行时授权或特殊访问授权的功能，会按系统机制申请。你可以拒绝或撤销相应授权，但依赖这些授权的功能会受到影响。详细说明见 软件权限 。 五、数据安全与备份 ​ 应用私有数据受 Android 应用沙盒等机制保护，但这不是对 Root、设备被攻破、系统缺陷或你主动授权共享等情形的绝对保障。外部目录、远程服务器和导出文件的安全还取决于相应环境。 API Key 等部分敏感配置使用 Android Keystore 相关机制保护；这不代表所有凭据、日志、环境文件或备份都经过加密。提供给开发工具使用的凭据可能以工具所需格式写入本地环境或远端。 备份加密是可选的。设置密码后，导出内容会加密；未设置密码时，备份文件本身不加密。 远程备份同样遵循此规则，压缩打包本身不能保护内容。请为包含敏感信息的备份设置强密码，并妥善保存密码。 自定义 HTTP 端点、普通 FTP 或其他未加密连接可能使内容在传输中暴露。请优先选择支持加密传输的服务，并谨慎授权 AI 工具、第三方进程与文件共享功能。 六、数据删除 ​ 你可以在应用内删除聊天、配置或工作区，并通过相应文件管理和日志功能清理不再需要的数据。 卸载本应用或清除应用数据会清除应用私有数据，但不等于删除所有相关副本。 外部工作区文件、导出文件、下载文件以及你保存到其他位置的备份，可能仍然保留，需要另行清理。 移除外部工作区通常只解除应用与目录的关联，不删除其中的文件。远程工作区和远程备份也不会因"}, {"url": "/advanced/plugin-dev", "title": "插件开发指南 - 手机端 AI 编程工具与终端", "text": "插件开发指南 ​ AiVerse 提供 脚本插件 系统：用 JavaScript 编写插件，向 AI Agent 注册自定义工具，并借助 ctx API 访问宿主能力（网络、文件、剪贴板、状态存储等）。本文先介绍插件能干什么与最小插件写法，帮助快速上手。 提示 本文是简明入门。插件清单字段与 ctx API 与 OpenX 插件规范对齐，但以 AiVerse 实际实现为准；App 内「插件管理」与插件详情可查看已安装插件。 插件能干什么 ​ 注册自定义工具 ：向 AI Agent 增加可调用工具，AI 依据 description 与 parameters 决定是否调用。 网络请求 ： ctx.httpFetch 支持自定义请求头/请求体——这是 TTS 接口插件化 的基础。 文件读写 ：在插件目录沙箱内读写、删除、列出文件，防目录穿越。 状态与存储 ： state （会话级内存）、 store （持久化到 store.properties ）。 剪贴板与通知 ：读写剪贴板、发 Toast 与系统通知。 调用已有工具 ： ctx.callTool 调用 AiVerse 自动授权工具。 多插件隔离 ：每个插件独立 QuickJS 运行时，互不干扰。 一个最小插件 ​ 插件是一个目录： hello/├── plugin.json   # 清单（必需）└── main.js       # 工具入口（必需） plugin.json ： {\"package\": \"my.hello\",\"name\": \"Hello 插件\",\"version\": \"1.0.0\",\"description\": \"我的第一个插件\",\"main\": \"main.js\",\"permissions\": [\"network\"]} main.js 注册工具： var $ptools = $ptools || [];$ptools.push({  name: 'greet',  description: '向某人问好。',  parameters: {    type: 'object',    properties: { who: { type: 'string', description: '打招呼的对象' } },    required: ['who']  },  handler: function (args) {    return JSON.stringify({ ok: true, message: '你好，' + args.who });  }}); 打包成 zip，在 插件管理 → 右上角「+」→ 添加压缩包插件 导入。工具名规则： {包名}_{工具名} （如 my_hello_greet ），包名前缀用于整体卸载。 TTS 接口插件化 ​ 用 ctx.httpFetch 可适配任意 TTS 接口：自定义请求头（鉴权 Key 等）与请求体（模型、音色、文本），把任意 /v1/tts 类接口接入朗读。App 内置在线 TTS 已支持 OpenAI 兼容与 Fish Audio 协议；更多接口可在「设置 → 朗读 → 在线 TTS 接口」通过自定义请求头/请求体覆盖。 ctx API 一览 ​ 方法 说明 权限 showToast(msg) 弹短提示 — notify(title, body) 发通知 notify httpFetch(url, options) HTTP 请求（method/headers/body） network fileRead / fileWrite / fileDelete / fileList 插件沙箱内文件操作 file / file:write stateGet / stateSet 会话级状态 — storeGet / storeSet / storeRemove 持久化存储 — clipboardGet / clipboardSet 剪贴板 clipboard callTool(name, args) 调已有自动授权工具 — 权限 ​ 在 plugin.json 的 permissions 声明，不声明则不可用： network 、 file 、 file:write 、 clipboard 、 notify （ server 预留）。危险权限（network / file:write / clipboard）安装时橙色提示需用户确认。"}, {"url": "/advanced/adb-wireless-debug", "title": "用 adb 无线调试其他设备 - 手机端 AI 编程工具与终端", "text": "用 adb 无线调试其他设备 ​ 在 AiVerse 的 Linux 容器里安装好 adb，即可通过无线调试（Android 11 及以上）连接另一台 Android 手机，或连接 AiVerse 所在的这台手机本身——全程不需要电脑。 适用场景 ​ 调试另一台手机 ：安装应用、抓日志、截屏、模拟输入、上传下载文件。 调试本机 ：在 AiVerse 里对正在使用的这台手机执行同样的操作。 需要 root 权限的操作不适用：adb 以 shell （uid 2000）身份运行。 环境基线 ​ 项 值 系统 Debian GNU/Linux 12 (bookworm) aarch64（PRoot 容器） adb 34.0.5（Debian backports；仓库默认版本过旧，缺少 pair 命令） 目标设备 Android 11 及以上（本文实测 Android 15 与 Android 16） 网络 调试另一台手机时两台设备需在同一局域网；调试本机走 127.0.0.1 ，不依赖局域网 权限 shell（uid 2000），非 root 1. 安装 adb ​ 容器仓库自带的 adb 版本过旧，缺少无线调试所需的 pair 命令，需要从 backports 安装： bash apt update apt install -y -t bookworm-backports adb adb version # 应输出 Version 34.x 注意 ：adb 安装在容器系统目录，重装容器后需要重新安装，配对记录也会一并丢失。 2. 配对（只需一次） ​ 先在目标手机上操作： 设置 → 关于手机 → 连点「版本号」7 次，开启开发者选项； 开发者选项 → 打开「无线调试」； 点「使用配对码配对设备」，屏幕会显示 IP 地址和端口 与 6 位配对码 。 建议把「无线调试」设置页与 AiVerse 分屏显示，边看边操作——配对对话框一旦被切走或关闭，端口和配对码就立即失效了。配对端口也可以用文末的脚本自动发现，只有 6 位配对码必须读屏幕。 回到 AiVerse 终端，把端口和配对码换成屏幕上的值： bash adb pair 192.168.1.23:37123 123456 # 成功会输出 Successfully paired to ... 注意 ：配对端口和配对码存活时间很短，对话框一关闭就立即失效，需要重新打开。配对成功后设备会记住这台主机，之后不必再配对。 3. 连接 ​ bash adb connect 192.168.1.23:40001 adb devices -l 192.168.1.23:40001 是无线调试主页显示的「IP 地址和端口」，注意它与配对用的端口不是同一个。 连接端口每次重新打开无线调试都会变化，可以重新查看手机屏幕，或用文末脚本自动发现。 4. 调试本机 ​ 调试 AiVerse 所在的这台手机时，地址用 127.0.0.1 （容器与手机共享网络，不依赖局域网）： bash adb pair 127.0.0.1:37123 123456 adb connect 127.0.0.1:40001 adb devices 注意 ：用手机的局域网 IP 也能连，但同一台设备会同时出现两条记录（一条 127.0.0.1 、一条局域网 IP），用 adb -s <序列号> 指定设备，或 adb disconnect 去掉多余的那条。 调试本机的价值在于：Android 限制普通应用直接调用系统命令（ screencap 、 pm 、 dumpsys 等会被拒绝），而以 shell 身份通过 adb 执行则不受此限制。 常用操作 ​ bash adb shell getprop ro.product.model # 设备型号 adb shell pm list packages # 已安装应用 adb shell logcat -d # 导出当前日志 adb exec-out screencap -p > screen.png # 截屏 adb push local.txt /sdcard/ # 上传文件 adb pull /sdcard/photo.jpg ./ # 下载文件 adb shell input keyevent KEYCODE_HOME # 模拟按键 安装应用用 adb install app.apk ，部分设备还需要在开发者选项里允许「通过 USB 安装应用」。 这些命令都以 shell 用户身份运行，可以读写 /sdcard ，但无法访问 /data/data 等受限目录。 常见问题 ​ 报错 protocol fault (couldn't read status message) 最常见的原因是配对端口已失效（对话框关闭或重新打开过），重新打开对话框、用新的端口和配对码再配一次即可。如果端口确认是最新的仍报此错，直接重试同一条命令——部分 adb 版本存在该已知问题，第二次往往就能成功。 报错 failed to connect to ...: Connection refused 连接端口过期，或设备尚未配对。重新查看无线调试主页的端口，必要时重新配对。 每个新终端都要重新连接 adb 服务随终端会话结束而退出，新会话里需要重新执行 adb connect 。把 adb start-server 、 adb connect 和后续命令放在同一个终端里执行即可。 adb mdns services 列表为空 容器里 adb 自带的 mDNS 发现无法工作——它需要的 5353 端口已被手机系统的 mDNS 服务占用。这不影响手动连接，自动发现请用下面的脚本。 附：自动发现端口 ​ 无线调试开启后，设备会在局域网广播 _adb-tls-pairing._tcp （配对服务，仅在配对对话框打开时）和 _adb-tls-connect._tcp （连接服务）。把下面的脚本保存为 discover_adb.py ，运行后将分别列出两者的「IP:端口」： python #!/usr/bin/env python3 \"\"\"扫描局域网中的 adb 无线调试端点\"\"\" import socket import struct import time SERVICES = { '配对端口' : '_adb-tls-pairing._tcp.local' , '连接端口' : '_adb-tls-connect._tcp.local' , } def encode (name): out = b '' for part in name.split( '.' ): out += bytes ([ len (part)]) + part.encode() return out + b ' \\x00 ' def read_name (data, off): labels, jumped, start = [], False , off while True : length = data[off] if length == 0 : off += 1 break if lengt"}, {"url": "/advanced/build-android-app", "title": "在容器中编译 Android 应用 - 手机端 AI 编程工具与终端", "text": "在容器中编译 Android 应用 ​ 在 AiVerse 的 Linux 容器里配置好 JDK 与 Android SDK，即可直接从源码编译 Android 应用。本文以 Debian 12 (bookworm) aarch64 为例，Ubuntu、Arch 等发行版同样适用。 建议使用自定义 Debian / Ubuntu 镜像 内置的 Alpine 容器使用 musl libc，在 PRoot 下编译 Android 应用需要额外处理（见文末补充）。导入自定义镜像的方法见「自定义容器镜像」。 环境基线 ​ 项 值 系统 Debian GNU/Linux 12 (bookworm) aarch64 JDK OpenJDK 17 Gradle 项目 wrapper 自带，无需系统安装 SDK Android 36 / build-tools 35.0.0 aapt2 ARM64 静态编译版 35.0.2（社区构建） 1. 安装基础依赖 ​ bash apt update apt install -y openjdk-17-jdk-headless curl wget unzip ripgrep 验证 JDK： bash /usr/lib/jvm/java-17-openjdk-arm64/bin/java -version # 应输出 openjdk version \"17...\" 2. 安装 Android SDK ​ 默认使用国内镜像安装（下载更快、更稳）。除 sdkmanager 本体（cmdline-tools）需手工下载解压外，其余组件通过 SDK_TEST_BASE_URL 环境变量覆盖 sdkmanager 的默认仓库根 URL（需以 / 结尾，镜像需提供 repository2-3.xml ），一条命令全部装完（ --list 与 --install 均已实测可用）： bash # 唯一手工步骤：获取 sdkmanager 本体（从镜像下载） mkdir -p ~/android/sdk && cd ~/android/sdk curl -fL -C - -o clt.zip https://mirrors.cloud.tencent.com/AndroidSDK/commandlinetools-linux-13114758_latest.zip unzip -q clt.zip mkdir -p cmdline-tools/latest && mv cmdline-tools/ * cmdline-tools/latest/ # 组件全部走镜像安装（自动处理目录布局与许可接受） export JAVA_HOME = /usr/lib/jvm/java-17-openjdk-arm64 export ANDROID_HOME = $HOME/android/sdk export PATH = $ANDROID_HOME/cmdline-tools/latest/bin:$PATH export SDK_TEST_BASE_URL = https://mirrors.cloud.tencent.com/AndroidSDK/ yes | sdkmanager --install \"platforms;android-36\" \"build-tools;35.0.0\" \"platform-tools\" 版本说明 按目标项目的 compileSdk 和 buildToolsVersion 选择组件版本，本文示例为 Android 36 / build-tools 35.0.0。 镜像与官方源 SDK_TEST_BASE_URL 虽为测试用途的环境变量（非官方文档化的常规配置），但已被镜像方案广泛使用。镜像安装的 SDK 与官方安装完全等价：即使网络可直接访问 dl.google.com ，也无需还原为官方流程。若该方式在特定场景下失效，可改用官方源（见下）或手工组装。 可选：官方源安装 ​ 若网络可直连 dl.google.com ，也可使用官方标准流程： bash mkdir -p ~/android/sdk && cd ~/android/sdk curl -O https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip unzip -q commandlinetools-linux- * .zip mkdir -p cmdline-tools/latest && mv cmdline-tools/ * cmdline-tools/latest/ export JAVA_HOME = /usr/lib/jvm/java-17-openjdk-arm64 export ANDROID_HOME = $HOME/android/sdk export PATH = $ANDROID_HOME/cmdline-tools/latest/bin:$PATH yes | sdkmanager --install \"platforms;android-36\" \"build-tools;35.0.0\" \"platform-tools\" 备选：从镜像手工组装 SDK ​ 若 SDK_TEST_BASE_URL 方式不可用，可从腾讯云镜像下载组件 zip 手工组装，最终得到 build-tools/ 、 platforms/ 、 platform-tools/ 三个目录，效果与 sdkmanager 一致： 组件 镜像地址 commandlinetools https://mirrors.cloud.tencent.com/AndroidSDK/commandlinetools-linux-13114758_latest.zip platform-36 https://mirrors.cloud.tencent.com/AndroidSDK/platform-36_r01.zip build-tools 35.0.0 https://mirrors.cloud.tencent.com/AndroidSDK/build-tools_r35_linux.zip platform-tools https://mirrors.cloud.tencent.com/AndroidSDK/platform-tools_r35.0.2-linux.zip bash cd /workspace curl -L -O https://mirrors.cloud.tencent.com/AndroidSDK/platform-36_r01.zip curl -L -O https://mirrors.cloud.tencent.com/AndroidSDK/build-tools_r35_linux.zip curl -L -O https://mirrors.cloud.tencent.com/AndroidSDK/platform-tools_r35.0.2-linux.zip # 1) build-"}, {"url": "/advanced/build-flutter-release", "title": "在容器中构建 Flutter release APK - 手机端 AI 编程工具与终端", "text": "在容器中构建 Flutter release APK ​ 《在容器中编译 Flutter 应用》完成了 debug 包的构建链路。本文在同一套 Debian 12 (bookworm) aarch64 PRoot 容器里补齐 release 包 ：用 qemu 用户态转译运行 Flutter 只为 x64 提供的 AOT 编译器，即可在本地产出 release APK，已在容器内实测通过。 支持范围 本文构建 android-arm64 目标的 release 包，环境为 Flutter 3.27.4（Dart 3.6.2）+ Android SDK 35。android-arm / android-x64 的处理方式相同（换成各自目标的 linux-x64 版 gen_snapshot），profile 包换成 android-arm64-profile/linux-x64/gen_snapshot ，机制一致。 镜像与网络说明 qemu 与 x86_64 运行时库均从国内镜像下载。镜像产物与官方完全等价：即使网络可直接访问官方源，也无需还原为官方配置。 环境基线 ​ 项 值 系统 Debian GNU/Linux 12 (bookworm) aarch64（PRoot） Flutter 3.27.4 stable（Dart 3.6.2） SDK platforms android-35，build-tools 35.0.0 qemu qemu-user-static 7.2（Debian 1:7.2+dfsg-7+deb12u18+b3） x86_64 运行时 libc6 2.36（amd64） 前置条件 先按《在容器中编译 Flutter 应用》第 1~5 节装好 JDK、Android SDK（含 ARM64 原生二进制的替换）、Flutter SDK 与镜像配置，并确认 debug APK 能正常构建，再继续本文。 release 包为什么默认构建不出来 ​ Flutter 打 release 包时会调用 gen_snapshot ，把 Dart 代码 AOT 编译成机器码。这个工具按宿主平台分发，而官方只为 Android 目标提供了 linux-x64 版本，所以引擎产物目录里只有这一个子目录： bin/cache/artifacts/engine/android-arm64-release/ └── linux-x64/gen_snapshot 在 Linux ARM64 宿主上，Flutter 会去找 android-arm64-release/linux-arm64/gen_snapshot ，目录不存在，构建直接失败： Target android_aot_release_android-arm64 failed: Failed to find \".../android-arm64-release/linux-arm64/gen_snapshot\" in the search path. 这不是配置问题，上游至今未支持 Linux ARM64 宿主。gen_snapshot 产出的 AOT snapshot 内嵌 Dart SDK 的版本哈希，由运行时的 libflutter.so 校验，因此 不能拿别的 Flutter 版本编译的 gen_snapshot 顶替 （会报 Invalid SDK hash 或 snapshot 版本不符），社区第三方产物同样绑定各自的 Flutter 版本。 可行做法只有一条：让 x64 版 gen_snapshot 在本机跑起来，即 qemu 用户态转译。 1. 安装 qemu 用户态模拟器 ​ 直接 apt install qemu-user-static 会连带更新 systemd 等组件，在容器里没必要。改为只下载 deb 解包到独立目录： bash cd /tmp apt-get download qemu-user-static # 约 56 MB，走容器内已配置的镜像 mkdir -p /opt/qemu-user-static dpkg-deb -x qemu-user-static_ * .deb /opt/qemu-user-static /opt/qemu-user-static/usr/bin/qemu-x86_64-static --version # qemu-x86_64 version 7.2.22 (Debian 1:7.2+dfsg-7+deb12u18+b3) 可选：建个软链方便调用（容器 PATH 不含 /usr/local/bin ，用绝对路径亦可）： bash ln -sf /opt/qemu-user-static/usr/bin/qemu-x86_64-static /usr/local/bin/qemu-x86_64-static 2. 补齐 x86_64 运行时库 ​ gen_snapshot 是动态链接的 x86_64 程序，只依赖 loader 与 libc，但容器里没有任何 x86_64 库： bash qemu-x86_64-static < gen_snapsho t > --version # qemu-x86_64-static: Could not open '/lib64/ld-linux-x86-64.so.2': No such file or directory 注意 qemu 的 -L <prefix> 与 QEMU_LD_PREFIX 对这个二进制实测无效（仍按绝对路径找 loader），必须把库放到系统路径下。 从 Debian 镜像取 amd64 版 libc6： bash cd /tmp curl -fsSL -o libc6-amd64.deb \\ http://mirrors.huaweicloud.com/debian/pool/main/g/glibc/libc6_2.36-9+deb12u14_amd64.deb mkdir -p /opt/x86_64-root dpkg-deb -x libc6-amd64.deb /opt/x86_64-root # 放到系统库路径（容器 /lib 是指向 usr/lib 的软链） mkdir -p /usr/lib/x86_64-linux-gnu /lib64 cp -a /opt/x86_64-root/lib/x86_64-linux-gnu/. /usr/lib/x86_64-linux-gnu/ ln -sfn ../lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 /lib64/ld-linux-x86-64.so.2 验证： bash qemu-x86_64-static ~/.local/flutter-3.27.4/bin/cache/artifacts/engine/android-arm64-release/linux-x64/gen_snapshot --version # Dart SDK version: 3.6.2 (stable) "}, {"url": "/advanced/playwright-mcp", "title": "安装 Playwright 浏览器自动化 - 手机端 AI 编程工具与终端", "text": "安装 Playwright 浏览器自动化 ​ 在容器内安装 Chromium 并注册 Playwright MCP 服务器后，AI 即可打开网页、点击元素、填写表单、抓取页面内容与截图。 需要 Debian / Ubuntu 容器 Chrome for Testing 的二进制依赖 glibc，内置 Alpine 镜像使用 musl libc，无法运行。请先参照 容器与镜像 导入自定义 Debian 或 Ubuntu 镜像。 环境基线 ​ 项 值 系统 Debian / Ubuntu，容器内默认 root 架构 aarch64（arm64）或 x86_64 浏览器 Chrome for Testing 153.0.8010.12，安装至 /opt/chrome MCP 服务 @playwright/mcp ，由 npx 按需拉取 1. 安装依赖 ​ bash apt-get update -qq && apt-get install -y -qq unzip fonts-noto-cjk 缺少中文字体时，截图中的中文会显示为方块。 2. 下载并解压 Chromium ​ 以 arm64 为例；x86_64 需将 URL 中的 linux-arm64 替换为 linux64 ，解压目录名替换为 chrome-linux64 。 bash mkdir -p /opt/chrome curl -L -o /tmp/chrome.zip \\ https://cdn.npmmirror.com/binaries/chrome-for-testing/153.0.8010.12/linux-arm64/chrome-linux-arm64.zip unzip -q /tmp/chrome.zip -d /opt/chrome rm /tmp/chrome.zip /opt/chrome/chrome-linux-arm64/chrome --version # 输出 Google Chrome for Testing 153.0.8010.12 上面用的是 npmmirror 镜像，也可改用官方源；该版本下架时替换 URL 中的版本号即可： https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.12/linux-arm64/chrome-linux-arm64.zip 3. 注册 MCP 服务器 ​ 进入「设置 → MCP 服务器 → +」，传输类型选择本地 stdio，按下表填写后保存，App 会自动连接。 字段 值 名称 playwright 启动命令 npx 命令参数 -y 、 @playwright/mcp@latest 、 --headless 、 --no-sandbox 、 --executable-path 、 /opt/chrome/chrome-linux-arm64/chrome （逐项添加） 作用域 全局（所有项目共用）或项目（仅当前工作区） 也可直接编辑配置文件，全局为 ~/.aiverse/mcp.json ，项目级为 <工作区>/.aiverse/mcp.json ，保存后数秒内自动生效： json { \"mcpServers\" : { \"playwright\" : { \"command\" : \"npx\" , \"args\" : [ \"-y\" , \"@playwright/mcp@latest\" , \"--headless\" , \"--no-sandbox\" , \"--executable-path\" , \"/opt/chrome/chrome-linux-arm64/chrome\" ], \"enabled\" : true } } } 其中 --no-sandbox 在容器内必须指定，否则浏览器启动即崩溃； --executable-path 指向已安装的 Chromium，避免 Playwright 重复下载。 默认 headless 的 User-Agent 带有 HeadlessChrome 标识，部分站点会据此拦截，可追加 --user-agent 覆盖（界面中作为两个参数项依次添加）： --user-agent Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36 截图等输出文件默认写入运行目录下的 .playwright-mcp/ ，也就是当前工作区根目录，会在仓库里留下未跟踪文件。追加 --output-dir 可移出工作区： --output-dir /root/playwright-output 截图时指定了文件名则例外：相对路径按工作区解析，会绕过 --output-dir ，需写绝对路径。 4. 验证 ​ 进入「设置 → MCP 服务器」， playwright 一行应显示为已连接并标注工具数量；连接失败时点击右上角的日志按钮排查。 随后新建会话（工具列表在会话开始时确定），令 AI 打开网页并截图，返回图片即表示链路正常。首次连接需等待 npx 下载 @playwright/mcp ，实测 3 至 4 分钟。 常见问题 ​ 现象 原因 解决 启动即 Target closed 或崩溃退出 缺少 --no-sandbox 补充该参数后重新连接 终端直接运行 chrome 报 /dev/shm FATAL 容器无 /dev/shm ，且 /dev 不可写 附加 --disable-dev-shm-usage ；由 Playwright 启动的不受影响 chrome: not found 或二进制无法执行 容器为 Alpine（musl），或包与架构不符 更换 Debian / Ubuntu 镜像，核对 arm64 与 x64 包 截图中文显示为方块 缺少中文字体 执行 apt-get install -y fonts-noto-cjk 截图为空白页或整张透明 无 GPU 环境下渲染偶发失败 重试一次，仍为空白时改用 JPEG 格式 首次调用需等待数分钟 npx 正在下载 @playwright/mcp 等待完成，此后使用本地缓存；也可将 npm registry 换为 https://registry.npmmirror.com MCP 列表中没有 playwright 配置未生效或 JSON 存在语法错误 确认 mcp.json 可正常解析，再点击右上角「重新连接」 附：一键安装脚本 ​ 以下脚本完成第 1 至 3 步，另含下载源自动切换、压缩包校验、已安装时跳过下载、写入前备份 mcp.json 。保存为 /tmp/install-playwright.sh 后执行 bash /tmp/install-playwright.sh ： bash #!/usr/bin/env bash set -euo pipefail VERSION = \"${ CHROME_VERSION :- 153 . 0 . 8010 . 12 "}, {"url": "/advanced/build-flutter-app", "title": "在容器中编译 Flutter 应用 - 手机端 AI 编程工具与终端", "text": "在容器中编译 Flutter 应用 ​ 在 AiVerse 的 Linux 容器（PRoot）中配置 JDK、Android SDK 与 Flutter SDK 后，即可直接从源码编译 Flutter 应用的 Android APK。本文以 Debian 12 (bookworm) aarch64 为例，已在 PRoot 容器内实测通过 debug APK 的构建。 支持范围 本文构建 debug APK （JIT 模式，原生支持 ARM64）。 release 包 需要额外用 qemu 转译补齐 AOT 编译器，见《在容器中构建 Flutter release APK》。 镜像与网络说明 本文默认使用国内镜像进行安装与构建（下载更快、更稳）。镜像产物与官方完全等价：即使网络可直接访问 dl.google.com 等官方源，也无需还原为官方配置。 环境基线 ​ 项 值 系统 Debian GNU/Linux 12 (bookworm) aarch64（PRoot） JDK OpenJDK 17（headless） Flutter 3.27.4 stable（git clone 指定 tag） Dart 3.6.2（linux-arm64） Gradle 项目 wrapper 自带（8.3），无需系统安装 SDK platforms android-35，build-tools 33.0.1 + 35.0.0，platform-tools aapt2 ARM64 静态编译版（lzhiyong/android-sdk-tools） 1. 安装基础依赖 ​ bash apt update apt install -y openjdk-17-jdk-headless curl unzip zip git 验证 JDK： bash java -version # openjdk version \"17...\" 2. 安装 Android SDK ​ 默认使用国内镜像安装（下载更快、更稳）。除 sdkmanager 本体（cmdline-tools）需手工下载解压外，其余组件通过 SDK_TEST_BASE_URL 环境变量覆盖 sdkmanager 的默认仓库根 URL（需以 / 结尾，镜像需提供 repository2-3.xml ），一条命令全部装完（ --list 与 --install 均已实测可用）： bash # 唯一手工步骤：获取 sdkmanager 本体（从镜像下载） mkdir -p ~/android/sdk && cd ~/android/sdk curl -fL -C - -o clt.zip https://mirrors.cloud.tencent.com/AndroidSDK/commandlinetools-linux-13114758_latest.zip unzip -q clt.zip mkdir -p cmdline-tools/latest && mv cmdline-tools/ * cmdline-tools/latest/ # 组件全部走镜像安装（自动处理目录布局与许可接受） export JAVA_HOME = /usr/lib/jvm/java-17-openjdk-arm64 export ANDROID_HOME = $HOME/android/sdk export PATH = $ANDROID_HOME/cmdline-tools/latest/bin:$PATH export SDK_TEST_BASE_URL = https://mirrors.cloud.tencent.com/AndroidSDK/ yes | sdkmanager --install \"platforms;android-35\" \"build-tools;33.0.1\" \"build-tools;35.0.0\" \"platform-tools\" 版本说明 Flutter 3.27 模板的 compileSdk 为 35（需要 platforms;android-35 ）， buildToolsVersion 默认值为 33.0.1 （缺失时会报 Failed to find Build Tools revision 33.0.1 ）。build-tools 35.0.0 用于第 5 节的 aapt2 override，可选但建议安装。 镜像与官方源 SDK_TEST_BASE_URL 虽为测试用途的环境变量（非官方文档化的常规配置），但已被镜像方案广泛使用。镜像安装的 SDK 与官方安装完全等价：即使网络可直接访问 dl.google.com ，也无需还原为官方流程。若该方式在特定场景下失效，可改用官方源（见下）或手工组装。 可选：官方源安装 ​ 若网络可直连 dl.google.com ，也可使用官方标准流程： bash mkdir -p ~/android/sdk && cd ~/android/sdk curl -O https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip unzip -q commandlinetools-linux- * .zip mkdir -p cmdline-tools/latest && mv cmdline-tools/ * cmdline-tools/latest/ export JAVA_HOME = /usr/lib/jvm/java-17-openjdk-arm64 export ANDROID_HOME = $HOME/android/sdk export PATH = $ANDROID_HOME/cmdline-tools/latest/bin:$PATH yes | sdkmanager --install \"platforms;android-35\" \"build-tools;33.0.1\" \"build-tools;35.0.0\" \"platform-tools\" 备选：从镜像手工组装 SDK ​ 若 SDK_TEST_BASE_URL 方式不可用，可从腾讯云镜像下载组件 zip 手工组装，最终得到 build-tools/ 、 platforms/ 、 platform-tools/ 、 cmdline-tools/ 四个目录，效果与 sdkmanager 一致： 组件 镜像地址 commandlinetools https://mirrors.cloud.tencent.com/AndroidSDK/commandlinetools-linux-13114758_latest.zip platform-35 https://mirrors.cloud.tencent.com/AndroidSDK/platform-35_r02.zip build-tools 33.0.1 https://mirrors.cloud.tencent.com/AndroidSDK/build-tools_r33."}, {"url": "/advanced/reasoning-modes", "title": "模型思考模式参考：思考强度与「关闭思考」 - 手机端 AI 编程工具与终端", "text": "模型思考模式参考：思考强度与「关闭思考」 ​ 同一个「思考强度」按钮，在不同模型上的行为差别很大：有的模型能从\"完全不思考\"一路调到\"最高强度\"，有的只有两三档，有的根本关不掉，还有的换了中转站就完全不认这个参数。 本文按模型系列整理真实支持的形态，并给出「怎么判断设置真的生效」的方法，方便你在遇到\"选了没反应\"时快速定位原因。 关于本文的数据来源 表中的档位与\"能否关闭\"来自各厂商官方文档，并在真实渠道上逐项发请求核对过（以实际返回的思考 token 数与思考内容是否仍然出现为准）。厂商更新模型后可能有出入，遇到不一致以实测为准。 一、三种控制形态 ​ 形态 表现 典型模型 档位型 用离散档位控制思考深度：关闭 / 极低 / 低 / 中 / 高 / 极高 / 最高 中的若干档 GPT-5 系、Claude 4.6+、Gemini 3、Grok 预算型 用\"思考 token 上限\"控制，没有档位概念；部分模型把上限设为 0 即为关闭 Gemini 2.5 系、Claude 4.5 及更早 开关型 只有开 / 关，没有中间档；部分模型同时提供开关与档位 DeepSeek、Kimi、GLM、Qwen 的部分模型 档位数量越往上越少见： 极高 与 最高 只有部分新模型支持，不是所有「支持思考」的模型都有。 二、各系列的真实支持情况 ​ Claude（Anthropic） ​ 模型代际 形态 档位 能否关闭 Claude 4.6 档位型 低 / 中 / 高 / 最高 可以 Claude 4.7、4.8、5、5.5 系（含 Opus、Sonnet） 档位型 低 / 中 / 高 / 极高 / 最高 多数可以； Opus 5.5、Fable 5.1 思考恒开 ，关闭请求会被忽略 Claude 4.5 及更早 预算型 无档位 可以（关闭后不消耗思考预算） 要点： 「极高」「最高」不是每代都有 ，4.6 最高只到 max ，没有 xhigh 。 Sonnet 5.5 的关闭语义特殊：关闭只在低/中/高档位下有效，极高/最高档位下会被拒绝或忽略。 Opus 5 这一代在关闭思考时会把档位限制在「高」及以下。 GPT（OpenAI） ​ 模型 档位 关闭 GPT-5（含 mini / nano） 极低 / 低 / 中 / 高 不支持 GPT-5.1 低 / 中 / 高（+ 关闭） 支持 GPT-5.2、5.3、5.4、5.5 关闭 / 低 / 中 / 高 / 极高 支持 GPT-5.6 系 关闭 / 低 / 中 / 高 / 极高 / 最高 支持 GPT-5 Pro、5.2 Pro、5.4 Pro、5.5 Pro 只有中 / 高 / 极高（部分仅高） 不支持 GPT-6 Astra、6.1 Sol 低 / 中 / 高 / 极高 / 最高 不支持 （传「关闭」会被拒绝） 要点： 「关闭」能否生效取决于接口形态 ：走 chat/completions 风格接口时，部分服务会把「关闭」当作「低」处理；走 responses 风格接口时才会真正归零。若你选了关闭但仍在思考，优先在供应商设置里切到新版统一端点（Responses）再试。 官方 Pro 系档位很少，只有「中 / 高 / 极高」，选更低档不会更省。 Gemini（Google） ​ 模型 形态 说明 Gemini 3 Pro / 3.1 Pro 档位型 支持 低 / 中 / 高； 不能关闭 Gemini 3 系 Flash 档位型 支持 极低 / 低 / 中 / 高；极低最接近\"不思考\"，但仍不是完全关闭 Gemini 3.7 / 3.8 Flash 档位型 低 / 中 / 高（ 没有极低 ） Gemini 图像模型（如 3.1 Flash Image） 档位型 只有 极低 / 高 Gemini 2.5 Pro 预算型 152 ~ 32768 token， 不能关闭 Gemini 2.5 Flash / Flash-Lite 预算型 可设为 0 关闭；Flash 0~24576，Flash-Lite 0 或 512~24576 要点：Gemini 3 系 不允许同时 使用档位与预算两种设置，混用会直接报错。 国产与第三方（走 OpenAI 兼容接口时） ​ 系列 形态 关闭方式 备注 DeepSeek V4 系 开关 + 档位 只有专用关闭开关有效 ，\"关闭\"档位仍会思考 档位 低 / 高 / 最高 Kimi K3 档位型 无（K2.5 / K2.6 为开关型，可关闭） 档位 低 / 高 / 最高 GLM 5 系 开关 + 档位 专用关闭开关有效 5.2 只有 高 / 最高；5.3 为 低 / 高 / 最高 Qwen 3.8 系 开关 + 档位 需要与 DeepSeek 不同的开关参数 ，\"关闭\"档位无效 档位 低 / 中 / 极高 Grok 4.5 / 4.6 / 4.7 档位型 依赖渠道，部分渠道忽略 档位 低 / 中 / 高 / 极高 MiniMax M3 开关 + 档位 视版本而定 M3.1 Flash 档位 低 ~ 最高 要点： 不同厂商的\"关闭\"参数互不通用 ：把某家的关闭方式套到另一家，常见结果是接口照样返回成功、但模型仍然思考。这类\"不报错也不生效\"的情况只能靠下文的方法识别。 中转站（聚合渠道）可能改写或用自家参数，档位与开关行为以该渠道实测为准。 三、怎么判断设置真的生效 ​ 看「Token 统计 → 调用记录」里的 token 明细，或在对话里看是否还有思考过程展示： 现象 含义 选了「关闭」后，本次调用的推理 token 归零、对话里不再出现思考过程 关闭成功 选了「关闭」后，推理 token 仍明显大于 0，或仍能看到思考过程 关闭未生效 ：模型思考恒开，或该渠道不认这个关闭参数 选了「最高」后，推理 token 与「高」接近 该模型最高档只到「高」，或渠道把它降级了 档位怎么调，推理 token 都差不多 该渠道没有透传档位参数（常见于中转站） 推理 token 通常单独列出（部分服务在用量里只给总数，此时只能靠\"是否还有思考过程\"判断）。 应用会自动从服务的报错文案里学习档位白名单（报错里带 valid levels: … / Supported values are: … 时）， 学到后该渠道下的这个模型就只列真实支持的档位，不会反复撞同一个错误；换渠道会重新判断。 四、常见问题 ​ 问：为什么同一个模型，换一个中转站后档位表现不一样？ 档位是否被透传、能否关闭，取决于该渠道实际使用的接口与上游账号权限。同一个模型名在不同渠道可以完全不同，见第三节的判断方法。 问：模型名被中转站改了，识别不出档位怎么办？ 此时会列出全部档位供你手选。请先按第二节找出你的模型属于哪一档，再选择它真实支持的档位——选到不存在的档位通常不会报错，但会被静默降级。 问：选了「极低」还是思考很久？ 「极低」不等于「关闭」。Gemini 3 系、部分国产模型的最底档仍会有思考量；要真正归零只能用「关闭」（前提是该模型支持关闭）。 问：有的模型明明支持「最高」，选了却像「高」？ 一是该代模型本来就没有更高档（例如只有 低/中/高 的模型）；二是渠道未透传。"}, {"url": "/advanced/dashboard-cards", "title": "自定义面板 (DIY Dashboard) 与 Adaptive Cards 设计规范指南 - 手机端 AI 编程工具与终端", "text": "自定义面板 (DIY Dashboard) 与 Adaptive Cards 设计规范指南 ​ 本文档定义了 AiVerse 在聊天输入框上方「自定义面板 (DIY Dashboard)」中支持的 Adaptive Cards 声明式微模板规范 。 AI 助手与开发者可以依据此规范，编写面板脚本（Python / Node / Shell）输出结构化卡片 JSON，从而完全自定义面板在收起态（Compact）与展开态（Expanded）下的排版、配色、进度条、指标卡片及明细信息。 点击聊天输入框上方的面板标题可展开或收起。展开正文最多占聊天区域可用高度的约 40%；内容较长时，在正文内上下滑动即可查看全部内容，顶部标题与收起按钮保持固定，输入框仍保留在面板下方。短面板按实际内容高度显示，无需在脚本中截断明细列表。 1. 脚本存放路径与管理方式 ​ 1.1 默认存放路径 ​ 统一脚本目录 ： ~/.aiverse/scripts/ 。本地模式下即容器内 /root/.aiverse/scripts/ ，映射至宿主 App 数据目录、容器升级重装时保留；远程模式下为服务器用户 home 下的 ~/.aiverse/scripts/ （以远端为准，读写都在远端）。 1.2 脚本编写与语言支持 ​ 脚本只需将标准 JSON 结果输出到 标准输出 (stdout) 即可： Python 脚本 （ .py 后缀）：底层自动调用 python3 <script_path> 执行； NodeJS 脚本 （ .js 后缀）：底层自动调用 node <script_path> 执行； Shell 脚本 （ .sh / .bash 后缀）：底层自动调用 bash <script_path> 执行； 二进制 / 可执行脚本 ：如果具备可执行权限（ chmod +x ），底层直接执行。 1.3 路径解析规则 ​ 在供应商设置项「面板脚本」中，支持以下几种路径填写方式： 纯文件名 （推荐，如 demo_balance.py ）：自动在 ~/.aiverse/scripts/ 目录下查找； 相对路径 （如 scripts/my_panel.py 或 .aiverse/scripts/my_panel.py ）：自动从 ~/.aiverse/ 展开； 波浪号路径 （如 ~/.aiverse/scripts/my_panel.py 或 ~/my_script.py ）：自动展开为当前执行环境的 home（本地容器为 /root ，远程为服务器用户 home）； 容器内绝对路径 （如 /root/workspace/scripts/quota.py ）。 2. 脚本运行环境与注入的环境变量 ​ 执行面板脚本时，AiVerse 会自动注入以下环境变量，供脚本自由消费并构建动态面板： Token 类变量 ​ 关于「输入 Token」的说明 ： LAST_INPUT_TOKENS 和 TOTAL_INPUT_TOKENS 均为 API 返回的 总输入 Token （即 input_tokens / prompt_tokens / promptTokenCount ）， 已包含缓存命中部分 。 LAST_CACHED_TOKENS 是其中命中服务端缓存的部分（子集）。因此，纯新增输入 = LAST_INPUT_TOKENS - LAST_CACHED_TOKENS 。 关于模型变量的说明 ：下表 AIVERSE_MODEL_* 系列都跟着 当前渠道 取——你在供应商 → 模型里给该模型填的自定义窗口、单价与能力开关会直接生效，没填的才回退自动识别结果。 环境变量名 示例值 说明 AIVERSE_MODEL claude-3-7-sonnet 当前选中的生效模型名称 AIVERSE_SESSION_ID sess_98a7bc21 当前会话 ID AIVERSE_LAST_INPUT_TOKENS 1420 最近一次单次 LLM 请求的输入 Token（API 返回的总输入， 含缓存命中 ） AIVERSE_LAST_OUTPUT_TOKENS 365 最近一次单次 LLM 请求生成的输出 Token AIVERSE_LAST_CACHED_TOKENS 1024 最近一次请求中命中服务端缓存的部分（如 OpenAI cached_tokens / Anthropic cache_read_input_tokens ）。是 LAST_INPUT_TOKENS 的子集，取不到时为 0 AIVERSE_TOTAL_INPUT_TOKENS 28540 当前会话累计的输入 Token（API 返回的总输入， 含缓存命中 ） AIVERSE_TOTAL_OUTPUT_TOKENS 5420 当前会话累计生成的输出 Token AIVERSE_MODEL_CONTEXT_TOKENS 200000 当前模型的上下文窗口大小（Token）。若模型元数据未获取到则为 0 AIVERSE_MODEL_MAX_INPUT_TOKENS 200000 模型最大输入 Token 限制。未获取到则为 0 AIVERSE_MODEL_MAX_OUTPUT_TOKENS 8192 模型最大输出 Token 限制。未获取到则为 0 AIVERSE_MODEL_INPUT_COST_USD_PER_M 3.0 模型输入单价（美元 / 百万 Token）。未获取到则为 0 AIVERSE_MODEL_OUTPUT_COST_USD_PER_M 15.0 模型输出单价（美元 / 百万 Token）。未获取到则为 0 AIVERSE_MODEL_CACHE_READ_COST_USD_PER_M 0.3 模型缓存读取单价（美元 / 百万 Token）。未获取到则为 0 AIVERSE_MODEL_SUPPORTS_TOOLS true 模型是否支持工具调用（ true / false ） AIVERSE_MODEL_SUPPORTS_VISION false 模型是否支持图片输入（ true / false ） AIVERSE_MODEL_SUPPORTS_REASONING true 模型是否支持思考/推理模式（ true / false ） AIVERSE_MESSAGE_COUNT 12 当前会话的消息总数（含用户和助手消息） 会话状态变量 ​ 环境变量名 示例值 说明 AIVERSE_AGENT_STATE streaming 当前 Agent 工作状态： idle （空闲）/ loading （加载中）/ streaming （流式输出中）/ result （完成）/ error （出错） AIVERSE_SESSION_MODE build 当前会话模式： build （构建）/ plan （计划）/ auto （自动） AIVERSE_REASONING_EFFORT high 当前思考强度档位： none / minimal / low / medium / high / xhigh / max AIVERSE_REFRESH_REASON llm 本次"}, {"url": "/guide/sync", "title": "工作区同步 - 手机端 AI 编程工具与终端", "text": "工作区同步 ​ 把手机上的工作区目录同步到远程服务器。入口在「设置 → 运行环境 → 连接与同步」，页面底部有四个标签页。 本页与「容器与镜像」的分工 本页只负责 连接通道和文件同步 。如果你想让 AI 直接把远程服务器当执行环境（命令、文件、终端都在服务器上运行），那是另一项功能，见 远程 SSH 模式 ——它会复用这里建好的 SFTP 通道。 连接配置 ​ 点右上角 + 新建一个连接通道： 协议类型 ： SFTP （默认端口 22）或 FTP （默认端口 21）。 连接名称 ：别名。 主机地址 ：IP 或域名。 端口 / 用户名 / 认证方式 ：必填。认证方式可以选择 密码 ，或选择 密钥 （从「SSH 密钥」页已添加的私钥中选择；加密私钥的口令在密钥编辑页里填，连接这里不再重复填）。 测试连通性 ：保存前可先测试。 排序 ：长按通道行的名称区域上下拖动可调整顺序（重启后保持）。该顺序有实际影响——新建挂载时的「关联连接通道」下拉、编辑容器时的「SSH 通道」下拉，默认选中的都是列表第一项。 SSH 密钥与主机指纹 ​ 点顶栏的钥匙图标进入，底部两个标签页： 密钥 ：管理登录用的私钥。点右上角 + 有两种添加方式： 从文件导入 （从文件选择器选私钥文件）或 粘贴密钥 （进入与编辑页相同的表单，粘贴私钥内容并填名称、口令，名称留空自动命名）。私钥会加密复制到私有目录并解析出公钥指纹，加密的私钥会标注「需口令」。点某条密钥进入编辑页：可改名称和口令（加密私钥的 passphrase），私钥内容只读（默认隐藏，点右侧眼睛可查看）。口令在密钥上设置，连接选用该密钥时会自动带上。左滑删除。 密钥列表会在进入页面后异步加载；导入、修改或删除后自动刷新。保存带口令的密钥时无需停留等待，返回列表后即可查看更新结果。 指纹 ：管理已信任的服务器主机指纹。首次连接某台服务器时会弹窗显示密钥类型和 SHA256: 指纹，确认「信任并连接」后保存下来，之后直接放行。如果服务器指纹变了会再次要求确认——这是防中间人攻击的机制，指纹突然变化要当心。左滑删除后下次连接重新确认。 挂载目录 ​ 连接通道只解决「能否连接」，还需要建立「哪个本地工作区对应哪个远程目录」的映射。点右上角 + ： 关联连接通道 ：下拉选一个已建好的连接。 远程目标目录 ：右侧文件夹图标可以打开远程目录浏览器逐级点选。 映射到本地工作区 ：下拉选一个本地工作区（需要先在侧边栏创建）。 应用启动时自动连接 ：打开后会跟随当前工作区——App 启动或切换工作区时，自动连接映射到当前工作区的挂载并监听本地改动，同时断开其它工作区的挂载。连接失败会按退避间隔重试；切换到其它工作区或手动断开时会停止该挂载的重试，尚未完成的旧连接也不会启用同步。 保存时如果已存在相同的「通道 + 远程目录 + 工作区」组合，会提示挂载已存在并拦截。 连接成功后卡片上有几个操作：断开连接、上传变更、下载全部，以及右侧「更多」菜单（强制全量上传、清除同步记录）。列表行左滑可删除。 同步是单向的 自动同步只把 连接后的本地改动推到远程 （监听本地文件的增删改），远程目录的变化 不会 自动拉下来。连接时不会自动上传已有文件，需要时请手动点「上传变更」。 需要把远程文件拉到本地时手动点「下载全部」，但要注意这是 全量覆盖式 拉取：会覆盖本地同名文件（不删除本地多出来的文件），本地未保存的修改可能被覆盖。使用前请确认清楚。 哪些文件会被上传 ​ 「上传变更」与自动同步都 只传输有改动的文件 ：每个文件按「大小 + 修改时间」和上次成功同步的记录比对，一致就跳过、不再重传；大小相同但修改时间不同时，再用内容哈希（SHA-256）兜底判断，内容确实没变也会跳过。这些同步记录保存在 App 私有目录，重启后依然有效。 判断是保守的：拿不准就上传，不会漏传。右侧「更多」菜单里： 强制全量上传 ：忽略同步记录，把全部文件重传一遍。用于远程目录被外部清空或改动、需要强制覆盖的场景。 清除同步记录 ：删除该挂载的同步记录，让下次上传重新视为全新（等价于一次全量）。 另外，对确实改动过的文件，SFTP/FTP 只能整体重传，无法只传输差异部分。 连接超时是 15 秒，主机不可达时会快速报错而不是一直等。已连接的挂载每 15 秒探活一次，断线时卡片显示「重连中」，并按 5 秒、10 秒、20 秒、40 秒、60 秒的间隔自动重连，成功后恢复同步。 内置 FTP 服务端 ​ 在手机上开启一个 FTP 服务，便于用电脑管理手机上的项目。 手机和电脑要连同一个 WiFi。开启后界面会显示 FTP 地址（如 ftp://192.168.1.100:2121 ，点地址可复制），在电脑的文件资源管理器或 FileZilla 里访问即可，能管理 projects/ 下的全部项目。 可配置的参数有监听端口、登录用户名、登录密码、是否允许匿名访问、是否开机自启，改完点底部「保存配置」。服务运行时保存会重启服务并断开现有连接，之后只有当前配置的账号可以登录；关闭匿名访问后，匿名登录也会失效。 anonymous 是匿名登录的保留名称，请为普通账号使用其它用户名。 注意安全 允许匿名访问意味着同一网络下的任何设备都能读写你的项目文件。在公共 WiFi 下请勿开启匿名访问，使用完毕后建议关闭服务。 同步设置 ​ 遵循 .gitignore 规则 ：打开后自动读取项目根目录的 .gitignore 过滤要同步的文件。 单次最大同步队列数量 ：防止一次性改动大量文件时导致服务端请求过载或网络拥塞，超出的操作会排队分批执行。 另外同步引擎始终会忽略常见的构建和缓存目录（ node_modules 、 .git 、 build 、 dist 等），无需手动配置。 改完点底部「保存设置」生效。"}, {"url": "/guide/memory", "title": "记忆与项目规则 - 手机端 AI 编程工具与终端", "text": "记忆与项目规则 ​ 本章介绍自动记忆与项目规则两项能力，用于保持 AI 跨会话的上下文连续性与项目一致性。 自动记忆 ​ 自动记忆是 AI 自行维护的长期知识库。对话中形成的项目约定、用户偏好与架构决策，AI 会自动记录并在后续会话中复用。 作用域 ​ 作用域 说明 存储位置 全局 跨项目通用的个人偏好 ~/.aiverse/memory/ 项目 当前项目专属的约定与经验 本地模式： <项目根>/.aiverse/memory/ ；远程 SSH 模式： ~/.aiverse/memory/projects/<项目名>-<标识哈希>/ 项目记忆在远程模式下存储于手机本地，并按「项目名 + 服务器标识」隔离，不受容器重置影响。 记忆文件 ​ 每条记忆是一个 Markdown 文件，由 YAML frontmatter（ name 、 description ）与正文组成： markdown --- name: conventions description: 项目代码规范与命名约定 --- （正文） 生效方式 ​ 会话开始时，系统将全部记忆的摘要（名称与描述）注入提示词；需要详情时，AI 通过 memory 工具读取完整内容。 平台权限与安全边界始终适用。在这些边界内，本轮明确要求优先于长期偏好与默认约定；未明确指定时，按「用户记忆 > 项目规则 > 内置默认」处理冲突。 memory 工具 ​ 参数 说明 action read / save / edit / delete / list name 记忆名称（即文件名） description 摘要， save 时必填 content 正文（Markdown）， save 时必填 edits 局部编辑列表，语义与编辑文件一致 scope project （默认）或 global 同名记忆项目级优先于全局。更新既有记忆时建议使用 edit 局部编辑；涉及踩坑经验的内容，应在验证根因后记录。 项目规则 ​ 项目规则有两处来源：全局目录 ~/.aiverse 与当前工作区根目录。两处各自优先读取 AGENTS.md ，不存在时回退 CLAUDE.md 。全局规则用于跨项目通用的约定，工作区规则用于项目专属的规则、架构约束与构建指南；两处冲突时以更具体的工作区规则为准，并遵循上述权限边界与冲突处理顺序。 生效方式 ​ 两处规则在会话开始时自动加载并一并注入提示词，无需手动配置；每份文件内容超过 32,000 字符时将被截断。 自定义加载约定 ​ 项目规则的加载约定对应提示词片段 15-project-rules.md ，可通过 ~/.aiverse/prompts.custom/15-project-rules.md 覆盖，见 自定义提示词 。"}, {"url": "/guide/git", "title": "Git 版本管理 - 手机端 AI 编程工具与终端", "text": "Git 版本管理 ​ 在项目工作区打开 Git 页面，可以可视化地管理代码版本。底部有三个标签页：状态、分支、提交。如果当前目录不是 Git 仓库，可一键初始化为空白仓库（默认分支为 main ），或输入远程地址直接克隆已有仓库（ 1.12.0 起 ）。 多目录识别 ​ Git 页会自动识别当前工作区根目录及其 一层直接子目录 里的 Git 仓库： 顶栏标题下方显示当前仓库名，点击可弹出仓库选择列表，在多个仓库间切换。 仓库选择列表仅列出识别到的 Git 仓库，当前选中的仓库以主色高亮显示。 若工作区根不是 Git 仓库但子目录是，会自动选中子目录仓库，展示其状态、分支、提交。 工作区根与子目录都找不到 Git 仓库时，显示「非 Git 仓库」提示，可「初始化新仓库」（在当前工作区根执行 git init ），也可点「选择已有仓库」。 凭据与署名 ​ 右上角的钥匙图标进入「凭据与署名」页，内含署名和凭据两个标签页—— 首次使用必须先配好署名，否则无法提交 。 凭据页右上角的「+」用于新增 Git 凭据，提供两种方式： 手动添加 ：填写远程主机、用户名与访问令牌（Token / PAT）。 快速登录 （ 1.13.0 起 ）：用 GitHub 账号授权一键添加，无需自己创建 Token。选中 GitHub 后，应用会显示一个设备码；点击「复制并前往授权」会自动复制设备码并打开 GitHub 验证页，粘贴设备码并授权后，应用会自动完成登录并把 github.com 的凭据写入列表。也可以单独点击「复制设备码」后手动在浏览器打开。 快速登录基于 GitHub App 的细粒度授权：能访问哪些仓库、有哪些权限，由该 App 注册时的配置决定，并在安装时由你勾选，不再需要账号下所有仓库的完全权限。登录完成后，如果还没把 AiVerse 安装到你的仓库，弹层会提示并给出「去安装」按钮，点它跳到 GitHub 安装页选择要授权的仓库即可。 如果快速登录提示「该应用未启用设备码流」，说明对应的 GitHub App 尚未开启 Device Flow；提示「客户端 ID 无效」则说明应用配置有误。 离开 App 去浏览器授权期间，登录弹层会在后台继续等待（设备码有效期 15 分钟），网络短暂中断会自动重试，回来时通常已经完成。 状态 ​ 查看当前仓库的工作区状态。 顶部卡片显示当前分支名、相对远程领先或落后多少个提交（上下箭头），以及已暂存、已修改、未跟踪的文件数量。 提交 是全宽的主按钮，需要先暂存改动并配好署名才能点击，点击后填写提交信息。 次级操作一行四个按钮： 暂存全部 ：把所有改动加入暂存区。 储藏 （ 1.12.0 起 ）：打开储藏箱，见下文「储藏」小节。 拉取 / 推送 ：需要已配置远程仓库。当前分支没有上游时，推送会自动建立关联。 分组标题右侧还有： 全部取消暂存 ：在已暂存分组，执行前会二次确认。此操作只取消暂存，不会删除文件内容。 全部回退 （ 1.11.0 起 ）：在已修改分组，把所有未暂存的改动还原成上次暂存或提交的内容。已暂存的内容不受影响，但丢弃掉的改动无法找回，执行前会二次确认。 文件改动按「已暂存 / 已修改 / 未跟踪」分成三组： 已暂存：点行查看暂存区与上次提交的差异，行尾「−」取消暂存。 已修改：点行查看工作区与上次提交的差异，行尾「+」暂存该文件。被删除的文件也在这一组，状态徽标是红色的 D。 未跟踪：点行查看这个新文件的内容（整份按新增显示），行尾「+」暂存。git 会把新建的目录折叠成一行（如 feature/ ），点它展开里面的文件，再点单个文件即可查看内容。 如果工作区有未提交的改动，点「拉取」会先提示可能产生冲突，确认后才执行。 提交弹窗（1.12.0 起增强） ​ 点「提交更改」弹出的窗口里： AI 生成 ：点标题栏右侧的按钮，让 AI 读取暂存区与工作区的差异，自动生成一条符合 Conventional Commits 的提交信息。生成期间按钮显示「正在生成…」，生成失败会提示检查模型或网络。 快捷类型 ：输入框上方一排 Chip（ feat 、 fix 、 refactor 、 chore 、 docs 、 style 、 perf 、 test ），点一下即把对应前缀套到当前信息上。 追加到上次提交（--amend） ：底部开关，开启后这次提交会合并进上一次提交，而不是新建一条。 合并冲突（1.12.0 起） ​ 合并分支后如果产生冲突，状态页会单独列出冲突文件（状态徽标为紫红色 U）。在编辑器中解决冲突后，暂存对应文件。 没有未解决的冲突、但合并尚未提交时，页面显示「合并待提交」。此时请确认并暂存需要保留的改动，再点「提交更改」完成合并；这不表示仍有冲突。 如果要放弃本次合并，可点「中止合并」还原到合并前的状态。不要仅为关闭提示而中止合并。 储藏（1.12.0 起） ​ 储藏用于临时收起当前改动、让工作区回到干净状态，之后再取回来。点状态页的「储藏」按钮打开储藏箱： 储藏改动 ：可填一句可选说明，并可勾选「包含未跟踪文件（-u）」把新文件也一并收起。 弹出 (Pop) ：取出这条储藏并把它从储藏列表移除。 应用 (Apply) ：取出内容但保留这条储藏记录。 丢弃 (Drop) ：删除单条储藏，执行前二次确认。 清空全部 ：删除所有储藏，执行前二次确认。 丢弃与清空都不可撤销。 回退与删除（1.11.0 起） ​ 版本说明 状态页的长按操作菜单（回退改动、恢复文件、删除未跟踪项）与「全部回退」从 1.11.0 起提供；菜单里的「添加到 .gitignore」从 1.12.0 起提供。 长按任意文件行 会从底部弹出操作菜单，菜单顶部显示完整路径。可用的操作按文件所在分组不同： 分组 菜单项 冲突文件 查看差异、暂存、复制路径 已暂存 查看差异、回退改动（还原到上次提交，已暂存和未暂存的改动都会丢失）、复制路径 已修改 查看差异、回退改动（还原成上次暂存或提交的内容）、复制路径 已修改中被删除的文件 查看差异、 恢复文件 （从上次提交把文件取回来）、复制路径 未跟踪文件 查看差异、 添加到 .gitignore （忽略此文件 / 忽略同类型文件）、删除文件、复制路径 未跟踪目录 添加到 .gitignore （忽略整个目录）、删除目录、复制路径 两类操作的后果完全不同，注意区分： 回退改动 / 恢复文件 ：针对 Git 已经跟踪过的文件。内容存在版本库里，因此无论文件是被你删的、还是被终端命令或 AI 删的，都能取回来。代价是这次没提交的改动会丢失。 删除文件 / 删除目录 ：只出现在未跟踪项上。这些文件从来没进过版本库， 删除后 Git 无法恢复 。 所有回退和删除操作执行前都会弹确认框，说明将丢失什么。 分支 ​ 分成 HEAD、本地分支、远程分支、标签四组显示。当前分支卡片会显示分支名和三类引用的数量。本地分支按路径树形展示，当前分支高亮。 切换分支 ：点任意分支或标签，确认后切换。点远程分支会创建一个本地跟踪分支再切过去。切换到标签会进入 detached HEAD 状态（此时的提交不属于任何分支，注意不要在该状态下长期工作）。 点分支行 弹"}, {"url": "/guide/remote-ssh", "title": "远程 SSH 模式 - 手机端 AI 编程工具与终端", "text": "远程 SSH 模式 ​ 选中一个「远程 SSH」容器后，AiVerse 进入远程工作区模式：AI 的 读写文件、执行命令、运行终端均发生在远程服务器上 ， ~/workspace 映射到服务器上的指定目录，手机仅作为操作界面。 适用于服务器上已有完整工具链，或需要 AI 直接修改远程项目的场景。 切回本地容器时，会关闭远程终端标签、断开远程执行与文件访问连接，并停止自动重连；再次选中远程容器后会重新连接。 前置：先建一个 SFTP 通道 ​ 远程 SSH 复用「连接与同步」页中 SFTP 通道的连接信息（主机、端口、用户名、密码），需先在该页建好一个 SFTP 连接，见 工作区同步 。 FTP 通道不支持执行命令，不会出现在可选列表中。 新建远程 SSH 容器 ​ 在「设置 → 容器与镜像」点击右上角 +，选「远程 SSH」： 名称 ：配置的别名。 SSH 连接通道 ：下拉选择一个已配置的 SFTP 通道。无可用通道时，界面提示先前往「连接与同步」页配置，且保存按钮不可用。 远程工作区路径 ：服务器上的目录，AI 的 ~/workspace 映射到此。选中通道时会自动填入默认值 ~/.aiverse/workspaces （按服务器上该用户的真实 home 解析，如 root 用户为 /root/.aiverse/workspaces ），可修改。 保存后在列表中选中即生效。 认证方式沿用所选 SFTP 通道的配置，支持 密码认证 与 SSH 私钥认证 （含带密码保护的私钥）。 连接行为 ​ 自动连接 ：App 启动时若当前为远程模式，会在后台自动连接；连接失败不会阻塞界面，首次执行命令时会重试。 保活与自动重连 ：连接后每 30 秒发送一次心跳，防止空闲断连；断线后由后台自动重连（5 秒起、最长 30 秒的退避间隔），App 回到前台时也会立即重试一次。 状态显示 ：对话页顶部显示「SSH：已连接 / 连接中 / 连接失败 / 未连接」。未连接时消息区显示等待提示。 两条独立连接 ：文件读写走 SFTP，终端与命令走 exec，各占一条 SSH 连接、互不影响；文件通道异常时自动重建，不中断正在运行的命令。 路径自举 ：远程工作区路径不存在时自动创建；若该目录下无任何子目录，会自动创建一个名为 default 的工作区，保证 AI 始终有可用的 ~/workspace 。 本地数据与跟随执行环境的数据 ​ 远程模式下命令、文件、终端与工作区均在服务器上。大多数配置仍存于手机本地；少数「执行环境资源」则跟随环境、以远端为准： 项目 说明 聊天历史、模型与供应商配置、API Key、应用设置 全部本地 记忆（memory） 本地。项目级记忆按「项目名 + 服务器标识」隔离，不同服务器上的同名工作区不会混淆 全局技能、子代理与面板脚本 跟随执行环境 ：远程模式下读写 服务器 上的 ~/.aiverse/skills/ 、 ~/.aiverse/agents/ 、 ~/.aiverse/scripts/ ，与本地模式的那份互相独立 项目级技能与子代理 直接读写 服务器工作区 中的 <工作区>/.aiverse/skills/ 、 agents/ ，可随代码库提交到 git 项目级配置（工具授权规则 / MCP / 技能与子代理的停用名单） 手机本地。远程模式按「项目名 + 服务器标识」隔离在 App 私有目录下，不写入服务器 MCP 服务器 HTTP 类型由 App 直接连接；stdio 类型运行在「默认容器」上（见下），不在远程服务器 日志与工具输出 本地 连接成功后，AiVerse 会将内置文档同步到服务器的 ~/.aiverse/docs/ ，远程模式下 AI 也可查阅这些说明文档。 默认容器 ​ 远程模式下仍有部分功能需在本地运行，例如 stdio 类型的 MCP server。它们运行在 默认容器 上，默认为内置 Alpine，可在容器列表下方的「默认容器」分组中改为任意本地容器。 切换容器（包括切到远程 SSH）后，所有 stdio MCP 会自动断开并用新容器重连；HTTP MCP 不依赖容器，不受影响。 Git 署名与凭据的去向 ​ Git 页面中保存的 署名 会写入当前执行环境——远程模式下即写入服务器的 git 配置。 凭据 以手机本地的凭据文件为唯一来源。远程模式下可在凭据页开启「自动注入凭证」（按服务器分别记忆，首次进入时询问），将凭据同步到服务器；开启后，初始化或切换工作区时会同步更新生效范围，仅对当前工作区目录下的仓库生效，不影响服务器上其它目录的仓库，也不改动服务器用户的全局 git 配置。凭据与助手通过 SFTP 上传，完整写入后再替换原文件；上传失败时保留原文件。远端助手找不到匹配凭据时立即返回，不等待手机弹窗；需要补充凭据时请在 App 凭据页添加后同步。"}, {"url": "/guide/goal", "title": "会话目标（Goal） - 手机端 AI 编程工具与终端", "text": "会话目标（Goal） ​ 「目标」让 AI 围绕一个你给定的结果 自主循环 推进：它自己规划、执行、验证，并在每轮结束时判断目标是否达成，直到完成、受阻或达到预算上限才停下来。适合那种「有一个明确终点、能自己验证进度」的任务，例如「让 checkout 测试全绿」「把某个接口的 p95 延迟降到 120ms 以下」。 版本说明 目标功能自 1.13.0 起引入。 设定目标 ​ 在输入框输入： /goal 让当前分支的单元测试全部通过，且不改动公开 API AI 会立即开始自主循环。设定目标等同于一次授权： 目标进行期间，工具调用自动放行 （仍保留删除系统/工作区根目录这类灾难性操作的安全防护），并且 暂停 PLAN 模式 ——因为计划模式需要你逐步审批，与「自主完成」冲突。 一个好的目标要能自证： 说清「什么算完成」和「怎么验证」，例如「跑 ./gradlew test 全绿」「页面能本地构建成功」。 指向 AI 该读的文件、日志或参考。 弱目标「写一下这个功能的文档」；强目标「产出 Goals 的文档页，说明生命周期与命令，并确保本地构建通过」。 查看与管理 ​ 命令 作用 /goal <目标> 设定或覆盖目标，并立即开始 /goal 查看当前目标与状态 /goal pause 暂停自主循环 /goal resume 恢复自主循环 /goal clear 清除目标 输入框下方会常驻显示目标提示条，标注状态（进行中 / 已暂停 / 已完成 / 受阻 / 预算耗尽），并提供暂停、恢复与清除按钮，不必记命令。 运行中会发生什么 ​ 每轮结束后，AI 会对照目标与证据判断是否达成；未达成且预算未耗尽就自动进入下一轮，不会停下来问你「是否继续」。 想中途插手：直接发消息即可。你的消息优先于续跑执行，处理完再继续目标。 达成时 AI 会把目标标记为「已完成」；遇到需要你介入的阻塞（缺凭证、需决策）会标记为「受阻」并停下。 点「停止」打断时，目标会自动暂停（避免下条消息后继续自动跑），用 /goal resume 恢复。 安全阀：自动循环连续 3 轮没有任何进展（无工具调用也无可见输出）时，会自动置为「受阻」并停止，避免空转消耗 token。 达到预算上限会自动停止并标记为「预算耗尽」，此时可 /goal resume 继续或 /goal clear 清除。 预算上限 ​ 自主循环会持续消耗 token，因此有两道保险，可在 设置 → 偏好设置 → 目标（goal） 中调整： 最大续跑轮数 ：默认 50 轮。 token 预算 ：默认 50 万，按循环期间的输入+输出 token 累计。 任一触顶即停止循环并提示。 注意 ​ 目标进行期间不能使用 PLAN 模式；需要规划时请先 /goal pause 或 /goal clear 。 目标按会话保存，切换会话互不影响。"}, {"url": "/guide/browser", "title": "内置浏览器 - 手机端 AI 编程工具与终端", "text": "内置浏览器 ​ App 内置了一个 WebView 浏览器，支持 AI 自动化操作网页。AI 可在后台操作浏览器，截图也能在后台完成（无需先打开面板）。 打开浏览器 ​ 在侧边栏底部的卡片中点击「内置浏览器」： 大屏（平板） ：浏览器在右栏与聊天并排打开，可拖动分割条调整宽度。 窄屏（手机） ：浏览器全屏打开，按返回键回到聊天。 手动浏览 ​ 在地址栏输入网址按回车即可导航；输入的内容不像网址时（如含空格或中文），会自动交给内置搜索引擎 Bing 搜索。地址栏右侧提供刷新按钮，下方底栏包含后退、前进、新建标签页、多标签管理与更多设置菜单（三条杠图标）。页面加载时地址栏下方显示线性进度条。 点击底栏右侧的三条杠图标可打开「浏览器设置与工具」面板，集中管理夜间模式、开发者工具与浏览器标识（User-Agent）。 本地文件预览 ​ 地址栏支持本地文件地址，可直接打开设备上的 HTML 文件： 设备真实路径： file:///storage/emulated/0/Download/index.html 容器路径（AI 在容器里看到的路径，自动映射为真实文件）： ~/workspace/index.html 、 /etc/xxx.html AI 也可通过 browser 工具的 navigate 打开本地页面并截图分析。 注意 ：远程工作区模式下工作区文件在远端，只能加载页面本身，HTML 引用的相对资源（CSS/JS/图片）会失效；本地工作区不受影响。 开发者工具 ​ 在底栏三条杠菜单中开启「开发者工具」开关，即可随时开启或收起移动端开发者工具（基于 Eruda）： 全功能控制台 ：包含 Console（查看日志与执行 JavaScript 代码）、Elements（查看与实时编辑 DOM 树和 CSS 样式）、Network（查看网络请求与响应）、Resources（查看 LocalStorage、Cookie 等数据）、Sources 等。 即时可用 ：开启后页面右下角显示浮动齿轮图标，点击即可展开完整控制台面板；关闭菜单中的开发者工具开关可彻底关闭并移除悬浮球。 电脑端调试联动 ：开启时同步启用 Chromium 的 WebContentsDebugging ，支持通过 USB 连接电脑并在 Chrome 浏览器访问 chrome://inspect 进行桌面级远程审查。 夜间模式 ​ 浏览器内置夜间模式，默认跟随 App 外观：App 为深色时页面自动变暗，App 为浅色时恢复原样。可在底栏三条杠菜单中手动开启或关闭「夜间模式」；手动选择后不再跟随 App 外观，切回与 App 外观一致时会自动恢复跟随。 夜间模式采用双轨渲染架构： 原生深色优先 ：向页面声明 prefers-color-scheme: dark 与 color-scheme: dark ，现代网站（如 GitHub、Google 等）会自动启用官方精细调优的原生暗色主题，文字清晰且深色区域不会反白。 亮底站点压暗 ：对无暗色样式的亮底站点，在页面顶层盖一层半透明暗色蒙版整体压暗（保留原色、只降低亮度，不做反色），观感柔和。该蒙版作用于页面渲染，AI 截图同样会呈现压暗后的配色。 防闪白 ：在页面启动时立即设置暗色视口背景并提前注入深色偏好，避免页面刷新瞬间的白屏闪烁。 浏览器标识 (User-Agent) ​ 在底栏三条杠菜单的「浏览器标识 (User-Agent)」区域，可一键切换网页访问的设备环境，切换后自动刷新当前页面生效： 系统默认 ：使用当前设备的原生 WebView 标识。 安卓手机 ：模拟 Android Chrome Mobile 环境。 安卓平板 ：模拟 Android Chrome Tablet 大屏环境。 桌面电脑 ：模拟 Windows PC 端桌面 Chrome 浏览器，强制请求桌面版网页。 苹果 iPhone ：模拟 iOS Mobile Safari 环境。 苹果 iPad ：模拟 iPadOS Tablet Safari 环境。 自定义 ：手动输入任意自定义 User-Agent 字符串。 AI 自动化操作 ​ AI 可通过 browser 工具控制浏览器执行以下操作： 操作 说明 navigate 导航到指定 URL（支持 http(s) ，本地文件支持 file:// 或容器路径；不像网址的输入会按关键词用内置搜索引擎 Bing 搜索），等待页面加载完成 evaluate 执行任意 JavaScript（支持 Promise/async，返回原生 JSON） click 点击元素（完整事件链，兼容 React/Vue） fill 填充表单字段（native setter + React valueTracker hack） select 选择原生下拉框 <select> （按 value 或可见文本） hover 悬停元素（派发 mouseenter/over/move，可展开下拉菜单） press 按键（Enter/Escape/Tab/方向键/Backspace/Delete/空格/普通字符） getText 提取页面文本（可指定选择器），已过滤 script/style getHtml 提取页面 HTML（可指定选择器） getBackbone 提取无障碍树（role/name/ref，可指定 maxDepth ），ref 可直接用于后续操作 screenshot 截取当前页面，返回图片供视觉模型分析（支持后台离屏截图） console 取页面控制台日志（可过滤级别、可清空） wait 等待条件满足（ text= / text*= / selector= / domStable ，可设 timeout ） scroll 滚动页面（滚动到指定元素或滚到底部） dialog 处理挂起的 confirm / prompt 对话框（接受或取消）；浏览器面板可见时由用户在界面上处理 back / forward / reload 浏览器导航控制，back/forward 会等待导航完成 页面弹出 alert / confirm / prompt 时的处理方式取决于浏览器面板是否打开： 面板已打开 ：在面板内弹出「网页提示 / 网页确认 / 网页输入」对话框，由你直接选择确定或取消（标题已标明来自网页）。此时 AI 不会代答，需要你处理。 面板未打开（AI 后台操作） ： confirm / prompt 会被挂起，工具响应里出现 pendingDialog 字段，由 AI 用 dialog action 接受或取消（30 秒未处理会自动取消）； alert 直接确认，不阻塞。 注意 ：浏览器面板未打开时，网页无法弹出任何原生界面（下拉列表、对话框等）——这是有意为之，避免后台页面把弹窗伪装成 App 自己的界面。 选择器格式 ​ click 、 fill 、 hover 、 getText 、 getHtml 、 scroll 、 wait 的选择器支持： ref=e22 ： getBackbone 返回的元素引用，直接定位快照里的元素 CSS： #id 、 .class 、 a[hr"}, {"url": "/guide/subagent", "title": "子代理 - 手机端 AI 编程工具与终端", "text": "子代理 ​ 版本说明 子代理从 1.11.0 起提供。 子代理是由主会话派生出的独立工作会话。当你面临耗时较长的调研、多模块并行审查或架构对比等复杂任务时，可以让 AI 派发子代理并行处理， 不阻塞当前主对话 。 子代理拥有自己独立的上下文与工具能力。派发后它会在后台独立工作，你可以留在主会话继续讨论，也能随时点进子会话查看实时进度、补充提问或手动暂停。 有合适的子代理且部分工作可以独立完成时，AI 会主动分发这部分任务，同时继续推进主线，负责协调、核验和整合结果。简单或紧密耦合的任务由主会话直接完成，不必把所有工作都派给子代理。 子代理分为两种： 默认通用子代理 ：自动继承父会话的模型配置与全部可用工具； 自定义子代理 ：支持自由指定模型、工具白名单/黑名单以及专属提示词。 使用方法 ​ 在主会话中直接向 AI 提出派发需求即可，例如： 「派个子代理去审查 app/build.gradle.kts ，把潜在问题列出来」 「同时派两个子代理，一个调研数据库迁移方案，一个调研 UI 组件库选型」 「派一个只读调研子代理查清当前的登录与鉴权流程」 AI 在派发前会弹窗向你确认授权；获得同意后子代理将在后台启动，主会话随即恢复空闲，可继续接收你的其它指令。 侧边栏中的位置与管理 ​ 侧边栏会话列表清晰展示了主会话与子代理的父子归属关系： 展开与收起 ：派生过子代理的会话，行尾会显示子代理数量与展开折叠箭头。点击箭头可展开查看其下属的所有子代理； 状态指示 ：正在运行中的子代理会显示绿色的运行状态指示灯； 独立交互 ：点击子代理即可切换进入其会话页，界面与常规会话完全一致，可独立对话、暂停或重新生成； 会话操作 ：长按子代理项可进行重命名、导出与删除；删除主会话时，其名下的所有子代理会随之一同清理。 上下文与信息传递 ​ 上下文独立与双向同步 子代理拥有独立上下文，默认通过派发说明获取主会话的任务背景，保证轻量与专注： 任务派发 ：AI 在派发子代理时，会提炼明确目标与完成标准、关键文件路径、已核实的背景、用户约束、可改动的范围以及期望产出，打包作为初始指令交给子代理。如果你在主会话中手动指示派发，也建议交代清楚关键背景与期望产出； 结果汇总 ：子代理的最终报告应完整写明结论、依据、改动文件、验证结果与未完成项，让主会话仅凭最终报告即可理解结果。子代理执行完毕后，主会话会自动收到完成通知，通知里 直接带上结果摘要与本次改动过的文件 ，主会话按摘要为你汇总；需要完整报告或核对细节时才会再读取一次子代理的最终产出。若主会话当时正在调用其它工具，卡片下方会提示子代理已就绪，并在当前操作后自动跟进处理； 全流程追溯 ：主会话通常只读取子代理的最终结论，如果你想查看子代理完整的工具调用日志、推导轨迹或中间输出，直接在侧边栏点击进入该子会话即可查看全部详情。 专属卡片 ：派发子代理时，聊天流里显示的是对标网络搜索风格的结构化任务卡片，而不是普通工具记录——顶部概览标注「子代理任务」总数与「已派发」状态，下方按序号（01, 02...）清晰列出每个派出的子代理角色、运行模型档位（或继承）、初始任务描述与回退提示，单任务派发与批量多任务派发均可工整呈现。点击任意任务卡片即可直接进入对应子会话；子代理的执行细节与完成汇总则由后续主会话通知与回复承接，避免派发卡片杂乱臃肿。 与主会话的双向通讯 ​ 子代理与主会话之间支持双向异步通讯，互不阻塞： 主会话 → 子代理 ：主会话可以在已授权的任务范围内向子代理追加消息（补充指令、调整分工、纠偏，或对已有结果继续追问）， 可反复发送 。运行中的子代理会在下一轮操作里收到该消息；已完成或暂停的子代理会被重新唤醒并继续工作； 子代理 → 主会话 ：子代理在运行中可以主动向主会话汇报关键进展、求助，或提交需要协调、决策的事项。主会话会收到一条系统通知，并可直接回复。 这些消息在界面上以轻量提示条呈现，不占用普通聊天气泡；主会话忙碌时消息会在当前操作结束后自动跟进处理，空闲时则立即触发新一轮。 自动派发与手动指定 ​ 主会话 AI 了解当前所有可用的子代理及其擅长领域： 自动匹配 ：当你的需求与某个子代理的用途描述（ description ）相符时，AI 会主动选用该专属子代理； 手动指定 ：你也可以在指令中明确指定，例如「使用 Explore 子代理检索所有网络请求的入口」。 内置子代理：Explore ​ 初次启动时，系统会自动在全局目录释放内置的 Explore 只读探索子代理（位于 ~/.aiverse/agents/explore.md ），开箱即用。 它的核心用途是只读的代码库探索与逻辑梳理： 纯只读安全 ：仅开放了代码与文件检索工具（ readFile 、 list 、 search 、 websearch 、 webfetch 、 loadSkill ）， 不包含任何写文件与执行终端命令的工具 ，不会对项目造成改动，也不需要频繁弹窗授权； 模型定制 ：默认继承当前会话的模型。如果想为它配置更经济的模型，只需在 explore.md 中填入对应的 provider 与 model 。若希望由 AI 按任务难度自动挑模型，改用「设置 → 默认模型 → 子代理模型档位」配置轻量/均衡/强力三档，派发时 AI 会自己选档（定义里写死了 model 的优先，档位不生效）； 持久保留 ：此文件仅在首次不存在时释放，你所做的个性化修改在 App 升级时均会完整保留。 自定义子代理 ​ 创建自定义子代理有两种方式，效果完全等价（App 内保存后写出的就是同一份 .md 文件）： 在 App 内新建 （推荐）：「设置 → 子代理」右上角的「＋」，填表单即可，模型可以直接从已配置的供应商里选； 手写定义文件 ：自行把 Markdown 文件放进对应目录，适合从其它项目拿现成定义或用 git 管理。 两个可选目录： 全局配置 ： ~/.aiverse/agents/<name>.md ，所有项目共享，升级不丢失。跟随执行环境：本地模式下是容器内 /root/.aiverse/agents/ （映射至手机 App 私有目录），远程模式下指 服务器 上的 ~/.aiverse/agents/ ，读写经由 SSH 完成； 项目级配置 ： <项目工作区>/.aiverse/agents/<name>.md ，仅对当前工作区生效，可随代码库一同提交到版本控制中。远程模式下这里指的是 服务器上 的工作区，读写经由 SSH 完成。 同名定义时项目级优先。文件由顶部的 YAML 配置（frontmatter）与正文提示词组成： markdown --- name: researcher description: 只读代码与技术调研：广泛检索代码、查阅网络资料并汇总结论，不修改文件 provider: DeepSeek model: deepseek-reasoner reasoningEffort: high mode: plan tools: [readFile, list, search, websearch, webfetch] disallowedTools: [Bash, terminal"}, {"url": "/guide/custom-prompts", "title": "自定义提示词 - 手机端 AI 编程工具与终端", "text": "自定义提示词 ​ AiVerse 的系统提示词可以自行修改。默认提示词随 App 内置、升级时自动更新；只需将需要修改或新增的片段放入自定义目录即可覆盖或扩展，无需修改 App 本体。 v1.12.0 起 本文的片段命名规则（ <两位数字>-<名称>.md ）、按数字新增片段、 .no-builtin 完全禁用开关与 {{AIVERSE_*}} 变量自 v1.12.0 起支持。更早的版本只能放与默认片段 完全同名 的文件来覆盖，不支持按数字新增、 .no-builtin 与变量。 在 App 里管理 ​ 也可以不碰文件系统，直接在 设置 → 提示词 里管理： 页面按编号列出 实际生效 的每个片段，右侧徽章标明这份内容来自哪一层： 项目 ：当前工作区的 .aiverse/prompts.custom/ 全局 ： ~/.aiverse/prompts.custom/ 本地 ： ~/.aiverse/prompts/ （启动时从内置释放的副本） 内置 ：App 自带的 assets/prompts/ 同一编号只生效优先级最高的一份，优先级 项目 > 全局 > 本地 > 内置 ，其余被遮挡。 点一行编辑它的内容。保存默认写到该编号当前生效的层；「本地/内置」不可写，编辑后默认落到全局层，可在编辑页把作用域切到项目层（有工作区时）。 所有片段都可左滑；项目/全局片段可删除当前覆盖，删掉后自动回退到下一层；本地/内置片段的删除按钮为灰色，不可删除。 右上角「+」可用未占用的编号新增片段。编辑时摘要与正文分开填写；摘要显示在列表和预览页，不会注入 AI。手工编写文件时，开头的 <!-- 摘要 --> 同样会被识别为摘要，正文预览会隐藏这段注释。 首次进入会自动弹出使用说明公告，右上角 Info 可随时重看。 批量删除 ​ 列表右上角的「多选」按钮（方框带勾的图标）可以一次删掉多条自定义片段： 点「多选」进入多选模式，每行左侧出现勾选框，整行点击即勾选。只有 项目 / 全局 来源的片段可以勾选，本地与内置来源的勾选框是灰的。 顶部操作条提供「全选 / 取消全选」与删除按钮，最右「×」或系统返回键退出多选。 删除会弹确认框；确认后这些编号的自定义覆盖一并移除，各编号自动回落到下一层来源，列表随即刷新。 编辑页会避让软键盘；摘要或正文较长时可以上下滚动，继续编辑末尾内容。 App 里的改动与手工放文件完全等价，两种方式可以混用。 目录结构 ​ 提示词放在 AI 配置目录 ~/.aiverse/ 下（本地模式容器内为 /root/.aiverse/ ；远程模式为服务器用户 home 下的 .aiverse/ ，读写以远端为准）： ~/.aiverse/ ├── prompts/          默认提示词（App 启动时全量释放，升级自动覆盖） │   ├── 00-identity.md │   ├── 10-communication.md │   ├── ...           顶层是「静态基线」片段，按两位数字前缀排序（内置最后一个为 99-runtime-context.md） │   └── agent/        按需注入的片段（不进静态基线，用到时才读取） │       ├── plan-mode.md           PLAN 模式提醒 │       ├── auto-mode.md           AUTO 模式提醒 │       ├── subagent-base.md       子代理基础运行规范 │       ├── subagent-context.md    子代理运行期上下文（身份/工作区/时间） │       ├── compact-summary.md     长对话上下文压缩 │       ├── title-generator.md     会话标题生成 │       └── init.md                /init 命令的指令正文 ├── prompts.custom/   你的自定义片段（覆盖或新增，升级不动这里） │   ├── 50-我的安全规则.md │   ├── 25-额外要求.md │   └── agent/ │       └── plan-mode.md           覆盖按需片段 ├── skills/ └── docs/ 片段分两类，命名规则不同： 静态基线 （ prompts/ 顶层）： <两位数字>-<名称>.md ，数字是它的身份，决定在系统提示词里的位置。 按需片段 （ prompts/agent/ ）：没有数字，用到时才读取（如切换模式、压缩上下文、派发子代理、生成标题）。 命名规则 ​ 自定义片段放在 prompts.custom/ ： 顶层文件 必须是 <两位数字>-<名称>.md （如 05-开头.md 、 50-我的安全规则.md ）。数字即身份： 数字与某个内置静态基线片段相同（内置数字为 00 、 10 、 15 、 20 、 30 、 40 、 50 、 60 、 70 、 99 ）→ 覆盖 该片段，尾部名称可任意取； 数字不在上述集合里 → 作为 新增片段 ，按数字大小插入基线的对应位置（如 05-开头.md 排在 00 与 10 之间）。 不符合该格式的文件（如 notes.md 、 2024-备忘.md ）会被忽略。 同一数字有多个文件时只取文件名排最前的那个，其余忽略——请保持数字唯一。 agent/ 子目录 里的片段没有数字身份，按 精确同名 覆盖（如 prompts.custom/agent/plan-mode.md ）。 加载优先级 ​ 顶层数字片段（ <两位数字>-<名称>.md ）按四级来源查找，同一编号只生效优先级最高的一份，找到即止： 项目 ： <工作区>/.aiverse/prompts.custom/ （远程模式下是 App 私有目录里对应的项目目录） 全局 ： ~/.aiverse/prompts.custom/ 本地 ： ~/.aiverse/prompts/<同名文件> — 启动时释放的副本 内置 ：App 自带的 assets/prompts/ agent/ 下的按需片段（无编号）没有项目层，按「全局自定义（ prompts.custom/agent/xxx.md ）→ 本地 → 内置」三级查找。 所以你只需要放想修改或想新增的那几个片段，其余会自动使用默认版本。 修改方式 ​ 在 ~/.aiverse/prompts.custom/ 下（没有就手动创建）放入片段：覆盖内置片段用相同数字命名，新增片段用尚未占用的数字命名，子目录片段（如 agent/plan-mode.md ）对应放到 prompts.custom/agent/ 下。 编辑内容。 保存后即时生效 （无需重启 App）。 提示词片段即时生效 自定义提示词片段每次请求都会重新读取，改完直接生效，不用重启 App。注意：技能清单、记忆、子代理清单仍是 新开会话 才刷新。 编辑方式有三种：在终端里用 vi / nano 直接修改；交由 AI 代写（其文件工具能直接读写这个目"}, {"url": "/guide/terminal", "title": "终端 - 手机端 AI 编程工具与终端", "text": "终端 ​ AiVerse 内置一个完整的终端。本地模式下它连着手机上的 Linux 容器，远程模式下它连着你的 SSH 服务器——两种情况都是真实的 shell，可以安装软件包、编译、运行服务。 从聊天页顶部标题栏的「终端」进入。点左上角返回按钮回到聊天页，返回过程中重复点击不会继续退出聊天页。返回不会关闭终端标签。 AI 如何选择命令工具 ​ AI 会按任务是否耗时、是否需要保留会话来选择执行方式： Bash ：用于短时、一次性的命令，例如查询状态、快速检查；执行结束后返回结果。 终端 ：用于构建、安装依赖等耗时任务，开发服务器等常驻进程，以及需要持续输入的交互操作。你可以在终端标签里查看输出和继续操作。 对于会自行结束的耗时任务，AI 可以开启完成通知，任务结束后再继续处理结果；常驻服务和交互程序则按需查看输出、发送输入或停止进程。 标签管理 ​ 终端支持多个标签同时存在，顶部标签栏可以横向滑动，切换时当前标签会自动滚动到可见位置。 标签名前的圆点表示状态：绿色是运行中，灰色是已结束。 点标签右侧的 × 关闭，点标签栏末尾的 + 新建。关掉当前标签后会自动切到相邻的一个。 AI 执行命令时开启的终端也会出现在这里，你可以随时切过去查看它的运行情况。 AI 为后台任务启用完成通知后，本地与远程 SSH 模式都会在任务结束时把退出码和末尾输出送回发起任务的会话；AI 正忙时会在处理过程中或本轮结束后收到通知。停止当前 AI 回复时，待送的完成通知会保留并在本轮收尾后补送。完成通知通过独立通知通道送达，不进入用户消息队列。 输入与复制 ​ 点击终端区域获得焦点，即可直接输入。长按可以选择并复制输出内容。 辅助按键栏 ​ 手机键盘没有 Esc、Ctrl 和方向键，所以终端底部提供了一条可横向滑动的辅助按键栏： 控制键 ： ESC 、 TAB 、 CTRL 、 ALT 。Ctrl 和 Alt 按下后会高亮，再按字母键即组成组合键。 方向键 ：上下左右，长按可以连续发送，用来快速移动光标。 常用组合 ： C-c 中断当前命令、 C-d 发送 EOF 或退出、 C-z 挂起进程、 C-l 清屏。 常用符号 ： | 、 ~ 、 / 、 - 、 _ 、 > 、 : 、 $ 、 \" 、 ' 等，免去切换符号键盘。 外观设置 ​ 点终端页右上角的齿轮图标（或者从「设置 → 通用设置 → 终端设置」进入）可以调整： 配色主题 ：默认「跟随应用」（自动匹配当前应用主题的深浅模式与背景色调），同时内置 GitHub Light 明亮主题与 Termius Dark、Dracula、One Dark、Monokai、GitHub Dark 五套经典暗色配色，选中立即生效，所有已打开的标签一起变。 字体大小 ：5 到 22 之间无级调节，面板顶部有实时预览；也可以直接在终端区域双指捏合缩放，和这里的取值是同一个。 字体 （ 1.11.0 起 ）：默认是 JetBrains Mono（无连字版本）， 0 和 O 、 1 和 l 区分得很清楚。也可以切换成系统等宽字体，或点「导入」从手机里选一个 ttf / otf / ttc 字体文件；导入的字体会出现在列表里，点字体标签上的 × 可以删除，删掉正在用的会自动回落到系统等宽。中文字符始终由系统字体补齐。字体只影响终端，不改变 AI 对话区。 光标样式 ：方块、下划线、竖线三种。"}, {"url": "/guide/overview", "title": "功能总览 - 手机端 AI 编程工具与终端", "text": "功能总览 ​ 本页作为使用手册的快速导览索引，整理了主界面核心工作流与设置页各功能入口对应的文档。 版本说明 标了版本的条目（如「1.11.0 起」）表示该功能自该版本起引入。 核心工作流与主界面 ​ 功能 说明 聊天交互与工作区 标题栏、侧边栏、工具栏、消息队列、工作区切换 → 文档 运行模式（四种模式） Build / Plan / Auto / Expert 的权限控制与场景 → 文档 会话目标（Goal） /goal 设定目标，AI 自主循环推进至达成或预算耗尽（1.13.0 起）→ 文档 检查点与撤销 AI 修改前自动快照，支持一键安全回滚 → 文档 终端交互 多标签会话、辅助按键栏、配色与字体设置 → 文档 内置浏览器 WebView 浏览器，支持 AI 自动化操作网页（导航、点击、填表、截图等）（1.12.0 起）→ 文档 文件浏览与代码编辑 缩进树形目录、语法高亮、内置代码编辑器（1.11.0 起），以及工作区文件在手机上的位置与访问 → 文档 Git 版本管理 可视化状态管理、分支切换、提交历史、回退与删除（1.11.0 起）→ 文档 平板与大屏适配 响应式分栏、常驻侧边栏、并排双栏工作台（1.11.0 起）→ 文档 设置项与扩展能力速查 ​ 通用设置 ​ 入口 说明 偏好设置 全局偏好：无效模型清理、启动时会话、回车发送、首字与间隔超时、重试次数、自动压缩阈值、sendFile 单文件上限（1.12.0 起）→ 文档 外观主题、背景图、语言 主题明暗、预设配色、莫奈取色、背景图与多语言 → 文档 终端设置 终端配色、字体大小与光标样式 → 文档 AI 配置与扩展 ​ 入口 说明 AI 供应商 接入模型服务、管理模型列表、多 Key（1.11.0 起）、思考强度 → 文档 模型思考模式 各模型真实支持的思考档位、能否关闭思考、怎么判断是否生效 → 文档 默认与专用模型 新会话默认模型，以及识图、生图、标题总结的专用模型 → 文档 MCP 服务器 接入外部工具，全局与项目两级配置 → 文档 技能 按需加载的专项能力扩展包 → 文档 子代理 派生独立会话并行执行任务，可在设置内新建、编辑与启停，支持自定义模型与工具集（1.11.0 起）→ 文档 Shizuku 工具 AI 的 Shizuku 工具：用 Shizuku 执行系统命令（1.12.0 起）→ 文档 自定义提示词 覆盖与定制 AI 系统的提示词片段 → 文档 记忆与项目规则 跨会话长期记忆，以及 AGENTS.md / CLAUDE.md 项目规则 → 文档 运行环境 ​ 入口 说明 容器与镜像 本地 Linux 容器、自定义镜像、挂载手机目录、远程 SSH 后端 → 文档 网络代理 全局代理与供应商级代理（1.11.0 起）→ 文档 连接与同步 SFTP / FTP 通道、工作区同步、内置 FTP 服务端 → 文档 权限与后台 ​ 入口 说明 工具授权 AI 调用工具的授权规则 → 文档 软件权限 安装未知应用、存储、电池优化、自启动、Shizuku 等系统权限 → 文档 后台运行 后台保活、屏幕常亮、AI 完成通知、实时通知、授权审批通知 → 文档 数据与诊断 ​ 入口 说明 Token 统计 用量、费用估算、调用明细 → 文档 存储空间 按类别看聊天、容器、工作区等占用，并清理临时数据（1.12.0 起）→ 文档 备份与还原 加密导出导入配置与工作区 → 文档 日志 查看运行日志、崩溃报告 → 文档 常见错误提示 重试气泡分类含义、常见 HTTP 错误码与排查 → 文档 帮助与关于 ​ 入口 说明 关于 版本信息、检查更新与首次启动确认流程 → 文档 用户协议 使用规则、AI 与操作风险、第三方费用及开源权利 → 文档 隐私政策 数据保存、联网传输、日志、备份与删除 → 文档 进阶教程 ​ 主题 说明 在容器中编译 Android 应用 搭 JDK 与 Android SDK，从源码出 APK → 文档 在容器中编译 Flutter 应用 装 JDK、Android SDK 与 Flutter SDK，构建 Flutter debug APK → 文档 在容器中构建 Flutter release APK 用 qemu 转译补齐 AOT 编译器，本地构建 Flutter release 包 → 文档 安装 Playwright 浏览器自动化 容器内装 Chromium 并接入 Playwright MCP，让 AI 操作网页 → 文档 用 adb 无线调试其他设备 在容器里用 adb 连接另一台手机或本机，安装应用、抓日志、截屏 → 文档 自定义面板 用脚本在输入框上方画余额或用量卡片 → 文档"}, {"url": "/guide/storage", "title": "存储空间 - 手机端 AI 编程工具与终端", "text": "存储空间 ​ 「设置 → 存储空间」按类别展示 AiVerse 在这台设备上占用的空间，并提供清理临时数据的入口。 总览 ​ 页面顶部是应用总占用、构成条与设备剩余空间。构成条的整条宽度代表应用总占用，颜色与下方各分类的色点一一对应。页面底部固定显示「清理选中项」按钮及选中数据的大小，滚动列表时仍可操作。 统计需要逐个目录遍历文件，容器与工作区通常最慢。为了不让页面一直空着，各分类算完一个就显示一个，尚未算出的显示「—」，顶部会有「统计中…」提示。如需重新统计，点击右上角的刷新图标。 占用明细 ​ 分类 包含什么 聊天记录 数据库文件：会话、消息、工具结果、调用记录、检查点索引 容器 各容器的根文件系统。展开可看到每个容器，以及占用最大的那个容器中最大的几个目录 容器镜像包 下载或导入的镜像压缩包。容器装好后它不再是必需品，但删掉后该容器无法再次解压 工作区 应用内置工作区里的项目文件（含 .git ）。展开可看每个项目，副标题标出其中的聊天附件 AI 配置与产物 技能、记忆、子代理、MCP 配置、提示词、文档，以及工具输出存档与识图会话缓存 检查点 AI 修改文件前留下的快照，用于撤销 日志 应用运行日志与 AI 请求日志 缓存 系统缓存目录，随时可清 其他数据 设置项、背景图、终端字体、SSH 私钥等零散数据 应用安装包 APK 本体，不可清理 名称旁带箭头的分类点击即可展开明细。「AI 配置与产物」仅展开显示可清理的工具输出存档与识图会话缓存；技能、记忆、提示词等不可清理内容不再逐项显示，但仍计入该分类的总占用。因此，展开的可清理子项之和可能小于分类总大小。 哪些不计入 通过「添加外部工作区」加进来的外部工作区在你设备的共享存储里，不属于应用占用，因此不统计。远程 SSH 模式下服务器上的文件同理。 聊天记录的展开明细列出占用最大的几个会话。它是按消息正文估算的字节数，比数据库文件本身小——数据库还包含索引与页对齐开销。如需减小这一项，去会话列表删掉不再需要的会话；若只想清除调用记录，在「Token 统计」页右上角重置。 容器和工作区不能在这里删除，请到「容器与镜像」页重置或删除容器、在工作区切换面板里删除工作区，避免误删正在使用的环境。删除工作区会连同该工作区的聊天记录一并删除；外部本地工作区是否删除聊天记录，由「偏好设置」中的开关决定。 可释放空间 ​ 清理入口与占用明细放在一起，不再单独列出一组。可清理的四项如下，均不含聊天记录、代码或配置，但部分清理会影响历史内容的回看或追问： 缓存文件 ：勾选「缓存」分类。临时文件之后会自动重建。 运行日志 ：勾选「日志」分类。包含应用日志与 AI 请求日志，清空后新日志照常记录；点击分类仍可展开查看两类日志的占用。 工具输出存档 ：展开「AI 配置与产物」，勾选对应明细。AI 工具输出过长时会落盘一份完整副本。清除后，历史消息里提到的输出路径不再可读取。 识图会话缓存 ：展开「AI 配置与产物」，勾选对应明细。这是识图追问用的历史记录，清除后无法再对旧图片继续追问；这两项只在有占用时显示。 日志与缓存默认选中，工具输出与识图缓存默认不选。勾选后，底部按钮会更新选中项的合计大小；折叠分类不会取消选择。没有占用的项不可勾选，没有选中可清理数据时按钮不可点击。 点击「清理选中项」后，确认框会列出清理目标、合计大小与各项影响。确认后仅清理这些选中项，完成后页面会自动重新统计，并显示本次释放了多少空间。 清理范围是本机应用缓存、日志和全局目录中的数据，工具输出与识图缓存可能由多个工作区产生，不限当前工作区。不会清理各工作区自己的文件、附件、构建缓存或远程服务器数据。 清理不可撤销 删除的文件无法恢复。虽然这些项不含聊天记录、代码或配置，但旧工具输出副本与识图会话历史无法通过重新使用恢复。 占用偏大时如何处理 ​ 容器几个 G ：容器里的包管理器缓存通常是大头（如 Gradle、npm、pip 的缓存目录）。展开容器分类查看哪个目录最大，然后在终端里清理，例如 rm -rf ~/.gradle/caches 。不再使用的容器可以在「容器与镜像」页删除。 工作区偏大 ： node_modules 、 build 、 .gradle 这类构建产物占大部分，删除后重新构建即可恢复。 聊天记录偏大 ：长会话里的工具输出最占空间，删掉早期不需要的会话即可。 镜像包还在 ：容器已经装好后，可在「容器与镜像 → 下载镜像」页删掉对应的下载文件。"}, {"url": "/guide/quick-start", "title": "快速上手 - 手机端 AI 编程工具与终端", "text": "快速上手 ​ 从安装到完成第一条 AI 对话。 系统要求 ​ Android 8.0（API 26）及以上 arm64-v8a 或 x86_64 设备 下载安装 ​ 从 GitHub Releases 下载，三个包按设备选择： 包名 适用场景 armsolo 真机（arm64 设备），体积最小 x86solo 模拟器、Chromebook（x86_64） universal 通用包，同时含两种架构，体积较大 架构要选对 架构不匹配会导致内置容器无法运行。不确定时使用 universal 。 1. 配置 AI 供应商 ​ 首次启动有新手引导 首次启动时会自动开启新手引导（1.12.0 新增），依次引导完成下面几步；也可随时点击「跳过」，或之后在「设置 → 重新运行新手引导」再次启动。 AiVerse 自身不提供模型，需要先接入一个模型服务。 点主页左上角菜单按钮打开侧边栏，点底部「设置」。 进入「AI 配置 → AI 供应商」，点右上角 + 新建，在「配置」标签填写四项： 名称 ：别名，例如「官方 OpenAI」。 上游格式 ： OpenAI / Anthropic / Gemini 三选一。第三方中转站一般选 OpenAI 。 API Key ：你的密钥，形如 sk-xxx 。 Base URL ：API 根地址， 留空时按上游格式使用官方地址 ；用第三方中转时填入中转服务的地址。 底部切到「模型」标签添加模型： 点击「拉取模型」从服务端同步可用列表，点击每行右侧的「+」逐个添加，或用右上角「全部添加」一键加入。 点击右上角 + 手动输入模型名（例如 gpt-4o ）。中转站模型名拉取不全时使用此方式。 可选：点击模型行编辑元数据（上下文窗口、价格、图片输入与工具调用等能力开关）。 填完退出编辑页时会自动保存，没有单独的保存按钮。 2. 选择模型 ​ 回到聊天主页，点击输入框下方工具栏的模型按钮，在弹窗中选择刚添加的模型。顶部搜索框可以筛选，模型按供应商分组显示，点击分组标题可以折叠或展开。 3. 准备执行环境 ​ 默认使用内置的本地容器，无需任何配置。第一次使用时，在主页点击进入终端，按提示完成一次初始化即可（解压系统、安装基础工具），之后 AI 就能正常执行命令。 如需把远程服务器当执行后端，见 远程 SSH 模式 ；容器与镜像的详细设置见 容器与镜像 。 4. 开始对话 ​ 在输入框输入内容后点击发送。输入框下方工具栏最左侧的模式按钮可以在 BUILD、PLAN、AUTO 之间切换，区别见 四种模式 。 实用贴士 ​ 在主页空会话中选择的模型将被记录为新会话的默认模型，后续新建会话自动沿用。 识图、生图与标题总结支持独立指定专属模型，详见 默认模型 。 AI 修改代码前会自动创建快照，支持一键安全回滚，详见 检查点与撤销 。 执行编译等耗时任务前，建议开启 软件权限 中的后台运行保活，防止系统在切换后台时终止进程。"}, {"url": "/guide/container", "title": "容器与镜像 - 手机端 AI 编程工具与终端", "text": "容器与镜像 ​ AiVerse 中 AI 执行命令的环境称为「容器」，入口在「设置 → 容器与镜像」。列表为单选，选中的容器即 AI 命令执行、文件读写与终端所在的环境。 后端分两类，二者必选其一： 本地容器 （在手机上运行 Linux 系统）与 远程 SSH （在远程服务器上运行，见 远程 SSH 模式 ）。 容器列表 ​ 每行是一个容器配置，名称后附来源标记：内置、自定义、SSH。当前生效的那个容器，名称显示为主题色。 以下操作对各类容器均适用： 排序 ：长按行的名称区域上下拖动可调整顺序（重启后保持）；新添加的容器排在列表最前。 编辑 ：行尾铅笔图标。 重置 ：编辑弹窗右上角刷新图标。此为破坏性操作，会删除容器内已安装的工具与配置，需二次确认；确认后正在运行的 AI 会话与所有终端标签都会关闭。内容较多的大型容器删除可能耗时数十秒，期间显示「正在清理容器数据」及已清理项数，完成后自动关闭，界面不阻塞。 删除 ：行上左滑露出红色删除按钮。删除本地镜像会一并清理其 rootfs 释放空间（同样显示清理进度）；删除远程 SSH 仅删除配置，不影响服务器数据。 内置 Alpine 也可删除。全部删除后列表显示空态，可一键恢复内置 Alpine，无需担心误删。 容器运行后，App 会自动识别其系统类型，在列表左侧显示对应图标（支持 Alpine、Ubuntu、Debian、CentOS），无法识别则显示默认图标。 内置 Alpine 容器 ​ App 自带 Alpine 镜像，首次启动时自动加入列表并选中，shell 路径已自动配置，无需额外设置。 首次使用需进入终端完成初始化 本地容器的环境准备（解压 rootfs 及安装基础工具）在首次进入 终端页面 时触发。首次使用请先进入终端完成初始化，之后 AI 命令执行、Git 管理与本地 MCP 才能正常使用。 内置容器的版本不会随 App 升级被替换 新版本 App 可能内置了更新的 Alpine 镜像，但 升级 App 不会动你已经在用的容器 ——你在里面装的工具、软件源配置都会原样保留。 想换到新版基线，请在「容器与镜像」里对该容器点 重置 ：重置会删除它的 rootfs 目录（含容器内已安装的工具与配置），下次进终端重新解压并初始化。 工作区文件与 AI 配置（skill、MCP）不会受影响 ——它们存放在容器之外。新装的 App 首次初始化则直接使用内置的最新镜像。 首次进终端的初始化菜单 ​ 无论内置 Alpine 还是自行导入的镜像，rootfs 解压完成后首次进入终端都会弹出初始化菜单，含四个选项： 1. 自动安装依赖（推荐） 列出待装项（bash、curl、ripgrep、git 等基础工具，以及 Node.js 和 Python 3），输入 y 确认后选择软件源并开始安装。 2. 环境安装 打开「环境安装」菜单，按场景选择开发环境（见下节）。场景是一组运行时的组合，选定后确认清单即可安装；菜单中也提供「自定义安装」，可逐项勾选并指定主版本。 3. 手动安装（不再提示） 跳过安装，此后进入终端不再弹出该菜单，工具自行安装。如需恢复菜单，重置容器即可。 4. 退出 本次不安装，下次进入终端仍会提示。 安装失败不影响进入 shell，重新进入终端可再次尝试。 软件源选择 ​ 换源时可选择： 1) 自动探测（推荐） ：实测各镜像源在当前包管理器下的可达性，自动跳过失效或被墙的源。 2~6) 指定镜像源：华为云、清华 tuna、中科大 ustc、腾讯云、阿里云。 0) 不换源，保持默认。 换源前会备份原配置，失败自动恢复，不影响后续安装。内置 Alpine 的 rootfs 保持官方源，需要国内源时在此菜单切换。 随时安装开发依赖（aiverse） ​ 初始化菜单仅在首次进入终端时弹出一次。之后如需安装其他运行时（例如 Java 或 Go），在终端执行命令 aiverse 即可打开「环境安装」菜单。 aiverse 按场景安装，选定场景并确认清单即可： 场景 安装内容 通用开发 基础工具 + Node.js + Python 3 Python 开发 基础工具 + Python 3 + pip Node.js / 前端开发 基础工具 + Node.js + npm Kotlin / Android 开发 基础工具 + JDK 17 + Android SDK Flutter 开发 基础工具 + JDK + Android SDK + Flutter SDK Java 开发 基础工具 + JDK Go 开发 基础工具 + Go Rust 开发 基础工具 + rustc + cargo PHP 开发 基础工具 + PHP + Composer 仅基础工具 bash、curl、ripgrep、git 基础工具（bash、curl、ripgrep、git）在任何场景下都会安装。场景默认安装软件仓库的最新主版本；如需指定版本，使用菜单中的「自定义安装」逐项勾选。菜单中还支持单独换软件源、查看已安装的运行时。 「Kotlin / Android 开发」与「Flutter 开发」属重场景：会从国内镜像下载 JDK、Android SDK（含 build-tools、platform-tools）及 Flutter SDK，耗时较长、占用存储较多。建议在 Debian / Ubuntu 镜像中安装（内置 Alpine 因使用 musl libc 需额外处理）；ARM64 设备会自动替换为可执行的 aapt2 等原生二进制。ARM64 容器可直接构建 Flutter debug APK，release 包需额外补装转译工具，见《在容器中构建 Flutter release APK》。安装完成后，新开终端会自动带上 JAVA_HOME 、 ANDROID_HOME 等环境变量，具体编译步骤见「进阶教程」中的《在容器中编译 Android 应用》《在容器中编译 Flutter 应用》。 终端右上角的设置图标打开终端设置面板，可调整配色主题、字号、字体与光标样式。 自定义镜像 ​ 内置 Alpine 可满足多数场景。如需 Debian / Ubuntu，或预装特定工具链的环境，可自行添加镜像，有两种方式。 方式一：内置镜像下载（推荐） ​ 打开「设置 → 容器与镜像」，点击右上角下载图标。 页面列出可下载的镜像（Alpine、Ubuntu、Debian 等），点击一行查看详情并下载。 右上角可切换下载源（官方源 / 华为云 / 阿里云 / 腾讯云），国内网络建议选国内源。 下载完成后点击「导入」，镜像加入容器列表，选中即可使用。 已下载的镜像可重复导入；左滑可删除已下载的镜像文件。 下载页右上角的「多选」按钮（方框带勾的图标）可一次清理多个下载文件：进入多选后每行左侧出现勾选框，顶部操作条给出「全选 / 取消全选」与删除按钮，确认后选中的镜像文件一并删除（已导入的容器将无法再从这些文件解压，但已解压好的容器不受影响）。只有 已下载且文件存在 的条目能勾选，未下载的勾选框是灰的。 版本信息会自动更新 ：列表中的版本号由上游发布信息刷新，上游放出新补丁后不用等 A"}, {"url": "/guide/app-permissions", "title": "软件权限 - 手机端 AI 编程工具与终端", "text": "软件权限 ​ 「设置 → 软件权限」集中管理 App 需要的系统级权限。权限状态在页面恢复时（包括从系统设置页返回）自动刷新，已授权的项点击后不会有反应。 后台保活、屏幕常亮、AI 完成通知、实时通知、授权审批通知这几个开关在 后台运行 页。 安装未知应用 ​ 显示当前是否已允许。未允许时点这一行会跳到系统设置里本应用的「安装未知应用」开关页，开启后才能安装 APK。 访问存储空间 ​ 显示当前是否已授权。未授权时点击会弹系统权限申请框，用于读写工作区文件与容器镜像。 如果权限已被永久拒绝（系统不再弹框），会有弹窗提示，点「去设置」手动开启。 忽略电池优化 ​ 显示当前是否已豁免。未允许时点击跳到系统的电池优化申请页，对本应用豁免省电策略，降低后台进程被杀的概率。 自启动管理 ​ 点击跳转到你设备厂商（小米、华为、OPPO、vivo、魅族等）的自启动管理设置页，允许 App 在开机或被系统终止后自动拉起。厂商设置页打不开或匹配不到厂商时，会回退到本应用的详情页。 这一项配合「后台运行保活」和「忽略电池优化」一起使用，能进一步降低后台被终止的概率——国产 ROM 的后台限制比较激进，若长任务经常被打断，建议三项都开启。 Shizuku 授权 ​ Shizuku 让本应用可以执行系统命令，是 AI 的 Shizuku 工具的前提。这一行显示当前状态： 未安装 / 服务未运行 ：点击打开 Shizuku 应用，按其中的指引安装或启动服务。 未授权 ：点击申请授权，在 Shizuku 弹出的授权框里选「允许」。 已就绪 ：授权完成，AI 即可调用 Shizuku 工具。 从 Shizuku 应用返回本页时状态会自动刷新。用法与安全注意事项见 Shizuku 工具 。"}, {"url": "/guide/permissions", "title": "工具授权 - 手机端 AI 编程工具与终端", "text": "工具授权 ​ AI 要执行命令、写文件之前需要你授权。本页管理已经保存下来的授权规则，入口在「设置 → 工具授权」。 工具自动批准与任务授权分别生效：即使在 AUTO 模式下，难以撤销或影响共享状态的操作（如强推、修改远端、发消息、提/合 PR）仍需取得你针对该操作的明确确认。当前要求、长期记忆与项目规则都须遵守平台权限和安全边界。 规则的来源 ​ 对话中 AI 请求调用工具时会弹出授权弹窗，你有两个选择： 始终允许 ：在 当前项目 记住一条允许规则，以后符合规则的调用自动放行。规则为精准匹配（例如 git pull 、 rm temp.log ）。如果命令里含管道、重定向、命令替换，无法被记住，只能单次放行——弹窗里会写明是哪一处构造（如「命令替换 $(...) 」）导致无法记忆。 拒绝 ：只拒绝这一次，不产生规则。 被权限规则拒绝时，AI 收到的提示会包含 命中的规则 与被拦下的 具体片段 （例如「命中规则：Bash(git push)；触发片段：git push origin main」），便于它换一种允许的写法，而不是把整条命令反复重试。 另外系统有一份内置白名单：少量完全无害、只读、不派生子进程的命令（ ls 、 pwd 、 cat 、 grep 、 ps 、 top 、 git status 等）不弹窗直接放行。 例外： Shizuku 工具（直接操作宿主 Android 系统）属高危，任何命令都会弹窗确认且不支持「始终允许」，也不适用内置白名单； ShizukuControl （直接控制手机，如打开应用、截屏、模拟点击）更高危，强制逐次确认、连「禁用安全拦截」也无法豁免，且需悬浮窗权限。二者详见 Shizuku 工具 。 多会话并行时的授权 ​ 多个会话（含子代理）同时工作时，每个会话可以各自挂起一个授权请求，互不阻塞： 授权弹窗顶部会标注 发起该请求的会话标题 （如「会话「重构登录模块」」），可明确区分弹窗属于哪个会话。 弹窗在任意会话界面都会展示，处理完自动切到下一个待授权请求。 侧边栏会话列表里， 正在等待授权 的会话行左侧指示灯是 橙色常亮 （执行中是绿色脉冲）。据此可以发现被挂起等待授权的后台会话，点进去处理。 页面结构 ​ 规则分「当前项目」和「全局」两组，点标题可折叠。 每条规则显示判定图标（对勾是允许，叉是禁止）、工具名、匹配范围与判定，例如 git pull · 允许 、 整个工具 · 允许 。 项目规则右侧有个加号图标，可以把这条规则 提升为全局 ，对所有项目生效；提升后它从本项目列表消失。 规则行左滑露出红色删除按钮。 禁用安全拦截 ​ 页面顶部有一项「禁用安全拦截」开关，默认关闭。 关闭（默认）：AUTO（自动）模式下仍会拦截灾难性删除—— rm 删除根目录、系统关键目录（ /etc 、 /usr 等）、工作区根目录或用户主目录等操作会被直接拒绝；含命令替换、子 shell、绝对路径重定向等无法静态判定、且疑似破坏性的命令（如 rm -rf $(...) 、 cat > /etc/xxx ）同样会被拦下（无法确认删除目标）。同时，AUTO 下 Shizuku 与 ShizukuControl 工具仍会逐次弹窗确认（不会被「全放行」豁免）。这是防误删的底线。 开启：AUTO 模式下连这层拦截也取消，所有命令一律放行， Shizuku 工具也不再弹窗。注意「Shizuku 不可记忆」不受此开关影响：BUILD 模式下它仍逐次确认、不可记忆。 ShizukuControl 更严格：连「禁用安全拦截」也无法豁免，始终强制逐次确认。BUILD / PLAN 模式的安全拦截不受影响。 打开开关前会弹出确认框，确认按钮带 5 秒倒计时 ，倒计时结束前不可点，避免误触。 仅在确有需要时开启 开启后，AUTO 模式下的 rm 等破坏性命令不再有任何兜底。只在完全清楚风险、且确实需要时才打开。 高危命令提权 ​ 非 PLAN 模式下， rm 删除根目录、系统关键目录（ /etc 、 /usr 等）、工作区根目录或用户主目录等灾难性操作会被内置安全防护直接拒绝。如果 AI 判断确有必要执行，它会在调用时带上 elevate: true 重试——此时不再直接拒绝，而是弹窗请你 一次性授权 （弹窗标题为「高危操作提权确认」）。 BUILD 与 AUTO 模式下都可用；AUTO 下会弹窗的场景有两种：灾难性删除提权确认，以及 Shizuku / ShizukuControl 工具调用。 提权只对单次调用有效，不会生成记忆规则（「始终允许」不可用）。 PLAN 模式仍为硬拦截，不受提权影响。 关于「禁止」规则 ​ 授权弹窗里没有「禁止」这个选项（拒绝只影响单次），所以正常使用不会产生禁止规则。 禁止规则目前只能手动编辑配置文件产生：项目规则写在 <项目根>/.aiverse/permissions.json ，全局规则写在 ~/.aiverse/permissions.json 。手工编辑保存后 App 会在几秒内自动检测并刷新页面，规则立即生效。 配置文件格式： json { \"permissions\" : { \"allow\" : [ \"Bash(git pull)\" , \"writeFile\" ], \"deny\" : [ \"Bash(rm -rf /)\" ] } } 全局禁止优先于项目允许 deny 里的规则会挡掉同名的 allow 规则。例如全局禁止了 Bash(rm -rf /) ，那么任何项目都不能放行这条命令。如需额外的安全兜底，可在全局 deny 里添加规则。"}, {"url": "/guide/token-stats", "title": "Token 统计与费用 - 手机端 AI 编程工具与终端", "text": "Token 统计与费用 ​ 「设置 → Token 统计」记录每一次 AI 调用的消耗，用于查看 token 用量、费用与缓存命中情况。 数据从该功能上线后开始记录，之前的历史调用没有明细。页面实时刷新。 周期切换与维度筛选 ​ 顶部四个标签：今天 / 近 7 天 / 近 30 天 / 全部。切换后下面所有卡片、图表和列表同步更新。「今天」的趋势图按小时展示，其余按天。 周期下方提供维度筛选条： 供应商筛选 ：下拉选择「全部供应商」或指定供应商。 模型筛选 ：下拉选择「全部模型」或指定模型。 清除筛选 ：激活筛选后出现，点击可一键重置为全部数据。 此外，直接点击「供应商统计」或「模型统计」中的任意一行，也可快速将该项设为筛选条件，再次点击即可取消。 概览 ​ 四张卡片：总消耗（输入加输出）、请求次数、费用、缓存命中率。 费用是 估算值 ，优先使用你在「供应商 → 模型」里填的自定义单价，未填的才按 models.dev 的公开单价计算：缓存读取按缓存价计算，没有缓存价时按输入价的 10% 估；缓存写入按缓存写入价计算，没有时按输入价的 1.25 倍估。总费用按「渠道 + 模型」分别套单价再求和，因此同一个模型从不同供应商调用会各自计价。缓存命中率是缓存读取除以总输入，卡片下方另附本期的缓存读取与写入 token 量。 费用仅供参考 这是按公开单价估算的结果，不是账单。中转站改过价格、有折扣，或你使用的模型没有单价数据时，估算会和实际扣费不一致。以供应商后台的账单为准。 消耗趋势 ​ 折线图展示周期内的输入、输出、缓存命中三条线（蓝色输入、橙色输出、紫色缓存），线下方有半透明填充，方便辨识重叠部分。左轴是 token 数（用 k / M 缩写）。 时间轴按周期完整展开，没有记录的天或小时补 0，因此调用集中在某一天时也能正常看出走势。 渠道与模型统计 ​ 渠道统计 按供应商聚合，展示渠道名称、已配置密钥凭证数量、成功率百分比与横向进度条，右侧突出展示请求次数与 token 消耗，按总消耗倒序排列。 模型统计 按模型聚合，每行显示模型名、输入输出消耗、调用次数和成功率，按总消耗倒序排列。 点击任意渠道或模型行可快速作为筛选条件联动整页数据。 调用记录 ​ 每页 10 条的明细表，底部可翻页，左右滑动看全部字段： 字段 说明 调用时间 年月日时分 渠道 / 模型 用的哪个供应商和模型 思考强度 本次调用的档位，没有档位的模型显示 - 实际发出 真正发给服务端的思考参数（如 effort=max 、 thinking=disabled ）；发生降级时显示「原档位 → 实际发出」，用来判断设置有没有被服务端照做 状态 success 成功 / error 失败 / cancelled 已取消 输入 / 输出 / 缓存读取 / 缓存写入 各类 token 数 缓存命中率 缓存输入除以总输入 首字延迟 从请求发出到首个内容事件（文本、思考或工具调用结果）到达的时间 总耗时 本次调用的总时长 预估费用 没有单价数据的模型显示 - 纯工具调用的那一轮也会统计首字延迟。 重置 ​ 页面右上角的垃圾桶图标可以清空全部调用记录，统计随之归零。会弹确认框， 清空后不可恢复 。"}, {"url": "/guide/files", "title": "文件浏览与代码编辑 - 手机端 AI 编程工具与终端", "text": "文件浏览与代码编辑 ​ 版本说明 文件树与代码编辑页从 1.11.0 起提供。 侧边栏顶部的「文件」标签页用来浏览当前工作区与当前容器的文件，点文件默认打开全屏的代码编辑页（图片与安装包除外，见下文「图片与安装包」）。本地工作区和远程 SSH 工作区都支持，读写方式按当前模式自动决定。 浏览文件 ​ 「文件」页是一棵就地展开的缩进文件树，有 两个根 ： workspace ：当前工作区，默认展开。 当前容器 ：名称就是当前选中的容器（如「内置 Alpine」），图标与设置里的「容器与镜像」列表一致。展开后是容器的整个文件系统（ /etc 、 /root 、 /usr 等），默认折叠。本地 PRoot 容器里看到的是容器内的文件，远程 SSH 下看到的是远程服务器上的文件。 两个根各自可折叠展开，右上角有一个刷新按钮。 点目录在原地展开或折叠，点文件直接打开编辑页（图片、安装包见下文「图片与安装包」）——无需逐级进入与返回。 目录排在文件前面，同类按名称排序。 文件按类型显示不同图标（代码、脚本、配置、文档、图片、音视频、压缩包等），采用与 App 全局一致的单色线性图标并跟随主题色着色。 着色规则类似 VS Code： . 开头的隐藏文件显示为浅色弱化，被工作区根 .gitignore 命中的条目显示为橙色（只看工作区根目录的 .gitignore ，不解析子目录里的；容器里的文件不受影响）。 路径很深或文件名很长时不受影响：整棵树共享一个横向滚动，名称不会截断成省略号，左右滑动即可看全。 你展开或折叠过的目录会 按工作区记住 ，关掉 App 再打开、或者切走再切回同一个工作区，都会恢复上次的展开状态。 容器根只在展开时才去读目录；读不到（容器未安装、远程未连接）时该行会标红，不影响工作区那棵。 本地模式下，AI 文件工具支持通过符号链接读取和写入文件，包括指向容器绝对路径的链接。读取或写入会访问链接目标，删除、重命名或移动链接本身则保留目标内容；目标不存在时读取会提示文件不存在，循环链接会报错。项目授权配置目录使用此类链接时，也能读取和保存规则。 AI 局部修改文件时兼容 Linux 常用的 LF 与 Windows 常用的 CRLF 换行，不需要先转换整份文件。替换内容沿用目标区域的换行格式（目标区域没有换行时采用文件的换行格式），未修改的区域保持原样。缩进和其他字符仍需准确匹配；如果 AI 提示找不到原文，让它重新读取对应片段后再修改。 从系统文件选择器访问 ​ 在支持系统文件选择器的应用中选择 AiVerse，可以访问 projects （本地项目）和 aiverse （AI 配置）两个目录。AiVerse 顶层只用于展示入口，不能在此新建或删除；进入子目录后可按授权读写文件。指向共享范围外的符号链接不会展示，也不能通过它访问其它内部文件。 图片与安装包 ​ 文件树里的 图片 （png / jpg / jpeg / gif / webp / bmp）点击后进入应用内的全屏查看器，可以捏合缩放、双击放大，与聊天区看图一致； APK / APKS / XAPK 点击后直接调起系统安装器（首次会引导你开启「允许安装未知应用」）。这两类都不会进入代码编辑器，其余文件仍照常打开编辑页。 从对话中打开文件 ​ AI 在对话中引用代码时会把路径写成可点击的链接（带下划线的 文件路径:行号 ）。点击这类链接会直接打开编辑页，带行号的还会自动滚动到那一行，并使其 尽量停在屏幕中间 （目标行靠近文件开头或末尾时受滚动范围所限会贴边）。打开后你一滑动，自动定位就交还给你，不会再把画面拽回目标行。 支持工作区内的文件、AI 配置目录（ ~/.aiverse/... ）以及容器系统文件（ /etc/... 、 /root/... ），远程 SSH 工作区下同样可以打开。指向普通网址的链接不受影响，仍然用系统浏览器打开。 点到不存在的路径、目录，或超过大小上限的文件时，编辑页会给出对应的失败提示。 列表刷新 ​ 本地工作区下文件变动会 自动刷新 ，不限于 AI 改的——你在终端里执行命令、或用其他 App 改动同样会被感知。 它监听的是工作区根、容器根（展开时）和当前所有 已展开 的目录，不递归整棵树，因此大仓库下也不会占用大量系统资源；折叠某个目录后就不再监听它。 另外两个刷新时机：侧边栏每次出现都会重读一次（宽屏常驻侧栏下，每次从其它页面回到聊天页也算）；工作区根那行右侧的刷新按钮可随时手动重读。 远程 SSH 工作区无法监听远程文件系统的变动， 只能 依靠这两个时机刷新，发现列表和实际不符时点击刷新按钮。远程模式下读目录要走网络，可能有短暂的加载状态，失败时会在列表位置显示具体原因。 新建、重命名、删除 ​ 长按目录行 （工作区根、容器根或任意子目录），从底部菜单里选「新建文件」或「新建文件夹」，新建的条目落在该目录下。如果长按的是折叠状态的目录，会先自动展开好让你看到结果。 名称只能是单个条目名：含 / 、 \\ 或是 . 、 .. 时确认按钮不可点击——避免误创建到其他目录。同名条目已存在或目录不可写时会提示失败，不会覆盖原有文件。 长按文件或子目录行 可以重命名和删除（两个根节点都只能新建）： 重命名 ：只在同一目录内改名，不做跨目录移动。 删除 ：文件直接删除；文件夹会连同里面全部内容递归删除，所以会先弹确认框。 删除不可撤销 删除不进回收站，也不受检查点保护。确认前请考虑清楚，尤其是删除文件夹。 复制、剪切与粘贴 ​ 长按文件或子目录选择「复制」或「剪切」，再长按目标目录选择「粘贴到此处」。目标已存在同名条目时，会先询问是否覆盖；覆盖会替换原有条目及其内容，不可撤销。 不能在原目录用粘贴覆盖源条目，也不能把文件夹复制或移动到自身及其子目录。此类操作会被拒绝，源文件保持不变。 代码编辑页 ​ 点文件后侧边栏收起，进入全屏编辑页。 顶部左上是返回，右上依次是撤销、重做、保存、设置。撤销和重做在没有可操作内容时置灰，保存按钮只在有未保存改动时可点。 撤销按输入停顿分步 ：连续快速输入算一步，停顿约半秒后再输入即算新的一步。一路撤销回打开时的样子后，文件名前的星号消失、保存按钮置灰，此时退出也不会再提示是否保存。 打开 Markdown 文件时，撤销按钮左边会多一个 预览切换 按钮，点击切到渲染效果，再点切回源码。预览和源码共用同一编辑状态，切换不会丢失未保存的修改。 预览是完整的 Markdown 渲染： 文档里内嵌的 HTML（居中标题、图片、表格排版、徽章等）会照常显示 ，代码块带语法高亮，配色跟随应用深浅主题。文档里的相对路径图片（如 docs/a.png ）会从当前工作区读取，远程工作区也能显示；网络图片（徽章、在线图表等）需要联网才能加载。预览页内点击链接不会跳转，避免离开当前文档。 预览不含 LaTeX 公式渲染，含公式的文档切回源码查看。 导航栏下面有一条文件名小栏：左边是文件名（有未保存改动时前面加星号），右边是光标的行列位置和文件编码。 底部快捷符号栏 可横向滚动，最左是光标左右移动和缩进（Tab），后面是编程常用符号（括号、引号、运算符、 ; : | & 等），点击即在光标处插入"}, {"url": "/guide/error-codes", "title": "常见错误提示 - 手机端 AI 编程工具与终端", "text": "常见错误提示 ​ AI 请求失败或网络波动时，聊天页会先显示「正在重试 N/6」的气泡，气泡首行标注本次重试的原因；重试耗尽仍失败时，错误会以红色气泡展示。本文说明这些提示的分类含义与排查思路。 重试提示分类 ​ 请求中途断线或服务端暂时异常时，AiVerse 会自动重试（最多 6 次、指数退避）。每次重试前气泡会先显示失败原因： 气泡提示 触发条件 可能原因与排查 速率限制 (429) 服务端返回 429 请求过于频繁，或套餐额度将尽。稍候自动重试即可；频繁出现请到供应商后台查看用量 服务器负载过高 (503) 服务端返回 503 模型服务或中转站负载过高，属临时故障，等待自动重试即可 服务端错误 (5xx) 服务端返回 500 / 502 / 504 等 服务端异常或网关问题，与你的配置无关，稍后重试 连接超时 建立连接或等待响应超时 网络较慢、服务无响应，或中转站响应慢。检查网络，必要时更换网络或节点 连接被拒绝 目标端口没有服务在监听 供应商 Base URL 填错（域名 / IP 或端口不对），或服务未启动，到「设置 → AI 供应商」核对 DNS 解析失败 域名解析失败 网络未连通，或自定义 Base URL 的域名拼写错误 连接中断 连接建立后被断开、流被中断 网络抖动、代理不稳定或服务端主动断开。自动重试即可；反复出现请检查网络与代理设置 SSL 握手失败 TLS 证书校验失败 自定义 Base URL 时确认协议（https）与证书正确，或服务端证书异常 网络连接断开 其它网络层故障 移动网络切换、弱网环境，检查网络后手动重试 网络异常 无法归类的错误 查看具体错误文本，仍无法解决时可附日志反馈 常见 HTTP 错误码 ​ 请求失败时，重试气泡和最终错误气泡会附上 HTTP 状态码。常见状态码含义如下： 状态码 含义 可能原因 401 鉴权失败 API Key 错误、已过期或被吊销，到「设置 → AI 供应商」检查密钥 403 权限不足 密钥没有该模型或接口的权限、地域限制、余额为 0 404 接口不存在 自定义 Base URL 路径填错（如漏了 /v1 ），到供应商设置核对 429 速率限制 请求过于频繁或额度用尽，稍候重试或升级套餐 500 服务端内部错误 服务端临时故障，与配置无关 502 网关错误 中转站上游不可用 503 服务过载 服务端负载过高，稍候重试 504 网关超时 上游响应超时 工具返回的错误码 ​ AI 调用工具失败时，聊天里的工具卡片会显示失败原因，其中一部分带固定错误码。与文件编辑相关的几个如下： 错误码 含义 怎么处理 STALE_FILE 要改的文件已被 其他会话或用户 改过，AI 手上的内容已过期，本次修改 没有写入 不用管，AI 会重新读取该文件后重做。若反复出现，说明确实有另一个会话在同时改这个文件，建议先停掉其中一个 FILE_NOT_FOUND 目标文件不存在 确认路径；AI 通常会改用 writeFile 新建 NO_MATCH editFile 要替换的原文在文件里找不到 文件内容与 AI 的预期不一致，AI 会重读后重试 MULTIPLE_MATCHES 要替换的原文在文件中出现多次，无法确定改哪一处 AI 会补充更多上下文后重试 FILE_EXISTS 写入时目标已存在且不允许覆盖 正常保护行为，AI 会改用 editFile 局部修改 多会话同时改同一个文件 ​ AiVerse 支持多个会话（含子代理）并行工作。两个会话同时修改同一个文件时，如果放任不管，后写入的一方会 静默覆盖 前一方的改动，且双方都以为成功了。 为避免这种情况，AiVerse 做了三层保护： 同时刻 ：同一文件的写入会被串行化，不会出现两个会话交错写同一个文件。 跨时刻 ：AI 写完文件会记住版本；下次再改同一文件前会先比对，若期间文件已被改过就拒绝写入并提示重新读取（即上面的 STALE_FILE ）。 原子写 ：写文件时先写临时文件再整体替换，因此并发读取不会读到\"写了一半\"的内容，写入中途失败也不会留下半个文件。 你通常不需要干预。需要留意的是： 你自己在编辑器里改完文件后，AI 的写入也可能被判为过期 ——这是预期行为，它会重新读取后再改，不会覆盖你的修改。反过来，若 AI 刚改过某文件而你在编辑器里保存，编辑器会提示冲突，让你选择覆盖还是放弃自己的修改。 撤销代码时的表现 ​ 「撤销到某个检查点」会尽量还原当时的文件内容，但 不会覆盖它不认识的改动 ： 文件在检查点之后被 其他会话 改过 → 该文件被跳过，并在提示里列出，改动保留。 文件是 当前会话 自己改的 → 照常还原（这正是撤销的用途）。 已知局限：如果某个文件是这次对话中 新建 的，撤销时一律删除它，即使期间别的会话往里写过内容。删除前无法可靠判断，因此撤销这类文件时请留意提示。 想减少冲突 让并行的会话尽量负责不同的文件。若两个会话确实要长期改同一批文件，建议错开执行，而不是同时跑。 与多 Key 切换的关系 ​ 「设置 → AI 供应商」开启多 Key 后，只有 密钥本身有问题 的错误（鉴权失败、权限不足、限流、余额用尽）才会消耗失败计数并触发 Key 切换；服务器 5xx、请求超时、网络不可达等错误换 Key 也无法解决，因此不会误切换。未开启多 Key 时，限流（429）没有可切换的密钥，会像其它瞬时故障一样退避重试。详见 AI 供应商与模型 → 多 Key 。"}, {"url": "/guide/background-run", "title": "后台运行 - 手机端 AI 编程工具与终端", "text": "后台运行 ​ 「设置 → 后台运行」集中管理 App 在后台的运行与提醒行为。 后台运行保活 ​ 开启后显示一个前台通知，避免 App 退到后台时进程被系统终止。即使没有任何终端会话、AI 也空闲，进程同样保持存活；进程被系统回收重建后会自动恢复这个常驻状态。点通知可以回到 App 主页。 运行编译这类长任务前建议开启。 AI 执行期间会自动保活 即使该开关关闭，AI 开始执行任务时也会自动亮起同一个常驻通知并保持 CPU 唤醒（避免熄屏后回复中断、工具卡住），所有会话的任务结束后自动收起。手动打开开关的意义在于「空闲时也常驻」：希望终端里自行运行的后台命令不被打断，就保持开启。开关开启时，AI 任务结束不会将其关闭。 屏幕常亮 ​ 开启后只要 App 停留在前台，屏幕就不会自动息屏，适合持续观察 AI 任务或终端输出。切到其它 App 或回桌面后自动失效，不影响系统的自动锁屏设置，也不需要额外授权。 长时间开着会多耗电，插着充电器用更合适。 Agent 完成通知 ​ 开启后，当 App 在后台、AI 完成一轮对话时会弹系统通知（标题「任务完成」，内容是你发的那条消息；如果是后台任务触发的自动轮次，显示对应的任务标题），点通知回到 App 看结果。 App 在前台时不弹，避免打扰你正在看的对话。 实时通知 ​ 开启后，AI 在后台工作时会显示一条实时进度通知，内容是当前正在做的事（「正在思考」「正在联网搜索」「正在执行命令」等）。多个会话同时运行时合并成一条，逐行列出每个会话的状态。回到前台、或所有任务结束后自动收起。 只在 App 处于后台时显示，你正在看的对话不会被打扰。 通知能否被系统提升到状态栏、锁屏（部分机型表现为顶部「岛」），取决于系统版本： Android 16 及以上 （例如 ColorOS 16）会把它当作实时通知展示；更低版本只显示为普通通知。 授权审批通知 ​ 开启后，当 App 在后台、AI 有阻塞等待你处理的确认时会弹系统通知，包括三种情况：请求工具授权（如执行命令、改写文件）、向你提问、退出计划模式等待计划审批。多个会话同时等待时合并成一条，逐行列出各自的状态（「需要授权」「需要回答」「等待计划审批」）。点通知回到 App 处理，处理完或回到前台后自动收起。 只有 一个 待处理项时，通知上会直接带按钮：工具授权显示「拒绝」「允许」（「允许」只放行本次、不记忆规则），计划审批显示「批准」「拒绝」，点一下即可完成审批，不必回到 App。若同时有多个会话待处理、或待处理的是向你提问，则只显示内容，点通知回到 App 处理。按钮只针对通知所对应的审批请求；请求已取消或处理完时，旧按钮不会批准后来的请求。 App 在前台时不弹，避免打扰你正在看的对话。 Android 13 及以上 首次开启需要通知权限的开关（后台运行保活、Agent 完成通知、实时通知、授权审批通知）时会先申请「通知」权限。如果系统弹不出授权框（权限之前被关过或拒绝过），会有弹窗提示，点「去设置」跳到系统设置页手动开启。权限授予前开关不生效。 系统权限（安装未知应用、存储、电池优化、自启动、Shizuku）见 软件权限 。 切到后台后断网怎么办 ​ 把 App 切到后台一段时间后，AI 对话可能中断并提示「网络连接断开」。这是 Android 为省电对后台应用的正常限制：应用不在前台时，系统会 冻结 它的进程，冻结期间收不到也发不出数据，已经建立的网络连接也会被切断。这与屏幕是否熄灭无关。 注意 ：把系统的省电策略改成「无限制」通常解决不了这个问题——它只解除「低电耗 / 应用待机」限制，管不了进程冻结；而且屏幕没熄时系统根本不会进入低电耗，改它也看不出效果。 按下面的顺序设置，多数情况都能明显改善： 打开上面的「后台运行保活」 ，并保留通知栏的常驻通知（不要关掉它）。 在多任务界面给本应用加锁 （各机型操作见下），不要直接把它划掉——直接划掉常常等同于强制停止。 在系统设置里把本应用设为「无限制 / 不优化」，并允许自启动 。 常见品牌设置路径 ​ 不同品牌的后台与省电入口位置不同，找不到时可在系统设置顶部搜索「自启动」「后台」「省电」等关键词。 品牌 关键路径 华为 / 荣耀 应用启动管理 → 关闭自动管理 → 在「手动管理」里打开「允许自启动」「允许关联启动」「允许后台活动」；多任务卡片下拉加锁 小米 / Redmi 省电与电池 → 右上角设置 → 应用智能省电 → 选本应用 → 无限制；应用设置 → 授权管理 → 自启动管理；多任务长按卡片加锁 OPPO / 一加 / realme 应用 → 应用管理 → 本应用 → 电池使用情况 → 允许后台活动；应用 → 自启动；电池 → 更多设置 → 优化电池使用 → 不优化；多任务卡片加锁 vivo / iQOO 应用与权限 → 权限管理 → 所有权限 → 自启动；电池 → 后台耗电管理 → 允许后台高耗电；多任务卡片加锁 三星 电池和设备维护 → 电池 → 后台使用限制 → 把本应用加入「从不休眠」；应用程序 → 本应用 → 电池 → 不受限制 原生 Android 等 电池 → 电池优化 → 本应用 → 不优化；若熄屏也断，WLAN → 高级 → 休眠状态保持 WLAN 连接 → 始终 各品牌路径会随系统版本变化，以手机实际界面为准。 还有几个可能原因 ​ 有的系统会在省电策略之外， 单独限制后台应用的联网 ，请确认本应用未被禁止后台联网。 手机开机两三天后后台管理会变严，此时重启一次手机往往能明显改善。 AI 长回答在后台中断属于可预期情况 ：模型长时间没有输出时，网络中间的网关可能把空闲连接断开，这一点 App 无法完全避免；回到前台后会自动重试。"}, {"url": "/guide/proxy", "title": "网络代理 - 手机端 AI 编程工具与终端", "text": "网络代理 ​ 版本说明 网络代理从 1.11.0 起提供。 「设置 → 运行环境 → 网络代理」配置全局代理，让 App 的所有网络请求（AI 对话、MCP、模型列表、检查更新、更新包下载、镜像下载、网页搜索）以及容器内的命令（ curl 、 git 、 npm 、 pip 等）统一走代理。 代理设置 ​ 启用代理 ：总开关，关掉后所有请求恢复直连。 类型 ：点击从底部弹窗选 HTTP 或 SOCKS5。 HTTP ：经 CONNECT 隧道转发，可代理全部 http/https 流量。本地 Clash 的 127.0.0.1:7890 就是这一类。 SOCKS5 ：TCP 级转发（Clash 通常是 7891 端口）。注意容器内的 npm 和 pip 对 SOCKS5 支持有限。 服务器地址 / 端口 ：代理地址。 认证 （可选）：代理需要用户名密码时填。本地无认证的代理（如 Clash）无需配置。 不走代理的地址 ：逗号分隔，命中的直连。支持主机名、通配符 * 、子域 *.example.com 、 host:port 以及 CIDR 网段。默认值已经包含了 localhost 和常见内网段。 填完整之后下方会出现 连通性测试 卡片： 测试地址 ：默认 https://www.google.com ，可以改成任意目标。 测试代理 ：经当前代理向该地址发一次请求，确认代理真的能用。测试不会展示出口 IP，也不向第三方服务外发你的本机 IP。 供应商级代理 ​ 单个供应商也能配专属代理。在「AI 供应商 → 编辑页 → 选项 → 网络代理」，界面和全局代理页基本一致（少了「不走代理的地址」）。 开启后，这个供应商的 AI 请求走专属代理，其它请求仍走全局代理；关闭则跟随全局。改动随供应商编辑页的保存一起生效。 匹配规则是按供应商 Base URL 的 主机加路径前缀 精确匹配，所以同一个主机上不同路径的供应商可以各配不同的代理，请求按最具体的路径前缀分派。只有当多个供应商的主机和路径完全相同（同一端点、不同 Key）时无法区分，这时最先配置的那个生效。 适合多个供应商共用同一个网关域名但路径不同、各自需要不同出口的情况。 容器内命令不受供应商级代理影响 容器里的命令始终走全局代理。 生效时机 ​ 所有修改 即时生效 ，新连接立即走代理，无需重启 App。 但容器内已经启动的常驻进程不会继承新的环境变量，需要重启那个进程或整个容器。容器内的代理是通过环境变量实现的：HTTP 类型注入 HTTP_PROXY / HTTPS_PROXY / ALL_PROXY / NO_PROXY ，SOCKS5 类型注入 ALL_PROXY=socks5h://... （走远程 DNS）。 注意 ​ 代理配置存在 App 私有目录里，不影响系统级代理设置。 代理不可用（地址填错、代理没启动）时网络请求会失败，关掉「启用代理」即可恢复直连。 远程 SSH 模式下服务器上的命令不经过本地代理 ，需要在服务器上自行配置。 不支持 HTTPS 代理（即到代理服务器本身走 TLS 的那种）。"}, {"url": "/guide/about", "title": "关于与更新 - 手机端 AI 编程工具与终端", "text": "关于与更新 ​ 「设置 → 关于」显示应用信息，也是检查更新的入口。 版本与检查更新 ​ 顶部卡片显示 App 图标、应用名和一句简介，下面的「版本」行显示当前版本号。 点版本行手动检查更新 ：会查询 GitHub 发布列表是否存在更高版本（按你选的更新通道过滤）。有新版本时弹窗显示「发现新版本」，并列出 从你当前版本到最新版本之间的全部更新日志 ；点「下载并安装」会在应用内下载匹配你设备架构的安装包（默认走加速镜像），校验通过后直接调起系统安装器——首次需要你允许 App「安装未知应用」，授权后回到 App 再点一次「安装」即可，安装包已经下载好，不会重下。 下载过程中关掉弹窗不会中断，再点一次「版本」行就能回到进度界面。下载失败时弹窗会说明原因，可以点「重试」，也可以改用「浏览器下载」自己去 Release 页面拿包。 已经是最新版会提示「已经是最新版本」；网络失败会提示「检查失败」并给出错误信息。 若提示 安装包签名与当前应用不一致 ，说明这个安装包不是当前 App 的签名（例如从其它渠道安装的版本），只能用「浏览器下载」手动处理，应用内更新不会覆盖安装。 自动检查更新 ​ 默认开启。打开 App 进主页时在后台异步检测， 每天最多一次 （当天检测过即不再重复）。发现新版本会自动弹出更新窗，网络失败时静默处理，不打扰你。 关闭之后不再自动检测，但手动点版本行仍然可以检查。 更新通道 ​ 默认「稳定版」： 稳定版 ：只检测正式版，过滤掉 RC 预览版。 最新版 ：包含 RC 预览版。 如需体验新功能可切换到最新版，偏好稳定则留在稳定版。 无论选哪个通道，下载的都是弹窗里那个版本自己的安装包：选最新版通道检测到 RC 预览版时，拿到的就是该 RC 的包，不会落到旧的稳定版上；点「浏览器下载」时也按该版本的 tag 直达对应 Release 页面。 下载镜像源 ​ 更新包默认从 cdn.gh-proxy.com 这个 GitHub 加速节点下载（ github.com 直连在国内经常很慢甚至超时）。在同一页点「下载镜像源」可以改： gh-proxy CDN ：默认节点。 gh-proxy 优选节点 ：同项目的另一个节点，网络环境不同时可能更快。 直连 GitHub ：不使用镜像，直接从 github.com 下载。 也可以自己填任意加速前缀（形如 https://你的镜像/ ），支持 {url} 占位符写法。 镜像不可用时 App 会自动改用直连重试一次，所以填错也不会把更新卡死，只是多花一点时间。填完记得点「保存」。 其它入口 ​ GitHub 仓库 ：用系统浏览器打开源码仓库。 开源许可证 ：本项目使用 GPL-3.0，点击打开完整的 LICENSE 文件。 用户协议 ：用系统浏览器打开 用户协议 ，了解使用规则、AI 与操作风险、第三方费用及开源权利。 隐私政策 ：用系统浏览器打开 隐私政策 ，了解数据保存、联网传输、日志与备份的处理方式。 首次启动确认 ​ 首次启动 App 时，协议确认弹窗覆盖在主界面上，其中包含「用户协议」和「隐私政策」两个蓝色链接。点击任一链接，会使用系统浏览器打开对应全文；阅读后返回 App 再决定是否同意。确认状态读取期间主界面保持显示；首次引导和自动检查更新在同意后启动。 不同意 ：退出应用。 同意 ：继续使用，并记住确认状态，之后启动不再重复提示。 如需再次阅读，可随时进入「设置 → 关于」，分别点击「用户协议」或「隐私政策」。"}, {"url": "/guide/modes", "title": "四种模式：Build / Plan / Auto / Expert - 手机端 AI 编程工具与终端", "text": "四种模式：Build / Plan / Auto / Expert ​ 输入框左侧的模式按钮点击循环切换：BUILD → PLAN → AUTO → BUILD。四种模式的区别是 AI 的 权限范围 。 BUILD（构建模式） ​ 默认模式，功能完整。AI 可以写文件、改代码、执行构建命令，但每次需要授权的操作都会弹窗询问。 日常开发建议使用此模式。被内置安全防护拦下的高危命令（如 rm 根目录），AI 可带 elevate: true 重试，转由你一次性授权（见 工具授权 ）。 PLAN（计划模式） ​ 进入这个模式后，工具权限策略会拦截编辑文件、执行命令等实施操作。AI 可以使用允许的只读工具及相应动作，读取代码、检索资料、回答问题并构思方案。 适合这些场景： 你还不确定怎么改，想先让 AI 探索代码库、给出方案。 改动涉及重要架构取舍、影响面不明或风险较高，想先看计划再决定。 你只想问问题、了解现有实现，不希望它动手。 AI 会按风险与不确定性判断是否需要先规划；目标明确、风险可控或方案已获批准时，可以直接推进。纯问答与方案讨论可保持 PLAN，需要开始实施时再申请退出并等待审批。 AUTO（自动模式） ​ 普通工具调用（写文件、执行命令、终端操作）自动批准，AI 可在当前任务范围内连续执行。难以撤销、影响共享状态或超出当前任务范围的操作，仍需取得针对该操作的明确授权，例如强推、修改远端、发消息、提/合 PR。 这个模式权限极大 灾难性删除（如 rm 根目录或系统目录）以及无法静态判定的疑似破坏性命令仍会被拦截；确有必要时，AI 可申请一次性授权后重试。 Shizuku 宿主 Android 操作仍会逐次确认，其余普通工具调用自动批准。可在「设置 → 工具授权」中开启「禁用安全拦截」取消这些兜底确认。适合你已清楚了解风险、希望 AI 全自动执行批量任务的场景。不熟悉的项目或不确定 AI 会执行什么操作时，不建议使用。 AI 也可主动请求切换 ​ 除了你手动点按钮，AI 也可以主动请求进入或退出 PLAN 模式。准备实施时，AI 会先在回复中展示计划，再在同一轮回复中发起退出申请；你在计划审查面板批准后，才会恢复进入 PLAN 前的模式并开始实施。计划正文用于审查修改范围和验证安排，申请理由只是简要概括。 有一个方向上的限制： AUTO 模式只能由你手动进入 ，AI 无法通过工具切进 AUTO。但反过来，处于 AUTO 模式时 AI 可以主动切到 PLAN——这是 AI 退出 AUTO 的唯一路径。 退出 PLAN 会回到进入前的模式 ​ PLAN 是临时状态：进入 PLAN 时会记下当时的模式，退出时自动恢复。从 AUTO 进入 PLAN，计划做完退出后回到 AUTO；从 BUILD 进入 PLAN，退出后回到 BUILD。不会再一律落回 BUILD。 注意：退出 PLAN 仍需你在计划审查面板上批准（点「批准并实施」），批准后模式才真正恢复。进入或退出成功后，工具结果会直接显示当前模式及对应说明。 运行中也能切换 ​ AI 收到的运行模式提醒由应用自动附加，用于说明当前权限，不属于你的消息内容，也不代表你新增了任务或授权。提醒带有明确的开始和结束标记，便于与原始请求区分。 模式按钮在 AI 正在执行任务时同样可用。你在 AI 执行任务的过程中切换模式，它会 当轮立即生效 ：AI 会收到一条模式切换通知，手头任务从那一刻起按新模式处理（例如你中途切到 AUTO，后续操作就不再逐次弹窗；切到 PLAN，后续写操作会被拦截），无需等待本轮结束。"}, {"url": "/guide/shizuku", "title": "Shizuku 工具 - 手机端 AI 编程工具与终端", "text": "Shizuku 工具 ​ Shizuku 让普通应用可以执行系统命令。AiVerse 接入后，AI 获得一个名为 Shizuku 的工具，可通过它在手机系统上运行 pm 、 am 、 cmd 等命令，弥补本地容器（PRoot）拿不到系统权限的短板。 前置：安装并启动 Shizuku ​ 从 Shizuku 官网 或应用商店安装 Shizuku。 打开 Shizuku，按应用内指引启动服务： Android 11 及以上：开启「无线调试」后可直接在手机上启动； Android 10 及以下：需连接电脑用 adb 启动。 在 AiVerse 中授权 ​ 打开「设置 → 软件权限 → Shizuku」，页面显示当前状态： 未安装 ：点击前往下载安装。 服务未运行 ：点击打开 Shizuku 并启动服务。 未授权 ：点击申请授权，Shizuku 弹出授权框，选择「允许」。 已就绪 ：授权完成，AI 即可使用 Shizuku 工具。 从 Shizuku 应用返回 AiVerse 时，状态会自动刷新。 使用与安全 ​ Shizuku 直接操作宿主 Android 系统，权限高危，因此在工具授权上按 高危工具 处理： 每次调用都会弹出授权确认 ：包括 ls 这类只读命令，不走内置安全白名单，也不会因已有规则自动放行。 不支持「始终允许」 ：弹窗中的「始终允许」按钮不可用（会显示原因），只能单次放行，不生成记忆规则。 AUTO（自动）模式下同样弹窗 ：AUTO 的「全放行」对它不生效；仅当开启「设置 → 工具授权 → 禁用安全拦截」后，AUTO 下才恢复自动放行（BUILD 模式仍逐次确认、不可记忆）。 PLAN（计划）模式 下，该工具与其他写操作一样被拦截。 项目权限规则中的 禁止规则 对它依然生效（命中 deny 会被直接拒绝）。 Shizuku 控制手机（ShizukuControl） ​ 除通用命令工具外，AiVerse 还提供 ShizukuControl 工具，用于直接控制手机屏幕与应用，包含三种操作： 打开应用 （ open_app ）：指定 package_name （如 com.tencent.mm ）打开对应应用。 截屏 （ screenshot ）：截取当前屏幕，图片直接返回给 AI。 模拟点击 （ tap ）：指定 x 、 y 坐标执行点击。 ShizukuControl 比通用 Shizuku 更危险（可直接操纵手机），因此： 强制逐次确认 ：即使开启「设置 → 工具授权 → 禁用安全拦截」或「一键允许所有工具」，每次调用仍会弹出确认，且 无法保存为始终允许 。 确认走悬浮窗 ：确认框以系统悬浮窗形式弹出，无论应用在前台还是你停留在其他页面，都能看到「拒绝 / 允许」。 需要悬浮窗权限 ：悬浮确认依赖「显示在其他应用上层」权限。未授予时该工具会被直接拒绝并提示开启（系统设置 → 应用 → AiVerse → 显示在其他应用上层）。 PLAN（计划）模式 下被拦截；项目权限规则中的 禁止规则 依然生效。 需先完成上文「前置：安装并启动 Shizuku」并在 AiVerse 中授权， ShizukuControl 才能执行。 常见问题 ​ 命令报「Shizuku 未就绪」 按设置页提示依次确认：已安装 → 服务已启动 → 已授权。设备重启后 Shizuku 服务通常需要重新启动（Android 11+ 可在 Shizuku 内重新开启无线调试启动）。 Shizuku 工具执行失败但没有明显报错 部分命令需要特定系统权限， Shizuku 并不具备所有权限。可在终端中用 Bash 对比，确认是命令本身还是权限问题。"}, {"url": "/guide/appearance", "title": "外观与语言 - 手机端 AI 编程工具与终端", "text": "外观与语言 ​ 「设置」首页点「外观主题」「背景图」或「语言」会弹出底部选择窗口，选择后立即生效并保存。 外观主题 ​ 面板里分三块：明暗模式、配色方案、莫奈取色。选择后不会自动关窗，便于连续对比多套配色。 明暗模式 ​ 三选一：跟随系统、固定深色、固定浅色。 配色方案 ​ 四套预设，深浅两种模式各自配好： 默认蓝 ：App 默认的蓝色调。 咖啡 ：暖赤陶色 + 米白纸感底。 石墨 ：中性冷灰，颜色干扰最小。 森林 ：低饱和绿。 色块外圈是该主题的页面底色、内圈是主色，预览会跟随当前明暗模式变化。 Git 泳道色、日志级别色、diff 增删的红绿属于功能标识，不随主题变化，避免同一含义在不同主题下颜色不一致。代码编辑器的语法高亮与终端配色也是各自独立的设置。 莫奈取色 ​ 开启后从系统壁纸提取配色，上方所选的配色方案不再生效（色块变灰）。默认关闭。 需要 Android 12 及以上系统；低版本设备上开关不可用，描述会直接提示。壁纸调色板由系统生成，不同手机厂商的取色结果差异较大，效果不满意关闭即可。 自定义背景图 ​ 可以设置一张全局背景图： 选择图片 ：从系统相册选一张作为 App 全局背景，叠在所有页面内容上（水印效果，不拦截触摸）。终端页保持纯黑底，不显示背景。 透明度 ：滑块显示 0% 到 100%，实际生效范围映射到 0% 到 20%（即滑到 100% 相当于 20% 不透明度），以保证文字始终可读。默认 15%，拖动实时生效。 移除背景 ：恢复默认纯色背景。 背景图文件保存在应用私有目录， 不随备份导出 ，更换设备需要重新设置。 语言 ​ 可以跟随系统语言，也可以直接指定一种已支持的语言。 终端外观 ​ 终端的配色主题、字体、字号、光标样式是单独一套设置，见 终端 。"}, {"url": "/guide/providers", "title": "AI 供应商与模型 - 手机端 AI 编程工具与终端", "text": "AI 供应商与模型 ​ AiVerse 自身不提供模型，需先接入一个模型服务。入口在「设置 → AI 供应商」。 添加一个供应商 ​ 点右上角 + 从底部弹出添加面板： 第一项是 自定义供应商 （从空白手动配置）。 下面是内置官方预设，选中后自动填入名称、上游格式与 Base URL，进编辑页补上 API Key 即可使用，各项也可手动修改。 预设列表随版本更新，以实际显示为准。 自定义时填以下四项： 名称 ：易识别的别名，例如「我的中转」。列表按名称自动匹配品牌图标。 上游格式 ： OpenAI / Anthropic / Gemini 三选一，决定请求协议。第三方中转站一般选 OpenAI 。 API Key ：密钥，形如 sk-xxx 。粘贴时多带的空格或换行会在保存时自动清理。 Base URL ：API 根地址。留空会按上游格式自动填官方地址；用第三方中转时填中转服务的地址，带不带 /v1 都可以。 配好后切到「模型」标签拉取模型，即可回主页开始对话。 管理供应商列表 ​ 列表每行显示名称、上游格式、模型数量和启用状态。 点一行进入编辑页。修改后点左上角返回箭头或按系统返回键，配置会自动保存；未修改时直接返回，不重复保存。 左滑一行 露出红色删除按钮。 长按名称或上游格式区域拖动 调整顺序，重启后保持。 批量操作 ​ 列表右上角的「多选」按钮（方框带勾的图标）可以一次处理多个供应商： 点右上角「多选」进入多选模式，每行左侧出现勾选框，整行点击即勾选。 顶部会出现操作条：左侧「已选 N 项」，右侧「启用 / 停用 / 删除」，最右「×」退出多选（按系统返回键也是退出）。 「全选」勾中列表内全部供应商；再点一次变「取消全选」。 点「删除」会先弹确认框，确认后选中的供应商一并删除，然后自动退出多选模式。 多选模式下不能拖动排序，行点击也不会进入编辑页——只看勾选状态。想编辑请先退出多选。 多 Key 模式 ​ 版本说明 多 Key 模式从 1.11.0 起提供。 如果持有同一服务的多个密钥，可在编辑页的「选项」里打开 多 Key 模式 ：密钥不可用时自动切到下一个并 重发本次请求 。打开后单 Key 输入框隐藏，密钥统一在「多 Key 管理」页维护（原本填的那个会成为列表第一项）。 管理页分三块： Key 列表 ：每条 Key 是一张可折叠卡片，折叠时显示序号与掩码预览，点击展开后可编辑该条 Key 并设置 调度权重 （默认 1 ，最大 1,000,000 ； ≤ 0 表示保留但不参与调度）。左滑删除，长按卡片头部拖动排序（重启后保持），眼睛图标切换明文/掩码。权重只影响 轮询 策略——数值越大，新会话分到该 Key 的比例越高（按权重平滑分配，如 1:3 约为 1 比 3）。 取用策略 ： 顺序 ：始终用靠前的 Key，失败达到阈值才切下一个。 轮询 ：新会话按权重比例轮流起步，用于均衡多个 Key 的额度消耗。 为保住服务端 Prompt 缓存， 单会话内默认保持同一个 Key ，只在当前 Key 不可用时才切。 失败切换 ： 自动切换状态码 ：命中这些 HTTP 状态码时立即切换并重发，默认 401,402,403,429 ；留空使用默认值，也可按需增删（逗号分隔）。 冷却时长 ：被切走的 Key 隔多久重新参
