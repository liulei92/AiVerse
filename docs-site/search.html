与候选，默认 5 分钟，也可设为不冷却。 一次请求依次尝试列表里的 Key，全部失败才报错（提示「N 个 Key 均失败」）。流式回复若已开始输出则不再重发（避免重复输出），只切换后续请求用的 Key；触发切换时聊天区出现「已切换到第 N/M 个 Key」提示。 鉴权失败、权限不足、限流、余额或额度用尽视为「密钥不可用」，会触发切换；服务器 5xx、超时、网络不可达换 Key 也无法解决，仍走原有网络重试。若所有 Key 都在冷却中，会直接报错提示稍后重试。 App 重启后回到第一个 Key，冷却记录清空。 选项 ​ 编辑页的「选项」分组里还有： 完整 URL ：开启后 Base URL 即完整请求地址，不再自动拼接默认路径。 新版协议端点 ：上游格式为 OpenAI 时可开启「Response API (新版)」，Gemini 时可开启「Interactions API (新版)」。默认关闭，确认服务支持对应新协议时再开。 自定义请求头 ​ 给该供应商的所有请求追加 Header，完全覆盖同名默认头（如填 User-Agent 就替换掉默认 UA）。仅少数中转网关需要。值里可用的占位符： 占位符 说明 {{SESSION_ID}} 当前会话 id {{API_KEY}} 本次实际取用的 Key 自定义面板脚本 ​ 让供应商在输入框上方显示余额或用量卡片。脚本放在 ~/.aiverse/scripts/ 下，支持 Python、Bash、Node，可在编辑页点「运行测试」看输出。 脚本参数以 AIVERSE_KEY_<KEY> 环境变量注入（KEY 转大写，仅保留字母、数字与下划线）。值里可用的占位符： 占位符 说明 {{PROVIDER_API_KEY}} 当前生效的 API Key {{PROVIDER_ID}} 供应商记录 ID {{PROVIDER_NAME}} 供应商名称 {{PROVIDER_TYPE}} 上游格式（OPENAI / ANTHROPIC / GEMINI） {{BASE_URL}} 供应商 Base URL {{DEFAULT_MODEL}} 默认模型 {{SELECTED_MODEL}} 当前选中的模型 {{MODEL}} 实际生效的模型（优先选中，其次默认） 脚本能读到的环境变量（Token、会话状态、工作区、供应商等）与卡片 JSON 结构，见 自定义面板 。 模型管理 ​ 切到编辑页的「模型」标签页。 拉取模型 ：点「拉取模型」从服务端同步可用列表，结果按品牌分组、可搜索。每个模型旁有 Image （支持图片输入）、 Tools （支持工具调用）标签， ↑ 后是上下文长度、 ↓ 后是最大输出。弹窗右上角「全部添加」可一键把新模型批量加入当前供应商。弹窗展开到顶部后，快速滑动模型列表到边界时保持当前位置；需要收起时可用手指向下拖动。 拉取成功后会自动对齐本地列表：远端已不存在的模型会从列表移除（拉取失败或返回空列表时不动本地列表），手动添加但不在远端结果里的模型也会被移除。不希望如此可在 偏好设置 里关掉「拉取模型后自动移除无效模型」。 批量操作与多选 ：模型列表非空时，编辑页顶栏右侧出现多选按钮，点击进入批量选择模式： 全选 / 取消全选 ：一键勾选全部模型或清空。 批量测试 ：对选中模型依次发起连通性测试。 批量删除 ：二次确认后批量删除。 点左上角返回箭头或按返回键退出。 手动添加 ：中转站模型名有时拉不全，可点 + 手动输入。编辑弹窗里可自定义该模型： 总上下文窗口 ：输入与输出合计的容量，影响何时触发上下文自动压缩。 输入窗口 ：模型可接收的最大输入长度，与总上下文窗口独立设置。 输出窗口 ：单次回复的最大长度。 价格 ：输入 / 输出 / 缓存读取 / 缓存写入四档，单位是美元每百万 token，用于费用统计。 能力开关 ：图"}, {"url": "/guide/free-providers", "title": "免费供应商 - 手机端 AI 编程工具与终端", "text": "免费供应商 ​ 希望低成本体验 AI 编程？下列平台提供免费额度或活动 token，注册后即可在 AiVerse 中接入使用。免费额度通常有时效，用完或过期后需要充值，具体以各平台规则为准。 MiMo 开放平台（小米） ​ 平台 ：小米 MiMo 开放平台 注册地址 ： platform.xiaomimimo.com （邀请码 66QSUD ） 说明 ：小米自研 MiMo 系列模型（MiMo V2.5 等），注册后可申请 API Key 接入。 新人福利 通过上方邀请链接注册送 10 元体验金，享首单 9 折；体验金 40 天有效。 日日新 ​ 平台 ：日日新大模型开放平台（商汤 SenseNova） 注册地址 ： platform.sensenova.cn 说明 ：商汤科技旗下的大模型平台，注册登录后可申请 API Key。 公测免费 目前处于公测阶段，token plan 免费。 基元律动（OpenSquilla） ​ 平台 ：基元律动 TokenRhythm 官网地址 ： tokenrhythm.studio 说明 ：多模型统一 API 接入平台，配套 OpenSquilla 智能路由，注册后可申请 API Key 接入。 新人福利 需先完成实名认证，认证通过后可获得 18 元体验金。 硅基流动（SiliconFlow） ​ 平台 ：硅基流动（SiliconFlow）开放平台 活动地址 ： https://cloud.siliconflow.cn/i/HNDIQWXd 说明 ：通过邀请链接注册并完成实名认证可获取免费额度，活动截止到年底，具体以平台公告为准。 实名认证 新用户需先注册并完成实名认证，方可获得赠送额度。 Agnes AI ​ 平台 ：Agnes AI（新加坡 Sapiens AI 团队） 注册地址 ： platform.agnes-ai.com 说明 ：全模态 AI 平台，文本、图像、视频三大模型 API 无限期免费开放，OpenAI 兼容接口，注册后即可申请 API Key 接入。 全模态免费 文本、图像、视频模型 API 均免费开放，免费访问有基础速率限制与公平使用配额，具体以平台规则为准。 在 AiVerse 中接入 ​ 拿到平台的 API Key 和 Base URL 后，按 AI 供应商与模型 的步骤配置即可： 打开「设置 → AI 供应商」，点右上角 + 新建。 填入上游格式、API Key、Base URL（地址不要带 /v1 ）。 切到「模型」标签页拉取模型，回到主页即可开始对话。 如果平台对上游格式、Base URL 有特殊要求（例如提供 OpenAI 兼容或 Anthropic 兼容端点），以平台文档为准。"}, {"url": "/guide/skills", "title": "技能 - 手机端 AI 编程工具与终端", "text": "技能 ​ 技能是为 AI 提供的「专项能力扩展包」——把某类任务的标准流程、最佳实践与专属知识沉淀为规范指南，AI 遇到相关任务时会自动按需加载执行，无需你在每次对话中反复交代背景规则。 入口在「设置 → 技能」。已启用的技能会出现在对话输入框的 / 菜单里，可以直接用 /技能名 触发，也可以带参数（如 /pdf-report a4 ），详见 对话与消息 的〈斜杠命令〉。 技能从哪里来 ​ 一个技能就是一个目录，其中有 SKILL.md （或兼容的 CLAUDE.md ）即会被自动识别。分两级： 全局技能 ：放在 ~/.aiverse/skills/ ，跨项目共享，App 升级不丢失。跟随执行环境：本地模式下是容器内 /root/.aiverse/skills/ （映射至手机 App 私有目录），远程模式下指 服务器 上的 ~/.aiverse/skills/ ，读写经由 SSH 完成。 项目级技能 ：放在 <工作区>/.aiverse/skills/ ，只在当前工作区生效，可以随项目提交到 git。远程模式下这里指的是 服务器上 的工作区，读写经由 SSH 完成。 同名技能项目级优先。 你可以直接在 App 里新建技能（见下文），也可以在容器里手工创建技能目录，或交由 AI 从 GitHub 安装。本地模式下 App 会监听技能目录，手工添加、删除、改名后列表几秒内自动刷新，无需重进页面。远程模式下不会监听服务器上的文件变化，手工修改后需退出并重新进入设置页刷新列表。 AI 对话中的可用技能清单在会话开始时生成。安装或启用新技能后，新开会话即可让 AI 使用更新后的清单。 列表页 ​ 按「当前项目 / 全局」两个可折叠分组显示，点分组标题展开或收起。 每行是一个技能：图标、名称、描述摘要，名称右侧的彩色勋章表示启用或禁用状态。点行进详情；左滑露出删除按钮，删除会弹确认框——它会直接移除技能目录， 不可恢复 。 右上角「＋」添加技能（见下文〈添加技能〉）。 批量操作 ​ 列表右上角的「多选」按钮（方框带勾的图标）可以一次处理多个技能： 点「多选」进入多选模式，每行左侧出现勾选框，整行点击即勾选；两个分组共用一份选中集合。 顶部操作条提供「启用 / 停用 / 删除」与「全选 / 取消全选」，最右「×」或系统返回键退出多选。 「全选」包含折叠起来的那个分组，不会因为分组收起而漏选。 删除会弹确认框；确认后逐条删除并显示「正在删除…」，删完列表自动刷新并退出多选。远程模式下每条技能都要经 SSH 递归删除，条目多时会慢一些，请等提示消失再离开页面。 多选模式下不能点击进入详情页，也不能左滑删除单条。 添加技能 ​ 点右上角「＋」弹出底部选择单，先选 作用域 （全局 / 当前项目，默认全局），再选添加方式： 手动新建 ：进入编辑页，填写名称、描述与正文，从头创建一个技能。 从文件导入 ：选择一个 .md 文件（ .markdown / .txt 也可）。App 读取文件内容，按其 frontmatter 的 name / description 建技能，缺 name 时用文件名兜底，写入 <作用域>/skills/<名称>/SKILL.md 。 从压缩包导入 ：选择一个 .zip 。App 解压后识别包内所有含 SKILL.md （或 CLAUDE.md ）的目录，逐个导入——一个包可以包含多个技能，常见于 GitHub 仓库的打包下载。 导入与手动新建等价：文件一律归一化为 SKILL.md 落盘，之后同样可以用编辑器或容器命令修改。 几种会被跳过的情况 （会弹窗逐个列出原因，不影响其余技能）： 技能名称不合法（含 / : 等不能做目录名的字符、为空或过长）； 目标作用域下已有同名技能（不会覆盖）； 技能正文为空； 压缩包里没有任何含 SKILL.md 的目录（整体失败）。 详情页 ​ 三张卡片：「是否启用」（名称、来源和启停开关）、「摘要」（描述）、「正文」（ SKILL.md 的完整内容，等宽字体，可以选中复制）。 右上角的铅笔按钮进入编辑页。 新建与编辑 ​ 编辑页有两组内容： 基本信息 ：名称、描述、作用域。名称就是 AI 加载技能时使用的标识，建议使用英文小写加连字符（如 pdf-report ）；描述写明「何时该使用它」，AI 依据这句话判断是否需要加载；作用域选「当前项目」或「全局」，决定技能目录落在哪一级。 指令正文 ：技能的完整指令，支持 Markdown。写清这类任务的标准流程、约束与注意事项。 软键盘弹出时，编辑区域会避让键盘；正文较长时可以上下滚动，继续编辑末尾内容。 名称和正文都填写后才能点击右上角「保存」。保存后会写成 <技能目录>/SKILL.md ，与手写的技能完全等价，之后同样可以用文本编辑器或容器命令修改。 几个需要留意的地方： 作用域只能在新建时选 。已有技能的作用域是灰的——更换作用域等于搬迁目录，需要自行在容器里移动。 改名只改 SKILL.md 里的 name ，不动目录名 。技能正文里常按 ~/.aiverse/skills/<目录>/run.py 引用同目录脚本，目录跟着改名会把这些引用打断。 编辑的是从 GitHub 装来的技能时，如果它用的是 CLAUDE.md 而不是 SKILL.md ，保存会写回原来那个文件，不会多出一份。 同一作用域下已有同名技能、名称含 / : 等不能做目录名的字符、或正文为空时，保存会失败并在页面顶部给出红色提示。 启用与禁用 ​ 详情页的开关控制该技能是否参与 AI 会话。禁用后它不再出现在系统提示的可用技能清单里，AI 也无法加载，可减少上下文占用——技能数量较多时这个开关很有用。 禁用名单写在 skills.json 里：全局名单位于当前执行环境的 ~/.aiverse/skills.json ，本地模式保存在手机 App 私有目录，远程模式保存在服务器上；两者独立，不会自动迁移或同步。项目级名单在本地模式位于 <工作区>/.aiverse/skills.json ，远程模式仍保存在手机 App 私有目录，按服务器和工作区隔离。格式是： json { \"disabled\" : [ \"技能名\" ] } 两级取并集，任一作用域禁用即生效。也可以直接手工编辑名单，下次读取时生效；本地模式下列表几秒内自动刷新，远程模式下手工修改服务器上的名单后需退出并重新进入设置页刷新列表。"}, {"url": "/guide/logs", "title": "日志与故障排查 - 手机端 AI 编程工具与终端", "text": "日志与故障排查 ​ App 出问题时，日志是最直接的线索。「设置 → 日志」可以直接在应用内看。 应用内看日志 ​ 进去默认定位到今天的日志，页面上能做这些事： 日志等级 ：顶部设置行显示当前等级，点击从底部面板选择（Verbose / Debug / Info / Warn / Error / None）。遇到 bug 时建议调成 Debug ，日常保持 Info 。正式版默认是 Info ，过滤掉调试噪音。 切换文件 ：点「日志文件」行从底部弹出日期列表，默认选中今天。 搜索与复制 ：关键字实时过滤，右上角一键复制当前筛选结果。 彩色分级 ：Verbose 灰、Debug 蓝、Info 绿、Warn 橙、Error 红。 单行复制 ：点任意一行复制这条完整日志（含时间、等级、来源）；长按弹菜单可以选复制范围——本条、本条及堆栈、或只要消息内容。 实时滚动 ：默认开启，每 3 秒自动刷新并跟随最新；关掉后停止刷新，保持你手动浏览的位置。 为了避免大日志卡顿，应用内只显示当前文件在筛选条件下的最后一部分，完整文件需到文件系统查看。 日志文件在哪 ​ /storage/emulated/0/Android/data/com.aiverse/files/logs/ 无需 root 权限，用手机自带的文件管理器即可打开。 工作区项目文件与 AI 配置存放在应用私有目录，普通文件管理器看不到，访问方式见 文件浏览与代码编辑 。 按 MCP 名称过滤 ​ 排查 MCP 连不上的问题时，进「设置 → MCP 服务器」，编辑某个服务器后点右上角的日志按钮，会跳到日志页并自动按这个服务器名过滤（页面顶部有过滤徽章，可一键清除）。列表页右上角的日志按钮则是看全部日志。 崩溃如何处理 ​ App 遇到未捕获的异常 不会直接闪退 ，而是全屏显示一个崩溃错误页： 页面展示崩溃时的版本、设备、时间和完整堆栈。 点「复制错误信息」可以复制完整的崩溃报告（含堆栈和日志文件路径），直接粘贴发给开发者即可，无需自行查阅日志。 可以选「重启应用」回到主界面，或者「退出应用」完全退出。 崩溃日志同样会落盘到上面那个 logs/ 目录。 除上述未捕获异常外，Native 崩溃、ANR（无响应）、被系统因内存不足杀死、被信号杀死这类不会走到错误页的退出，同样会在下次打开 App 时自动记录到 logs/ 目录，便于排查「闪退了但没看到错误页」的情况。 长任务切后台被中断如何处理 ​ 如果 AI 执行长任务（如编译、深度代码审查）或终端运行耗时命令时切到后台经常被杀掉，请前往「设置 → 软件权限」开启 后台运行保活 、 忽略电池优化 与 自启动管理 ，详见 软件权限 。"}, {"url": "/guide/chat", "title": "聊天界面导览 - 手机端 AI 编程工具与终端", "text": "聊天界面导览 ​ 本页说明主界面上各按钮与区域的作用。 新建空白对话时，欢迎语显示在页面中央偏上的位置。点击底部输入框唤起键盘后，欢迎语会随输入框上移，尽量保持在顶部标题栏与输入框之间；收起键盘后回到原位。 顶部标题栏 ​ 菜单按钮 （左上）：打开侧边栏，管理会话列表和浏览文件。 会话标题与模型名 ：上面一行是当前会话名，下面一行是当前使用的模型。 新建会话 ：新建一个对话。当前工作区如果还留着一个没发过消息的空会话，会直接切过去复用，不会再新建一个。 Git 入口 ：跳转到 Git 版本管理页。 终端入口 ：跳转到终端页。 远程 SSH 模式下，标题栏下方会多一行：左侧是 SSH 连接状态（圆点加文字），右侧是当前会话的 token 累计（上箭头输入、下箭头输出）。本地模式不显示这一行。 侧边栏 ​ 点击左上角菜单按钮，或从屏幕左缘向右滑动。顶部有「会话」和「文件」两个标签页。 会话页 ​ 会话按最后回复时间从新到旧排列，并按时间分组（今天 / 昨天 / 7 天内 / 30 天内 / 更早按月份）。置顶的会话单独放在最前面的「置顶」分组，卡片是浅蓝色背景。 短按切换会话， 长按弹出操作菜单 ： 置顶 / 取消置顶 ：置顶后固定排在最前。 重命名 ：改会话标题，不影响排序。 导出 ：导出这个会话。 批量选择 ：进入多选模式，支持勾选多个会话、一键「全选」以及「批量删除」（带二次确认）。按左上角 × 或返回键退出多选模式。 删除 ：会弹确认框，确认后删除该会话及其所有消息。 派生过子代理的会话，行尾会显示子代理数量和展开箭头，点击展开后可在下方查看其子代理（ 1.11.0 起 ），详见 子代理 。 侧边栏 Tab 栏下方是 搜索聊天记录 （ 1.12.0 起 ）：输入关键词即可跨当前工作区的所有会话搜索消息内容，列表区就地显示命中结果（会话标题加命中片段，关键词高亮）。点击一条结果会切换到对应会话并定位到该消息；点击搜索框右侧的 × 或删空内容即回到会话列表。搜索只覆盖当前工作区，且只匹配你和 AI 的正文，不含工具执行输出。 文件页 ​ 浏览当前工作区的文件，点击文件打开代码编辑页（ 1.11.0 起 ），详见 文件浏览与代码编辑 。 侧边栏底部有「浏览器」（ 1.12.0 起 ）和「设置」两个入口。 输入框下方工具栏 ​ 从左到右： 模式按钮 ：在 BUILD、PLAN、AUTO 之间循环切换，见 四种模式 。 模型按钮 ：显示当前模型，点击弹出选择弹窗。顶部有搜索框可以模糊筛选，模型按供应商分组，点击分组标题可以折叠或展开（折叠状态会被记住，重开弹窗或重启后保持；搜索时自动展开命中的分组），每行标注能力标签（ Image 、 Tools 、输入输出长度），点击即切换。 工作区按钮 ：显示当前工作区名，点击弹出工作区管理面板（见下）。 文件按钮 ：上传文件作为附件，AI 可以读它的内容。 图片按钮 ：上传图片作为附件。点击直接打开系统相册，可以多选。需要当前模型支持图片输入。发给模型的是缩小后的副本（长边最多 1568 像素），工作区里保存的仍是原图，请求体积和流量因此小很多。相机拍的大图也可以直接上传（原图上限 40 MB）。 发送按钮 ：AI 空闲时是普通发送；AI 正在工作时，输入框为空则显示停止按钮，有内容则显示橙色发送按钮（消息会排队）。 输入的内容长到超出输入框高度后，输入框右上角会出现 展开按钮 ：点击即用整屏编辑这条草稿，右上角「收起」或系统返回键退出全屏。全屏里修改的内容实时同步回输入框，两边是同一份草稿，收起后按发送即可。 上传的附件会以预览卡显示在输入框上方，发送前可以移除。上传较大的文件需要一定时间，期间输入框上方会显示上传中的提示，传完自动变成预览卡。点击图片缩略图可以 全屏看大图 。 未发送的文字草稿按会话持久化保存到本地。 滚动消息列表时，输入框区域会淡出到 40% 透明度以减少干扰，停止滚动后恢复。 AI 询问面板 ​ AI 需要你选择方案时，会在聊天输入框上方显示询问面板。选择预设选项，或选择「其他」填写自己的回答，再点「确认」提交；也可以点「补充」，回到聊天输入框补充说明。 填写「其他」时，面板会随键盘弹出缩小可见区域。问题较多时，可以在面板内部上下滚动，找到输入框和底部操作按钮。面板标题可点击收起或展开。 工作区管理 ​ 点击工作区按钮弹出的面板里可以： 切换工作区 ：点击即切换。如果当前有正在运行的 AI 会话或终端标签，会先弹确认框——切换会停止它们。 新建内部工作区 （本地模式）：输入名称，在应用私有空间中创建一个独立文件夹。远程 SSH 模式下入口显示为「新建工作区」，文件夹创建在服务器上。 添加外部工作区 （本地模式）：把设备上已有的目录作为工作区。首次点击会显示风险确认弹窗（AI 会直接读写你的真实文件），可以勾选「不再提示」。只支持从「内部存储」或「SD 卡」选择文件夹，云盘之类的其它文件提供方不支持。 删除工作区 ：内部工作区连同文件一起删除；通过「添加外部工作区」加进来的外部工作区只解除关联， 不会删除目录内容 。 工作区是 AI 操作的项目根目录，AI 的代码读写和命令执行都被限制在当前工作区内。 斜杠命令 ​ 在输入框输入 / 会弹出命令菜单， 内置命令排在前面（按字母序），技能排在后面（也按字母序） 。命令较多时，可以在菜单内上下滑动查看；继续输入命令名可以筛选列表，点击条目即可补全到输入框。 内置命令： /compress ：手动触发当前会话的上下文压缩。 /init ：让 AI 分析当前工作区代码库，生成或改进项目规则文件 AGENTS.md （项目根已有 CLAUDE.md 而无 AGENTS.md 时改进 CLAUDE.md ）。可带参数指定关注点，例如 /init 关注测试与发布流程 。 /usage ：查看今日与累计的调用次数、token 用量与预估费用（全局统计，跨会话）。 /goal ：设定/查看/暂停/恢复/清除当前会话的持续目标，AI 自主循环推进至达成或预算耗尽。详见 会话目标 。 技能： 每个已启用的技能都能用 /技能名 直接触发，AI 会把该技能的正文作为本轮指令执行；菜单里技能右侧带「技能」标记。 技能可以带参数，例如 /pdf-report a4 ：参数会替换技能正文里的 $ARGUMENTS 占位符；正文没有占位符时，参数会追加到末尾。 命令在 AI 忙碌时会进队列，空闲后自动执行。命令文本会作为用户消息显示在对话里，并进入上下文。 @ 引用文件 ​ 在输入框输入 @ 会弹出文件搜索菜单，输入关键词即可模糊匹配当前工作区的文件（按文件名与路径匹配，不区分大小写）。点击条目会把 @相对路径 插入输入框，作为给 AI 的引用——AI 收到后按需读取该文件。 文件列表由容器内的 ripgrep 生成，自动遵守 .gitignore ，跳过 .git 、 build 等目录。 每次打开 @ 菜单都会重新拉取一次列表（大工作区首次可能有短暂加载），关闭后即丢弃，保证拿到最新文件。 本地模式需先初始化容器；容器未就绪时菜单会提示无法搜索。 远程模式需要远端服务器已安装 rg 。 上下文用量与压缩 ​ 发送"}, {"url": "/guide/roles", "title": "角色系统 - 手机端 AI 编程工具与终端", "text": "角色系统 ​ 角色是一套可复用的「AI 人设」：每个角色包含名称、头像，以及影响 AI 行为与语气的设定（提示词片段）。会话开始时，系统会把所选角色的设定注入系统提示词，让 AI 按这个人设来回答。 应用内置了若干预设角色，开箱即用；你也可以创建自定义角色，随时为会话切换。 角色设定影响 AI 所选角色的设定会在会话开始时注入系统提示词，直接影响 AI 的语气与行为。 切换会话角色 ​ 聊天顶栏会显示当前会话使用的角色。点它弹出角色选择抽屉，列出所有可用角色（含头像与名称），选中即把该角色绑定到 当前会话 。 默认角色 ：选择「默认角色」即不绑定特定角色，AI 按默认方式回答。 绑定当前会话 ：切换角色只影响当前会话，不会改动其它会话。 角色头像会显示在顶栏、角色选择抽屉、聊天输入区等位置。 新建会话沿用上次角色 ​ 切换过角色后，新建的会话会沿用上一次选的角色，不必每次重切（ 1.0.3 起 ）。 已有的老会话各自保持原角色不变，不受影响。 管理角色 ​ 进入「设置 → 角色」，可以管理所有角色。内置预设角色与自定义角色一并管理。 新建 ：点右上角的「＋」，填写名称、从相册选择头像、设定提示词内容。 编辑 ：点某个角色进入详情，再点编辑，可修改名称、头像与设定内容。 名称长度 ：名称有长度限制，超长会提示。 启用 / 停用 ：可停用不需要的角色，停用后不再出现在可切换列表里；内置预设角色同样可以停用。 删除 ：可删除自定义角色。 角色与备份 ​ 角色会随「备份与还原」一起导出与导入。还原备份后，角色及其与会话的绑定关系一并恢复。"}, {"url": "/guide/backup", "title": "备份与还原 - 手机端 AI 编程工具与终端", "text": "备份与还原 ​ 「设置 → 备份与还原」可以把应用配置、聊天历史、凭据和工作区文件导出成一个加密压缩包，也能从备份还原回来。 导出 ​ 页面上方勾选要导出的范围：AI 供应商、Git 凭据、连接与同步、聊天历史、MCP 服务器、授权规则、应用设置、工作区文件。勾选状态会记住，下次进来沿用。 其中 工作区文件默认关闭 ，需要时手动打开。它会打包所有本地模式的内部工作区文件，包含 .git 目录，因此仓库历史和未推送的提交都能完整还原。通过「添加外部工作区」加进来的外部工作区属于你设备上的原始目录，不会被打包。排除规则是各工作区自己的 .gitignore 加上同步功能的默认忽略清单（ node_modules 、 build 、 dist 等），符号链接不备份。 代码优先用 Git 备份 Git 仓库本身就完整保存了代码和历史，这里的导出更适合作为额外的备用手段，而不是主要的代码备份方式。 点「导出备份」后会弹窗设置口令： 填写口令 ：使用 AES-GCM 加密。 留空 ：输出明文 tar.gz。 导出的包里含 API Key 等凭据，通过系统文件选择器保存到你指定的位置。 务必牢记加密口令 加密备份在遗失口令时无法解密恢复，没有任何后门或找回途径。 导入 ​ 从备份文件还原，采用 合并方式 ，不会清除现有数据。需要输入对应的口令，未加密的备份留空即可。 只有导出时勾选了「应用设置」的备份才会恢复主题、配色和偏好设置。单独导出的聊天记录，以及未勾选「应用设置」的备份，导入后会保留当前应用设置。 加密备份在预览前会完整解密并校验一次，确认恢复时复用校验结果，不再重复解密。较大的备份需要足够的应用内部存储空间保存临时压缩包；完成、取消或失败后会清理临时文件。 如果备份中含工作区文件，会先弹出「恢复工作区」选择弹窗，列出备份中的每个工作区（名称和文件数），你可以勾选要恢复哪些。 恢复工作区会直接覆盖 勾选的工作区会覆盖本地同名工作区里的文件，且无法撤销。本地没有同名工作区时会自动新建一个再写入，因此更换设备或重装后不会丢数据。远程模式的工作区（文件在服务器上）不参与还原。 导入完成后会显示还原数据的汇总清单：供应商、Git 凭据、远程连接、远程挂载、聊天会话、聊天消息、待办项、MCP 服务器、全局授权规则、工作区文件各恢复了多少。 聊天会话会按备份时的所属工作区归位：本地有同名工作区直接还原过去，没有同名工作区时会自动新建一个空工作区再挂入会话（与「恢复工作区」自动新建的逻辑一致），更换设备或重装后各工作区的会话不会集中到同一处。 网络备份 ​ 除了导出成本地文件，还可以把备份直接上传到云端，或从云端拉回还原。备份页底部有「本地备份 / 网络备份」两个标签：本地页管导出范围与导出/导入，网络页管备份目标。切到「网络备份」后用右上角「＋」添加 备份目标 ，支持两类： WebDAV ：填服务器地址（含路径，如 https://dav.jianguoyun.com/dav ）、远端目录、用户名和密码。 对象存储 (S3) ：填服务地址、区域、存储桶、Access Key / Secret Key，可加 Session Token 与对象前缀，路径风格寻址可切换。兼容 AWS S3、Cloudflare R2、阿里云 OSS、腾讯云 COS、MinIO 等 S3 兼容服务。 每个目标都能「测试连接」验证配置。配置好后： 上传到云端 ：导出当前勾选的备份并上传到所选目标；可设置口令加密，留空则上传明文。 从云端恢复 ：列出所选目标上的备份（按时间倒序），选一个下载并还原，流程与从本地文件导入一致（含口令校验与工作区勾选）。 每个目标卡片底部都有「上传」「恢复」按钮；点卡片进入编辑，左滑删除。 远端文件名形如 aiverse-backup-<时间戳>.tar.gz 。备份目标里的密码与密钥由系统密钥库（Android Keystore）加密保存，与备份本身的加密口令相互独立。 云端备份同样含凭据 未加密的备份包含 API Key 等明文凭据，放在公共存储时请务必设置口令加密。 补充说明 ​ 备份口令只作用于导出的备份文件本身。应用内部存储的 API Key、连接密码、SSH 私钥等敏感配置另由系统密钥库（Android Keystore）加密保存，与备份口令相互独立；更换设备时请通过备份导入迁移，直接拷贝应用数据目录会因密钥不匹配而无法解密。"}, {"url": "/guide/checkpoint", "title": "检查点与撤销 - 手机端 AI 编程工具与终端", "text": "检查点与撤销 ​ 在 AI 执行文件修改操作前，AiVerse 会自动保存改动前的文件快照并创建检查点。如果生成结果未达预期或引入了意外问题，可随时一键回退到指定节点。该机制完全自动运行，无需手动干预。 回滚方式 ​ 在聊天记录里找到你想退回的那条 你自己发的消息 ，其左侧有一个撤销图标，点开即该检查点的操作菜单。 菜单里有三个选择： 操作 代码 对话 恢复代码与对话 回到这条消息之前的状态 删掉这条之后的消息，原来的提问会填回输入框 仅恢复对话 保持现状不变 删掉这条之后的消息 仅恢复代码 回到这条消息之前的状态 保持完整不变 常用的是第一个：相当于「这一轮重来」，代码和对话一起回到起点，你可以修改提问后再发一次。 恢复对话会删除所选消息及后续消息，撤销现有压缩摘要，并恢复回退点之前保留的原始对话，避免摘要带入后续事实。「仅恢复代码」不改变对话。恢复后历史过长时，下一次发送前会重新压缩；已经发生的调用用量不会清零。旧版已经截断或缺失的内容无法凭回退补回。 如果只是想让 AI 忘掉走偏的几轮讨论、但保留它已经写好的代码，用「仅恢复对话」。反之，代码想丢弃、讨论过程想留着复盘，用「仅恢复代码」。 适用边界与限制 ​ 检查点只记录 AI 通过文件工具 做的修改。如果文件是被终端里的命令改掉或删掉的（ rm 、 mv 、 sed 这类，无论是你自己输入的还是 AI 执行的），检查点无法精确还原。 与其他会话同时改同一文件 ​ 回滚时会先判断每个文件「是不是被当前会话之外的改动碰过」： 文件在检查点之后被 其他会话或你自己 改过（当前会话没见过那些改动）→ 该文件 跳过 ，不改动，并在提示里列出文件名。这样不会把你或别的会话刚写的代码悄悄抹掉。 文件是 当前会话 自己改的 → 照常还原，这正是撤销的用途。 如果提示里列出了被跳过的文件，说明那些改动被有意保留了。想连它们一起回退，先手动确认内容或借助 Git。 已知局限：本次对话中 新建 的文件，回滚时一律删除，即使期间别的会话往里写过内容——删除前无法可靠判断该文件是否被改过。 这种情况下建议通过 Git 恢复：只要文件曾被 Git 跟踪过（提交过一次即可），去 Git 页的状态标签页长按该文件，选「恢复文件」或「回退改动」即可取回，与它是怎么被删的无关。反之，从没提交过的新文件不在这层保护里。 重要的项目建议同时用 Git 管理，检查点适合处理单轮改动的回退，Git 才是完整的版本安全网。"}, {"url": "/guide/tablet", "title": "平板与大屏 - 手机端 AI 编程工具与终端", "text": "平板与大屏 ​ 版本说明 本页描述的大屏布局从 1.11.0 起提供。 大屏下 AiVerse 会自动换成双栏布局：侧边栏常驻、聊天旁边可以并排开着代码或终端。手机上的界面和操作完全不变。 切换时机 ​ 判断依据是 当前窗口的宽度 ，不是屏幕大小： 窗口宽度 界面形态 窄（多数手机竖屏） 单栏，侧边栏靠汉堡键滑出，和原来一样 中等（平板竖握、手机横屏） 单栏，侧边栏稍宽一些 宽（平板横屏、折叠屏展开、桌面窗口） 侧边栏常驻，聊天页可开右栏 因为判断依据是窗口宽度，因此在平板上把 AiVerse 拖成半屏或三分之一屏时，它会自动退回单栏，不会挤成一团。 常驻侧边栏 ​ 宽屏进入聊天页时，会话列表和文件树直接固定在左侧，无需每次滑出。此时标题栏的汉堡键会消失（侧栏已常驻）。 点文件树里的文件、或者选中另一个会话，侧栏都不会收起，可以连续点着看。 并排的工作台 ​ 宽屏下聊天页右侧可以并排显示一个面板： 点标题栏的 终端 图标 → 右栏开终端，再点一次收起 点标题栏的 Git 图标 → 右栏开 Git 面板，再点一次收起 点文件树里的文件，或点 AI 回复里的文件路径链接 → 右栏打开代码编辑器（文件树里的图片改为全屏预览、APK 改为系统安装器） 右栏当前开的是哪个，标题栏对应图标会高亮显示。 一边看 AI 改代码、一边在右侧核对文件内容或执行命令，无需来回切换页面。 调整宽度 ：拖动中间的竖线，可以在三七和七三之间任意调整，比例会记住。 关掉右栏 ：点右栏左上角的 ✕，或者按一次返回键。编辑器里有未保存的修改时，仍然会先弹出保存提示；点文件树里的另一个文件、或把右栏换成终端 / Git，同样会先问一句要不要保存，不会默默丢掉改动。 设置页双栏 ​ 宽屏打开设置后，左边是设置项列表（一直显示），右边是选中项的内容。切换设置项时只有右半边变化，不再整页跳转。左上角的返回箭头用于离开设置回到聊天。 旋转和分屏不再中断 ​ 横竖屏切换、拖动分屏大小时，界面会跟着重新排布，但不会重新加载： 终端里运行着的命令继续执行，输出不丢 编辑器里未保存的修改还在 聊天列表停在原来的位置 阅读宽度 ​ 宽屏下聊天内容不会拉满整个屏幕，而是限制在适合阅读的宽度并居中——单行文字过长会增加阅读负担。右栏打开后左半边变窄，内容会自动跟着收窄。 鼠标与触控板 ​ 连接鼠标时，把指针移到分栏竖线上会变成拖拽光标，按住左右拖动即可调整两栏宽度。"}, {"url": "/guide/default-models", "title": "默认模型 - 手机端 AI 编程工具与终端", "text": "默认模型 ​ 「设置 → 默认模型」里除了新会话使用的默认模型，还可以给几个特定用途单独指定模型。 识图模型 ​ 当前聊天模型支持视觉时，图片会直接附加到当前对话，由聊天模型分析；聊天模型不支持视觉时，才使用这里的配置建立独立识图会话。 跟随当前聊天模型 （默认）：独立识图会话也使用当前聊天模型，需确保模型支持图片输入。 指定专用模型 ：独立识图会话使用指定模型，适合聊天模型不支持图片的情况。配置的供应商需已启用并填写 API Key，否则回退到当前聊天模型。 列表里每个模型旁边会标注是否支持图片输入，供你参考。注意这里 不做强制拦截 ：如果你选了一个不支持图片的模型，识图会失败，AI 会收到错误信息并自行处理（通常会提示你换一个模型）。 识图的用法上有几点值得知道： AI 一次最多可以传入 5 张图片 做对比分析。 直接附图时，继续在当前聊天中追问即可；独立识图会生成会话标识，AI 可沿用该会话追问，保留之前看过的图和问答。 默认清晰度与原图优先模式均优先保留不超过 4 MiB 的 JPEG、PNG、WebP、GIF 原文件；其他图片转为最长边不超过 1536 像素 的 JPEG。 低清模式将图片转为最长边不超过 512 像素 的 JPEG，适合节省 token。 生图模型 ​ 设置 generateImage 工具使用的模型，支持 OpenAI 和 Gemini 兼容接口。 OpenAI 兼容接口支持尺寸、数量、画质、背景、风格和输出格式等参数。 Gemini 兼容接口使用模型默认尺寸与分辨率；生成多张图片时会调用多次。 图片默认保存到 ~/.aiverse/generated-images/ ，也可指定工作区路径。单张图片上限 20MB，单次调用总计上限 48MB。 图像模型对话生图 ​ 通过 Gemini 兼容接口接入支持图像输出的聊天模型后，可直接生成图片、上传参考图，并在后续对话中继续修改生成结果。 子代理模型档位 ​ AI 派发子代理时，会按任务难度选一个档位，而不是固定用同一个模型。这里定义「哪个档位对应哪个模型」： 档位 适合的活 轻量 只读探索、批量定位、机械改名 均衡 单文件修改、常规 bug 修复 强力 跨模块重构、疑难排查、方案设计 每档都可以选「未配置」： 只配你用得到的档位即可 ，未配置的档位会自动降级（见下）。 每个档位可指定任意已启用提供商下的任意模型，支持按模型名搜索——接中转站时上百个模型也能找到。 优先级：子代理定义里写死了模型时，以定义为准（档位被忽略）；否则用 AI 选的档位。 降级顺序：请求的档位未配置或对应提供商被删除/停用 → 退到「均衡」档 → 仍未配置则继承当前会话模型。发生降级时，AI 会在工具结果里收到具体说明，你也能在对话里看到它按哪个模型继续。 删掉某个提供商时，引用它的档位会自动清空，不会留下指向空模型的配置。 标题总结模型 ​ 新会话发出第一条消息后，AiVerse 会自动给会话生成一个标题。这里可以指定专门用于该任务的模型。 跟随当前聊天模型 （默认）。 指定专用模型 ：建议选一个便宜快速的小模型，标题这种活不需要好模型。 标题生成在后台异步进行，不会拖慢你的对话。如果生成失败或者取不到结果，会保留系统按首句截断的临时标题，不影响使用。 生成标题用的提示词也可以自行修改，方式见「自定义提示词」。"}, {"url": "/guide/general", "title": "偏好设置 - 手机端 AI 编程工具与终端", "text": "偏好设置 ​ 「设置 → 通用设置 → 偏好设置」收纳了不针对具体供应商、也不属于特定用途的全局偏好开关。改动即时生效，无需保存。 模型 ​ 拉取模型后自动移除无效模型 （默认开启） 开启时：在 供应商编辑页 点「拉取模型」，只要服务端成功返回模型列表，本地列表里那些服务端已不再返回的模型就会被自动移除，并弹出提示告知移除了几个。 请求失败或服务端返回空列表时不会动本地列表，避免网络异常将已添加的模型清空。 手动添加的模型如果恰好不在服务端返回结果里，也会被一并移除。介意这一点可以关掉开关。 关掉后，拉取只负责把新模型列出来供你勾选，不再改动已有列表。 自动压缩阈值 （默认 85%，可填 1-100 的整数） 预计下一次请求用到模型可用输入预算的这个比例时，自动触发上下文压缩（把早期对话摘要成接手摘要）。预算会考虑模型输入上限，并为回复保留空间，因此不一定等于模型标称的总窗口。调大则更晚压缩；调小则更早压缩、但摘要更频繁。即使设为 100%，也不能绕过输入硬限制。 会话 ​ 启动时会话 （默认「新开会话」） 新开会话 ：每次打开 App 都从新会话开始。当前工作区如果还留着一个没发过消息的空会话，会直接复用，不会再新建一个。 打开最近会话 ：直接进入当前工作区里最近更新的那个会话，接着上次继续。该工作区还没有任何会话时会新建一个。置顶会话不会优先——即使有置顶会话，也仍进入最近更新的那个。 切换工作区时也按同一个偏好处理。 删除外部工作区聊天记录 （默认关闭） 控制移除「添加外部工作区」加进来的外部本地工作区时，聊天记录如何处理。开启后，移除外部本地工作区会一并删除它的会话与消息；关闭则只解除关联、保留聊天记录，之后重新添加同一目录仍可看到历史。 应用内置工作区与远程工作区的删除不受该开关影响：删掉它们时，目录与聊天记录都会一并删除。 输入 ​ 回车键发送消息 （默认关闭） 开启后软键盘的回车键变成发送键，按一下即发出；关闭时回车是换行，由发送按钮发出。多行输入时建议保持关闭。 网络 ​ 两个超时都以秒为单位，在输入框里填数字即可， 填 0 表示不限制 ；保存后对之后的请求立即生效，无需重启。 首字超时 （默认 300 秒） 每次请求尝试开始后，等待首个有效内容（正文、思考或工具调用）的最长时间，包含等待服务端响应头的时间。超过即取消本次请求，并按重试次数设置重新尝试；每次重试重新计时。慢启动、长思考的模型可以调大。收到首个有效内容后，此超时不再限制后续回复时长。 数据块间隔超时 （默认 300 秒） 流式回复过程中，相邻两个响应块之间允许的最长等待。超过即断开连接并按重试次数重新尝试，避免服务端停止推送时本轮一直停在「执行中」；模型出块较慢时可适当调大。 重试次数 （默认 6） 应用会定期探测 HTTP/2 连接，发现连接失去响应时断开并按重试设置处理；HTTP/1.1 连接不支持此探测。界面显示「正在重试」时，可能正在等待退避，也可能已发出下一次请求、正在等待内容。 网络请求失败后的指数退避重试次数（不含首次请求，等待从 0.5 秒起步、按 2 倍递增、单次最长 10 秒）。同一次请求即使已输出部分内容后再次断线，网络重试次数也会累计，不会重新计数。填 0 表示失败直接报错、不重试；同时受多 Key 自动切换影响——被归为 Key 失效的失败会先尝试换 Key 重发。 工具 ​ sendFile 单文件上限 （默认 100MB，可填大于 0 的整数） AI 用 sendFile 把文件发到聊天区时，单个文件允许的最大体积。超过上限的文件不会被发送，AI 会收到失败原因。调大可以发更大的文件，但单个文件会先拷贝到应用私有目录再展示，过大可能占用较多存储。"}, {"url": "/guide/mcp", "title": "MCP 服务器 - 手机端 AI 编程工具与终端", "text": "MCP 服务器 ​ MCP（Model Context Protocol）让 AI 接入外部工具——查数据库、搜网页、控制浏览器之类。连上之后这些工具会自动出现在 AI 的工具列表里，像内置工具一样调用。 入口在「设置 → MCP 服务器」。 两级作用域 ​ MCP 配置分全局和项目两级： 全局 ：所有项目共享，配置存在 ~/.aiverse/mcp.json 。 项目级 ：只在当前工作区生效，配置存在 <工作区>/.aiverse/mcp.json ，可以随项目一起提交到 git。 实际生效的是两者合并的结果， 项目级优先 ——同名的服务器，项目里的配置会覆盖全局的。 服务器列表 ​ 每行显示服务器名称、来源（全局 / 项目）、类型（内置 / HTTP）、连接状态，已连接时还会显示工具数量，本地 stdio 服务未连接时显示启动命令；要求 OAuth 授权且尚未登录时会显示「需要登录」。 点行进入编辑。 左滑露出删除按钮，删除作用于该行标注的作用域。 右上角「重新连接」一键重连所有服务器，「+」添加新服务器。 当服务器数量较多时，可在顶部搜索栏按名称、地址或命令快速过滤。 批量操作 ​ 列表右上角的「多选」按钮（方框带勾的图标）可以一次处理多台服务器： 点「多选」进入多选模式，每行左侧出现勾选框，整行点击即勾选。 顶部操作条提供「启用 / 停用」、重连（环形箭头图标）与删除（垃圾桶图标），最右「×」或系统返回键退出多选。 「全选」只勾中 当前搜索过滤后 的服务器；改了搜索词，被过滤掉的条目会自动取消勾选，不会误删看不见的条目。 删除会弹确认框，确认后这些服务器从各自作用域的配置里移除并断开连接；启用 / 停用会立即重连生效，可以边看状态边继续调整。 多选模式下不能点击进入编辑页，也不能左滑删除单条。 如果你在容器内或用外部编辑器直接改了 mcp.json ，App 会在几秒内自动发现并刷新：新增或启用的自动连接，删除或禁用的自动断开，不需要重启。 添加服务器 ​ 编辑页顶部先选 作用域 （新增时默认「项目」，编辑已有条目保持原作用域），下面的「是否启用」控制它是否参与连接。剩下的字段按传输类型分两种。 名称 只作别名，但它会拼进给模型的工具名（ mcp__名称__工具名 ），因此只能含字母、数字、下划线、连字符；填了中文之类的字符会提示错误且无法保存。 远程 HTTP ​ 名称 ：别名，例如 fetch 、 github 。 服务器地址 ：远程服务端的 Streamable HTTP 链接。 自定义请求头 ：键值对，用来填认证 Token 这类固定头部。 OAuth 登录 ​ 有些远程服务要求 OAuth 授权（连接时返回 401，列表里显示「需要登录」）。在编辑页打开「OAuth 认证」开关并保存，然后点「登录 / 重新授权」： App 会打开系统浏览器，跳转到该服务的登录页。 用你的账号完成授权，浏览器会提示「授权完成，可以返回 AiVerse」。 回到 App，服务器会自动用新令牌重连，状态变为「已连接」。 大多数服务支持自动注册客户端，无需额外填写。若服务不支持（例如 GitHub 这类），可在「高级认证选项」的「client_id」中填入事先注册好的客户端 ID。 「授权服务器」一般留空，App 会自动发现；自动发现失败时可手动填写。 授权进行中时，若需要中止操作，可直接点击「取消授权」。 令牌过期后 App 会自动刷新；要换账号时点「退出登录」再重新授权。 授权令牌保存在 App 内部存储（ aiverse/mcp-oauth.json ），做了混淆处理但不属于加密存储，请勿在共享设备上用敏感账号授权。 本地 stdio ​ 名称 ：别名。 启动命令 ： npx 、 node 、 python 之类。 命令参数 ：逐项添加，例如 -y 、 @modelcontextprotocol/server-xxx 。 环境变量 ：传给该进程的键值对，例如 API_KEY。 stdio 服务器需要在容器里运行：本地模式下运行在当前容器上，远程 SSH 模式下运行在「默认容器」上。切换容器后所有 stdio 服务器会自动断开并用新容器重连，HTTP 服务器不受影响。 工具管理 ​ 连接成功后，编辑页的「工具」标签页会列出这个服务器提供的所有工具，每个工具一张卡片，显示描述和参数名。 顶部支持通过搜索栏按工具名或描述关键字实时筛选。 支持一键「全部启用」或「全部禁用」，方便快速批量管理。 右上角的开关可以 单独禁用某个工具 ，禁用后它不再提供给模型，能省一些上下文。 MCP 工具和内置工具走同一套权限机制：默认每次调用都要你确认，可以在授权弹窗里选「始终允许」记住。 没检测到工具时点右上角刷新重新拉取。 编辑页右上角的日志按钮可以跳到「日志」页并自动按这个服务器名过滤，排查连接失败问题时很有用。 让 AI 代为配置 ​ 复杂的 MCP 配置可以直接交由 AI 完成，其管理工具可指定安装到全局或项目。新增或移除后配置 在下一次会话生效 （新建会话时会自动连接未连接的服务器）。"}, {"url": "/en/download", "title": "Download AiVerse", "text": "AiVerse ← Back to Home Download AiVerse Detect the latest version from GitHub (including pre-releases), then pick the package that fits your device. Checking the latest version… Fetching release info from GitHub… View all versions on GitHub →"}, {"url": "/en", "title": "AiVerse - AI Coding Tool & Linux Terminal on Android", "text": "AiVerse AI Coding Tool & Mobile Workstation on Your Phone No computer needed — write, debug and commit entirely from your phone. A built-in Linux container and terminal let the AI Agent read/write files, run shell commands and execute builds on its own, with Git, MCP, remote SSH and a full model ecosystem. Quick Start Download APK GitHub GitCode"}, {"url": "/en/terms", "title": "User Agreement - AI Coding Tool & Terminal on Android", "text": "AiVerse User Agreement ​ Last updated: October 23, 2026 AiVerse (\"the App\") is an open-source AI coding tool for Android maintained by the Developer. This agreement explains your rights, obligations, and important risks when using the App. Please read it together with the Privacy Policy . 1. Reading and Consent ​ Before using the App, read this User Agreement and the Privacy Policy and decide whether to agree. Choosing \"Agree and continue\" saves your consent status; declining exits the App. You can view both documents at any time through the \"User Agreement\" and \"Privacy Policy\" entries under Settings → About. This agreement applies to use of the App. It does not replace third-party terms or restrict rights you have under applicable law or GPL-3.0. 2. Features and AI-Generated Content ​ The App provides AI chat and coding assistance, file editing, a terminal and local Linux container, Git, remote SSH, a browser, MCP, skills, subagents, and backups. Available capabilities depend on your device, configuration, permissions, and connected services. AI-generated code, commands, explanations, images, and other content may contain errors, omissions, security vulnerabilities, infringement risks, or material unsuitable for your circumstances. AI responses are not guarantees of accuracy, security, legality, or fitness for purpose, and should not replace necessary professional judgment. Review content before adopting, executing, publishing, or deploying it, and test, verify sources, and obtain authorization as needed. 3. Commands, Files, and Server Operations ​ Within your selected operating mode and permissions, AI and tools may read, modify, overwrite, or delete files; execute commands; install dependencies; access networks; operate Git repositories; and connect to or modify remote servers. Some operations may run in sequence without a separate confirmation for every step. Incorrect instructions, model errors, untrusted project content, or third-party tools may cause data loss, credential exposure, service interruptions, damaged configurations, or unexpected charges. Permission controls, checkpoints, and undo features cannot guarantee prevention or recovery of every loss. A local container does not provide absolute isolation from mounted directories, network resources, or remote servers. Ensure that you are authorized to operate on the target devices, directories, repositories, and servers, and limit tool permissions as appropriate. Take particular care with deletion, overwriting, pushing, deployment, system commands, and production environments. Do not place secrets you do not want sent to third parties in files, rules, or command output that AI can read. 4. Lawful Use and Others' Rights ​ Comply with applicable laws, respect others' privacy, intellectual property, and system security, and follow legally valid service agreements. Do not use the App for unauthorized intrusion, data theft or disclosure, malware distribution, fraud, or other unlawful or inf"}, {"url": "/en/privacy", "title": "Privacy Policy - AI Coding Tool & Terminal on Android", "text": "AiVerse Privacy Policy ​ Last updated: October 23, 2026 AiVerse (\"the App\") is an open-source AI coding tool for Android, licensed under GPL-3.0. This policy explains how the App handles your information. The developer does not use a developer-operated application backend to collect or centrally store your chats, workspace files, or credentials, and does not sell this data. The App primarily stores settings and sessions on your device, but this does not mean all data is processed only locally: AI, web search, remote server, and remote backup features send relevant content to the respective services. The App also makes network requests for updates and public configuration data. 1. Accounts and Information Collection ​ The App has no AiVerse account system and does not require an AiVerse account. Third-party integrations such as GitHub may require sign-in or authorization with those services and store authorization credentials on your device. The App ships with no analytics, tracking, advertising, or crash-reporting SDKs . It does not automatically upload your activity records, chat content, or logs for usage analytics or advertising. The App records runtime and crash diagnostics locally, as described in Section 2. Local recording does not mean automatic uploading. The developer does not remotely read your device data through the App. If you submit an issue, copy crash information, or share logs, that content is provided to your chosen recipient. Review it and remove sensitive information first. 2. Storage Locations and Logs ​ The App handles the following types of data: Settings and credentials : model providers, API keys, service endpoints, and connection and authorization information for servers, Git, backups, and other configured services. Chats and AI context : chat records, session history, attachments, project rules, memories, and tool results. Workspace and environment files : code, files, container images, and local Linux environment data. Preferences, diagnostic logs, and backup files. Settings and sessions are primarily kept in the App's private storage; logs may be stored in its app-specific external storage directory. Default local workspaces reside in private storage, but external workspaces remain in the device directories you select, and remote workspaces reside on the target server. Exports and backups are saved to your chosen locations, which are not necessarily private to the App. Logs may contain sensitive content. AI request and response logs record request URLs, conversation context, code, tool results, model replies, and errors. The App redacts some media content, but does not guarantee detection or removal of passwords, tokens, or personal information in text, URLs, or tool output . Crash diagnostics may also include device model, operating system version, memory information, and stack traces; these are not automatically reported. Runtime and AI logs have size limits and old-file cleanup mechanisms. When logging is initializ"}, {"url": "/en/guide/overview", "title": "Feature Overview - AI Coding Tool & Terminal on Android", "text": "Feature Overview ​ This page is a quick index of the user manual, mapping the main UI workflows and settings entries to their documentation. Version notes Entries marked with a version (e.g. \"since 1.11.0\") were introduced in that version. Core Workflows & Main UI ​ Feature Description Chat & workspace Title bar, sidebar, toolbar, message queue, workspace switching Modes (four modes) Permission control and use cases for Build / Plan / Auto / Expert Checkpoints & undo Automatic snapshot before AI edits, one-tap safe rollback Terminal Multi-tab sessions, auxiliary key bar, color and font settings File browsing & code editing Indented tree view, syntax highlighting, built-in code editor (since 1.11.0) Git version management Visual status management, branch switching, commit history, revert and delete (since 1.11.0) Tablet & large screen Responsive split panes, persistent sidebar, side-by-side workbench (since 1.11.0) Settings ​ AI Configuration & Extensions ​ Entry Description AI Vendors Connect model services, manage model lists, multi-key mode (since 1.11.0), thinking effort Default & dedicated models Default model for new sessions, plus dedicated models for image recognition, image generation and title summarization MCP servers Connect external tools, global and project-level configuration Skills On-demand specialist extension packs Subagents Spawn independent sessions to run tasks in parallel; create, edit, enable and disable in settings, with custom models and tool sets (since 1.11.0) Custom prompts Override and customize AI system prompt fragments Memory & project rules Cross-session long-term memory, plus AGENTS.md / CLAUDE.md project rules Runtime ​ Entry Description Container & images Local Linux container, custom images, mounting phone directories, remote SSH backend Network proxy Global proxy and vendor-level proxy (since 1.11.0) Connection & sync SFTP / FTP channels, workspace sync, built-in FTP server Tools & Permissions ​ Entry Description Tool authorization Rules for which tools the AI may call System permissions Keep-alive, screen always on, notifications, storage, battery optimization Logs View runtime logs, crash reports, access the app private directory Appearance & Language ​ Entry Description Theme, wallpaper, language Light/dark theme, preset colors, Monet color extraction, wallpaper, multi-language System ​ Entry Description Token stats Usage, cost estimation, call details Storage Per-category usage of chats, containers, workspaces, and cleanup of temporary data Backup & restore Encrypted export/import of configuration and workspaces About Version info and update checks; separate User Agreement and Privacy Policy entries open in the system browser User Agreement Usage rules, AI and operational risks, third-party fees, and open-source rights Privacy Policy Data storage, network transfers, logs, backups, and deletion Advanced Tutorials ​ Topic Description Building Android apps in the container Set up JDK and Android SDK, build an APK fr"}, {"url": "/en/guide/quick-start", "title": "Quick Start - AI Coding Tool & Terminal on Android", "text": "Quick Start ​ From installation to your first AI conversation. System Requirements ​ Android 8.0 (API 26) or higher arm64-v8a or x86_64 device Download & Install ​ Download from GitHub Releases . Pick the package that fits your device: Package Best for armsolo Real devices (arm64), smallest size x86solo Emulators and Chromebooks (x86_64) universal Both architectures in one package, larger size Pick the right architecture A mismatched architecture will break the built-in container. If you are not sure, use universal . 1. First Launch & Onboarding Guide ​ Open AiVerse and you will land on the chat home with a fresh empty conversation. Grant storage permission on first use — otherwise the AI cannot access files on your phone. On first launch, the app automatically starts an interactive spotlight onboarding guide, walking you through the complete flow: \"Open sidebar → Enter Settings to configure a vendor and fetch models → Return home to select model → Send first message\". In each step, you can tap the highlighted target or the \"Next\" button on the card to proceed, or tap \"Skip\" at any time. If you want to review the walkthrough later, you can restart it anytime via \"Settings → Re-run onboarding\". 2. Configure an AI Vendor ​ AiVerse does not provide models itself; you need to connect a model service first. Tap the menu button at the top-left of the home page to open the sidebar, then tap \"Settings\" at the bottom. Go to \"AI Config → AI Vendors\" and tap the + at the top-right to create one. Fill in four fields: Name : an alias, e.g. \"OpenAI Official\". Upstream Format : pick one of OpenAI / Anthropic / Gemini . Third-party relay services usually use OpenAI . API Key : your key, like sk-xxx . Base URL : the API root. The official URL is pre-filled once you pick an upstream format; when using a third-party relay, clear the default and enter the relay's address. Note: do not include /v1 or anything after it . The entry saves automatically — no manual save button. 3. Add Models ​ Tap the vendor you just created to open its edit page, then switch to the \"Models\" tab at the bottom. Two ways to add models: Tap \"Fetch Models\" to sync the available list from the server and check the ones you want. Tap + at the top-right to type a model name manually (e.g. gpt-4o ). Use this when a relay doesn't return the full model list. Optional: tap a model row to edit its metadata (context window, pricing, and capability toggles like image input and tool calls). Models save automatically after being added. 4. Select a Model ​ Back on the chat home, tap the model button in the toolbar above the input box and pick the model you just added. The search box at the top filters models, and models are grouped by vendor. 5. Prepare the Execution Environment ​ Go to \"Settings → Runtime → Container & Images\". Two choices: Local container (default): uses the built-in Alpine Linux, nothing to configure. Remote SSH : use a remote server as the execution backend (see Remote SSH mode in the"}, {"url": "/en/guide/providers", "title": "AI Vendors & Models - AI Coding Tool & Terminal on Android", "text": "AI Vendors & Models ​ AiVerse does not provide models itself — you need to connect at least one model service before you can start chatting. This page covers how to set it up. The entry point is \"Settings → AI Vendors\". Adding a Vendor ​ Tap + at the top-right, and a bottom sheet slides up with two tabs: \"Manual Setup\" and \"Ready to Use\". Manual Setup tab: lists mainstream model services (OpenAI, Anthropic, DeepSeek, Zhipu, Qwen, etc.) in a unified list, with Custom Vendor as the first entry (configure from scratch). Picking a built-in vendor pre-fills the name, upstream format and Base URL — just add your API Key in the edit page and it works. You can also modify any field. Ready to Use tab: free model services that need no registration are a placeholder for now and will be opened in a future release. For custom setup, three fields are enough: Upstream Format , API Key and Base URL . Upstream Format : pick one of OpenAI / Anthropic / Gemini — it decides which protocol is used for requests. For third-party relay services, OpenAI is almost always the right choice. API Key : your key, like sk-xxx . Extra spaces or newlines around it are cleaned automatically on save. Base URL : only the API root address, do not include /v1 or any path after it . Leave it empty to use the official address for the upstream format. API path : the request path right after the Base URL, defaults to /chat/completions — usually you don't need to change it. Name : a recognizable name for this config, e.g. \"My relay\". The list auto-matches a brand icon by name (enter DeepSeek and you get DeepSeek's icon). After setup, switch to the \"Models\" tab to fetch models, then you can head back to the home page and start chatting. Managing the Vendor List ​ Each row shows the name, upstream format, model count and enabled status. Tap a row to open its edit page. Swipe a row left to reveal a red delete button. Long-press and drag the name or upstream format area to reorder; the order survives restart. Batch operations ​ The Select button at the top right (the check-square icon) lets you handle several vendors at once: Tap Select to enter multi-select mode: a checkbox appears on the left of each row and tapping anywhere on the row toggles it. An action bar appears on top with \"N selected\", Enable / Disable / Delete , and an × on the right to leave multi-select mode (the system back gesture does the same). Select All picks every vendor in the list; tap again to deselect all. Delete asks for confirmation first, then removes all selected vendors and leaves multi-select mode. While in multi-select mode, drag-to-reorder is disabled and tapping a row only toggles selection — leave the mode to edit a vendor. Multi-Key Mode ​ Version note Multi-key mode is available since 1.11.0. If you hold multiple keys for the same service, turn on Multi-Key Mode in the \"Options\" of the edit page. When rate-limited or out of quota, the next key is tried automatically. The single-key input hides once enabled,"}, {"url": "/en/guide/free-providers", "title": "Free Vendors - AI Coding Tool & Terminal on Android", "text": "Free Vendors ​ Want to try AI coding on a budget? The platforms below offer free quotas or promotional tokens — register and connect them in AiVerse. Free quotas are usually time-limited; once exhausted or expired you may need to top up, per each platform's rules. MiMo Open Platform (Xiaomi) ​ Platform : Xiaomi MiMo open platform Sign-up : platform.xiaomimimo.com (invite code 66QSUD ) Notes : Xiaomi's in-house MiMo series (MiMo V2.5 and others). Register to apply for an API Key. New user bonus Sign up through the referral link above to get ¥10 in trial credit and 10% off the first order; the credit is valid for 40 days. SenseNova (Riyi Xin) ​ Platform : SenseNova open platform (SenseTime) Sign-up : platform.sensenova.cn Notes : SenseTime's LLM platform. Register and log in to apply for an API Key. Public beta free Currently in public beta, the token plan is free. TokenRhythm (OpenSquilla) ​ Platform : TokenRhythm Website : tokenrhythm.studio Notes : Unified multi-model API platform with the OpenSquilla smart router. Register to apply for an API Key. New user bonus Complete real-name verification first; once verified you receive ¥18 in trial credit. SiliconFlow ​ Platform : SiliconFlow open platform Referral link : cloud.siliconflow.cn/i/HNDIQWXd Notes : Registering through the referral link and completing real-name verification grants free quota. The campaign runs until the end of the year; check the platform announcement for details. Real-name verification New users must register and complete real-name verification before receiving the bonus quota. Agnes AI ​ Platform : Agnes AI (Sapiens AI team, Singapore) Sign-up : platform.agnes-ai.com Notes : Full-modality AI platform — text, image and video model APIs are free indefinitely with OpenAI-compatible endpoints. Register and apply for an API Key. All-modality free Text, image and video model APIs are all free, with basic rate limits and fair-use quotas. See platform rules for details. Connecting in AiVerse ​ Once you have a platform's API Key and Base URL, follow AI Vendors & Models to configure it: Open \"Settings → AI Vendors\" and tap + at the top-right. Fill in the upstream format, API Key and Base URL (the address should not include /v1 ). Switch to the \"Models\" tab to fetch models, then head back to the home page to start chatting. If a platform has special requirements for the upstream format or Base URL (e.g. OpenAI-compatible or Anthropic-compatible endpoints), follow the platform's documentation."}];
function vDoSearch(){
  var inp=document.getElementById('vsearch-input');
  var box=document.getElementById('vsearch-results');
  var q=(inp.value||'').trim().toLowerCase();
  if(!q){box.innerHTML='';return;}
  var out=[];
  for(var i=0;i<VINDEX.length;i++){
    var it=VINDEX[i];
    var hay=(it.title+' '+it.text).toLowerCase();
    if(hay.indexOf(q)>=0) out.push(it);
  }
  if(out.length===0){box.innerHTML='<div class="v-none">未找到与「'+q+'」相关的内容</div>';return;}
  var h='';
  for(var j=0;j<out.length && j<30;j++){
    var o=out[j];
    var pos=(o.text||'').toLowerCase().indexOf(q);
    var snip;
    if(pos>=0){var st=Math.max(0,pos-40);snip=(st>0?'…':'')+(o.text||'').substr(st,140)+(st+140<(o.text||'').length?'…':'');}
    else{snip=(o.text||'').substr(0,120);}
    h+='<a class="v-result" href="'+o.url+'"><div class="v-result-title">'+o.title+'</div><div class="v-result-snippet">'+snip+'</div></a>';
  }
  box.innerHTML=h;
}
document.addEventListener('DOMContentLoaded',function(){
  var inp=document.getElementById('vsearch-input');
  if(!inp)return;
  inp.addEventListener('input',vDoSearch);
  var m=location.search.match(/[?&]q=([^&]*)/);
  if(m){inp.value=decodeURIComponent(m[1].replace(/\+/g,' '));vDoSearch();}
  var sb=document.querySelector('.VPLocalSearch .button, .v-search-btn, .DocSearch-Button');
  if(sb){sb.addEventListener('click',function(e){e.preventDefault();inp.focus();});}
});

</script>
