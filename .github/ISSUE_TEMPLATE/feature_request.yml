name: 功能需求
description: 为 AiVerse 提出一个新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 描述你在什么情况下需要这个功能？它解决了什么问题？
      placeholder: "例如：当我在手机上同时管理多个项目时，..."
    validations:
      required: true

  - type: textarea
    id: expectation
    attributes:
      label: 期望的解决方案
      description: 你希望这个功能如何工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他备选方案
      description: 你考虑过其他替代方案吗？
    validations:
      required: false
