name: Nightly Build

# 每小时（北京时间）自动构建最新 main 的 beta 测试包（三架构）并上传到 Actions artifact。
# 目的：测试的人随时能拿到最新构建，且能尽早发现编译挂了。只传 artifact，不发 GitHub Release。
# beta = 继承 release 的正式签名 + R8，包名 com.aiverse.beta（与正式版同机共存、互不覆盖）；
# 签名校验生效，但测试包不参与检查更新（见 SettingsViewModel.isTestPackage），不会把测试机导向正式包。
on:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时（UTC 0/6/12/18 整点，对应北京时间 8/14/20/2 点）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 迁移对账
        run: python3 scripts/check_migrations.py

      # beta 继承 release 的签名配置，需先从仓库 Secrets 还原签名密钥（与 android-release.yml 一致，不入库）。
      - name: 还原 release 签名（从仓库 Secrets 注入）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "$KEYSTORE_B64" | base64 -d > app/AiVerse.jks
          printf 'storeFile=AiVerse.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > app/keystore.properties

      # 三架构 beta 包：universal（通用，含 arm+x86 两套镜像）/ armsolo（arm64 真机）/ x86solo（x86_64 模拟器）
      - name: 构建 beta 测试包（三架构，正式签名）
        run: |
          ./gradlew :app:assembleUniversalBeta :app:assembleArmsoloBeta :app:assembleX86soloBeta

      - name: 收集产物
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/universal/beta/app-universal-beta.apk "dist/AiVerse-universal-beta.apk"
          cp app/build/outputs/apk/armsolo/beta/app-armsolo-beta.apk "dist/AiVerse-arm64-beta.apk"
          cp app/build/outputs/apk/x86solo/beta/app-x86solo-beta.apk "dist/AiVerse-x86_64-beta.apk"
          ls -la dist/

      - name: 输出构建信息到运行摘要
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "## Nightly 构建（beta 测试包）" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: `$SHA`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 构建: beta（正式签名 + R8，包名 com.aiverse.beta，与正式版独立共存）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 三架构: universal / arm64 / x86_64" >> "$GITHUB_STEP_SUMMARY"
          echo "- 测试包不参与检查更新（无应用内升级，避免导向正式包）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 下载: 下方 artifact（aiverse-beta）" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiverse-beta
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
